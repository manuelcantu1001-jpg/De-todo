name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sobremesa va en la RAIZ del sitio, no en /sobremesa/.
      # No es capricho: la app instalada en los telefonos apunta a la raiz.
      # Moverla de direccion desinstalaria de hecho las que ya existen.
      - name: Sobremesa (raiz)
        run: |
          mkdir _site
          cp sobremesa/index.html sobremesa/banco-es.js sobremesa/vocab-es.js \
             sobremesa/lexico-es.txt.gz sobremesa/manifest.webmanifest sobremesa/sw.js _site/
          cp -r sobremesa/icons sobremesa/comun sobremesa/juegos _site/

      - name: ReParte (/reparte/)
        run: |
          mkdir -p _site/reparte
          cp reparte/index.html reparte/manifest.webmanifest reparte/sw.js _site/reparte/

      - name: Tier list (/tier-list/)
        run: |
          mkdir -p _site/tier-list
          cp tier-list/index.html _site/tier-list/

      - name: Rematar
        run: |
          touch _site/.nojekyll
          echo "Publicando:"; find _site -maxdepth 2 -name index.html | sort

      - name: Publicar en la rama gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
