name: Publicar en GitHub Pages

on:
  push:
    branches: [claude/juego-pulelo-idea-dyz035]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar sitio (solo los archivos de la app)
        run: |
          mkdir _site
          cp index.html dicc-es.js lexico-es.txt.gz manifest.webmanifest sw.js _site/
          cp -r icons _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
