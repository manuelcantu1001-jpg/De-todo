name: Publicar en GitHub Pages

on:
  push:
    branches: [claude/juego-pulelo-idea-dyz035]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar sitio (solo los archivos de la app)
        run: |
          mkdir _site
          cp index.html dicc-es.js lexico-es.txt.gz manifest.webmanifest sw.js _site/
          cp -r icons comun juegos _site/
          touch _site/.nojekyll
      - name: Publicar en la rama gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
