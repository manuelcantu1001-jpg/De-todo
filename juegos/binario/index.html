<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FBF6ED" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="description" content="Binario (Takuzu): llena la rejilla con dos colores sin tres seguidos y con mitades iguales." />
<title>Binario</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C0603A'/%3E%3Crect x='13' y='9' width='38' height='44' rx='6' fill='%23FBF6ED'/%3E%3Ctext x='32' y='42' font-size='24' font-family='Arial,Helvetica,sans-serif' font-weight='700' fill='%2333302B' text-anchor='middle'%3E01%3C/text%3E%3C/svg%3E" />
<link rel="manifest" href="../../manifest.webmanifest" />
<link rel="apple-touch-icon" href="../../icons/icon-180.png" />
<link rel="stylesheet" href="../../comun/estilo.css" />
<style>
  .bwrap { display: flex; justify-content: center; padding: 16px 14px 0; }
  .bgrid { display: grid; gap: 4px; width: min(92vw, 400px); }
  .bc {
    aspect-ratio: 1; border: none; border-radius: 12px; cursor: pointer; padding: 0;
    background: var(--card); box-shadow: var(--shadow); position: relative; transition: background .12s var(--ease);
  }
  .bc::after {
    content: ''; position: absolute; inset: 22%; border-radius: 999px; transition: all .12s var(--ease);
  }
  .bc.v0::after { background: var(--accent); }
  .bc.v1::after { background: var(--second); }
  .bc.dada { background: var(--soft); box-shadow: none; cursor: default; }
  .bc.dada::after { inset: 26%; }
  .bc.mal { outline: 2px solid var(--bad); outline-offset: -2px; }
  .leyenda { text-align: center; padding-top: 12px; font-size: 12.5px; color: var(--bg-sub); font-weight: 600; }
  .tools { margin: auto 16px calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; padding-top: 14px; }
  .tool { border: var(--trazo) solid var(--linea-fuerte); cursor: pointer; font-family: var(--title-font); font-weight: 600;
    font-size: 13px; padding: 10px 17px; border-radius: var(--pastilla); background: var(--card); color: var(--ink);
    box-shadow: var(--shadow-sutil); }
  .tool:active { opacity: .6; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>

<script src="../../comun/nucleo.js"></script>
<script>
'use strict';

const CFG = {
  facil:   { n: 6,  deja: 0.58 },
  normal:  { n: 8,  deja: 0.46 },
  dificil: { n: 10, deja: 0.40 },
  experto: { n: 10, deja: 0 },
};

const S = {
  diff: store.get('binario.diff', 'normal'),
  n: 0, sol: null, dado: null, celda: null,
  clock: makeClock(() => $('#clk')), jugando: false,
};

const REGLAS = `<p>Llena la rejilla con fichas <b>naranjas y azules</b> tocando cada casilla (un toque: naranja; dos: azul; tres: vacía).</p>
<p>Dos reglas: nunca <b>tres iguales seguidas</b> en fila o columna, y cada fila y columna lleva <b>la misma cantidad</b> de cada color.</p>
<p>Cada tablero tiene <b>solución única</b> y sale sin adivinar. Las casillas grises vienen dadas.</p>`;

/* ── Generador ───────────────────────────────────────────────────────── */
function genFull(n) {
  const g = new Array(n * n).fill(-1);
  const I = (r, c) => r * n + c;
  function ok(r, c, v) {
    if (c >= 2 && g[I(r, c - 1)] === v && g[I(r, c - 2)] === v) return false;
    if (r >= 2 && g[I(r - 1, c)] === v && g[I(r - 2, c)] === v) return false;
    let cnt = 1;
    for (let i = 0; i < c; i++) if (g[I(r, i)] === v) cnt++;
    if (cnt > n / 2) return false;
    cnt = 1;
    for (let i = 0; i < r; i++) if (g[I(i, c)] === v) cnt++;
    if (cnt > n / 2) return false;
    if (c === n - 1) {
      for (let i = 0; i < r; i++) {
        let same = true;
        for (let j = 0; j < n - 1; j++) if (g[I(i, j)] !== g[I(r, j)]) { same = false; break; }
        if (same && g[I(i, n - 1)] === v) return false;
      }
    }
    if (r === n - 1) {
      for (let j = 0; j < c; j++) {
        let same = true;
        for (let i = 0; i < n - 1; i++) if (g[I(i, j)] !== g[I(i, c)]) { same = false; break; }
        if (same && g[I(n - 1, j)] === v) return false;
      }
    }
    return true;
  }
  function bt(k) {
    if (k === n * n) return true;
    const r = Math.floor(k / n), c = k % n;
    for (const v of Math.random() < .5 ? [0, 1] : [1, 0]) {
      if (ok(r, c, v)) {
        g[k] = v;
        if (bt(k + 1)) return true;
        g[k] = -1;
      }
    }
    return false;
  }
  return bt(0) ? g : genFull(n);
}

// Líneas (filas y columnas) de un tablero n×n, cacheadas.
const LINEAS = {};
function lineasDe(n) {
  if (!LINEAS[n]) {
    const L = [];
    for (let r = 0; r < n; r++) L.push(Array.from({ length: n }, (_, c) => r * n + c));
    for (let c = 0; c < n; c++) L.push(Array.from({ length: n }, (_, r) => r * n + c));
    LINEAS[n] = L;
  }
  return LINEAS[n];
}

// Propagación lógica: solo hace deducciones forzadas (nunca adivina).
// Mutila `g` en el sitio. Devuelve false si el tablero se contradice.
function propagaBin(g, n) {
  const lineas = lineasDe(n);
  let cambio = true;
  while (cambio) {
    cambio = false;
    for (const L of lineas) {
      let c0 = 0, c1 = 0;
      for (const i of L) { if (g[i] === 0) c0++; else if (g[i] === 1) c1++; }
      if (c0 > n / 2 || c1 > n / 2) return false;
      for (let k = 0; k < n; k++) {
        if (g[L[k]] !== -1) continue;
        let v = -1;
        if (k >= 2 && g[L[k - 1]] !== -1 && g[L[k - 1]] === g[L[k - 2]]) v = 1 - g[L[k - 1]];
        else if (k < n - 2 && g[L[k + 1]] !== -1 && g[L[k + 1]] === g[L[k + 2]]) v = 1 - g[L[k + 1]];
        else if (k >= 1 && k < n - 1 && g[L[k - 1]] !== -1 && g[L[k - 1]] === g[L[k + 1]]) v = 1 - g[L[k - 1]];
        else if (c0 === n / 2) v = 1;
        else if (c1 === n / 2) v = 0;
        if (v !== -1) {
          g[L[k]] = v; cambio = true;
          if (v === 0) c0++; else c1++;
          if (c0 > n / 2 || c1 > n / 2) return false;
        }
      }
      for (let k = 0; k + 2 < n; k++) {
        if (g[L[k]] !== -1 && g[L[k]] === g[L[k + 1]] && g[L[k]] === g[L[k + 2]]) return false;
      }
    }
  }
  return true;
}

// ¿El tablero se termina entero solo con lógica? (y por tanto tiene solución única)
function saleSinAdivinar(dado, n) {
  const g = dado.slice();
  if (!propagaBin(g, n)) return false;
  return !g.includes(-1);
}

function genPuzzle() {
  const { n, deja } = CFG[S.diff];
  const sol = genFull(n);
  const dado = sol.slice();
  const minPistas = Math.ceil(n * n * deja);
  let pistas = n * n;
  // Vacía casillas mientras el tablero siga saliendo SIN ADIVINAR (dos pasadas).
  for (let pasada = 0; pasada < 2 && pistas > minPistas; pasada++) {
    for (const i of shuffle(dado.map((_, k) => k))) {
      if (pistas <= minPistas) break;
      if (dado[i] === -1) continue;
      const v = dado[i];
      dado[i] = -1;
      if (!saleSinAdivinar(dado, n)) dado[i] = v;
      else pistas--;
    }
  }
  S.n = n; S.sol = sol; S.dado = dado; S.celda = dado.slice();
}

/* ── Pantallas ───────────────────────────────────────────────────────── */
function renderSetup() {
  S.clock.stop();
  const bests = ['facil', 'normal', 'dificil', 'experto'].map((d) => {
    const b = store.get('binario.best.' + d, 0);
    return `<div class="b"><div class="bn">${b ? fmtTime(b) : '—'}</div><div class="bl">${DIFF_LABEL[d]}</div></div>`;
  }).join('');
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Binario', '')}
    <div class="g-setup scroll">
      <div class="card" style="padding: 14px 18px 18px;">
        <div class="row" style="border:none; padding-bottom: 8px;"><div class="row-title">Dificultad</div><div class="row-hint" id="d-hint"></div></div>
        ${diffSegHTML('seg-d', S.diff)}
      </div>
      <div class="label-sm" style="margin-top:4px;">Mejores tiempos</div>
      <div class="bests">${bests}</div>
      <button class="btn btn-primary" style="margin-top:8px;" id="new">Jugar</button>
      <button class="howto" id="howto">¿Cómo se juega?</button>
    </div>
  </div>`;
  const hint = () => { $('#d-hint').textContent = `${CFG[S.diff].n}×${CFG[S.diff].n}`; };
  hint();
  bindSeg('seg-d', (v) => { S.diff = v; store.set('binario.diff', v); hint(); });
  $('#new').onclick = () => { genPuzzle(); S.jugando = true; renderPlay(); S.clock.start(); };
  bindHowto(REGLAS);
}

function renderPlay() {
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Binario', `<span class="chip">${DIFF_LABEL[S.diff]}</span><span class="clock" id="clk">0:00</span>`)}
    <div class="bwrap">
      <div class="bgrid" id="bgrid" style="grid-template-columns: repeat(${S.n}, 1fr);">
        ${S.celda.map((v, i) => `<button class="bc" data-i="${i}"></button>`).join('')}
      </div>
    </div>
    <div class="leyenda">Sin tres seguidas · mitad y mitad en cada fila y columna</div>
    <div class="tools">
      <button class="tool" id="t-limpiar">Limpiar</button>
      <button class="tool" id="t-salir">Salir</button>
    </div>
  </div>`;
  $('#bgrid').onclick = (e) => {
    const b = e.target.closest('.bc');
    if (b) tap(Number(b.dataset.i));
  };
  $('#t-limpiar').onclick = () => { S.celda = S.dado.slice(); paint(); };
  $('#t-salir').onclick = () => { S.jugando = false; renderSetup(); };
  paint();
}

function paint() {
  const malos = conflictos();
  $$('.bc').forEach((el) => {
    const i = Number(el.dataset.i);
    const v = S.celda[i];
    el.className = 'bc' + (v === 0 ? ' v0' : v === 1 ? ' v1' : '') +
      (S.dado[i] !== -1 ? ' dada' : '') + (malos.has(i) ? ' mal' : '');
  });
}

function conflictos() {
  const n = S.n, g = S.celda, out = new Set();
  const I = (r, c) => r * n + c;
  for (let r = 0; r < n; r++) for (let c = 0; c + 2 < n; c++) {
    const a = I(r, c);
    if (g[a] !== -1 && g[a] === g[a + 1] && g[a] === g[a + 2]) { out.add(a); out.add(a + 1); out.add(a + 2); }
  }
  for (let c = 0; c < n; c++) for (let r = 0; r + 2 < n; r++) {
    const a = I(r, c);
    if (g[a] !== -1 && g[a] === g[a + n] && g[a] === g[a + 2 * n]) { out.add(a); out.add(a + n); out.add(a + 2 * n); }
  }
  for (let r = 0; r < n; r++) {
    let c0 = 0, c1 = 0;
    for (let c = 0; c < n; c++) { if (g[I(r, c)] === 0) c0++; else if (g[I(r, c)] === 1) c1++; }
    if (c0 > n / 2 || c1 > n / 2) for (let c = 0; c < n; c++) out.add(I(r, c));
  }
  for (let c = 0; c < n; c++) {
    let c0 = 0, c1 = 0;
    for (let r = 0; r < n; r++) { if (g[I(r, c)] === 0) c0++; else if (g[I(r, c)] === 1) c1++; }
    if (c0 > n / 2 || c1 > n / 2) for (let r = 0; r < n; r++) out.add(I(r, c));
  }
  return out;
}

function tap(i) {
  if (!S.jugando || S.dado[i] !== -1) return;
  S.celda[i] = S.celda[i] === -1 ? 0 : S.celda[i] === 0 ? 1 : -1;
  vibrate(6);
  paint();
  if (!S.celda.includes(-1) && conflictos().size === 0) ganar();
}

function ganar() {
  S.jugando = false;
  S.clock.stop();
  const t = S.clock.seconds;
  const best = store.get('binario.best.' + S.diff, 0);
  const isRecord = !best || t < best;
  if (isRecord) {
    store.set('binario.best.' + S.diff, t);
    store.set('bin.hub', `Mejor: ${fmtTime(t)}`);
  }
  confetti(); vibrate([30, 60, 30]);
  setTimeout(() => {
    openModal(`
      <h3>${isRecord ? '¡Récord!' : '¡Resuelto!'}</h3>
      <div class="stats" style="margin:14px 0;">
        <div class="stat"><div class="n">${fmtTime(t)}</div><div class="l">tiempo</div></div>
        <div class="stat"><div class="n">${fmtTime(isRecord ? t : best)}</div><div class="l">mejor</div></div>
      </div>
      <div class="m-actions">
        <button class="btn btn-primary" id="m-again">Otro tablero</button>
        <button class="btn btn-ghost" id="m-out">Salir</button>
      </div>
    `);
    $('#m-again').onclick = () => { closeModal(); genPuzzle(); S.jugando = true; renderPlay(); S.clock.start(); };
    $('#m-out').onclick = () => { closeModal(); renderSetup(); };
  }, 600);
}

renderSetup();
</script>
</body>
</html>
