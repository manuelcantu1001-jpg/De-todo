<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAF9F5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="description" content="Reflejos: toca las casillas que se encienden antes de que se apaguen." />
<title>Topos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23D97757'/%3E%3Crect x='13' y='9' width='38' height='44' rx='6' fill='%23FAF9F5'/%3E%3Ctext x='32' y='42' font-size='28' font-family='Arial,Helvetica,sans-serif' font-weight='700' fill='%23141413' text-anchor='middle'%3E◉%3C/text%3E%3C/svg%3E" />
<link rel="manifest" href="../../manifest.webmanifest" />
<link rel="apple-touch-icon" href="../../icons/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../comun/estilo.css" />
<style>
  .twrap { display: flex; justify-content: center; padding: 24px 16px 0; }
  .tgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: min(86vw, 340px); }
  .tp {
    aspect-ratio: 1; border: none; border-radius: 28px 16px 25px 26px / 26px 23px 18px 17px; cursor: pointer; padding: 0;
    background: var(--soft); box-shadow: inset 0 2px 5px rgba(60,50,30,.14); transition: all .1s steps(3, jump-end);
  }
  .tp.on { background: var(--accent); box-shadow: 0 0 26px -4px var(--accent), var(--shadow); transform: scale(1.04); }
  .tp.mala { background: var(--bad); box-shadow: 0 0 26px -4px var(--bad), var(--shadow); transform: scale(1.04); }
  .tp:active { transform: scale(.95); }
  .marcador { display: flex; justify-content: center; gap: 20px; padding-top: 20px; font-size: 13.5px; font-weight: 700; color: var(--bg-sub); }
  .marcador b { color: var(--bg-ink); font-size: 16px; }
  .marcador .vidas { color: var(--bad); letter-spacing: 2px; }
  .tools { margin: auto 16px calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; padding-top: 14px; }
  .tool { border: var(--trazo) solid var(--ink); cursor: pointer; font-family: var(--title-font); font-weight: 600;
    font-size: 13px; padding: 10px 17px; border-radius: var(--pastilla); background: var(--card); color: var(--ink);
    box-shadow: var(--shadow-sutil); }
  .tool:active { transform: translate(1.5px, 2px); box-shadow: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>

<script src="../../comun/nucleo.js"></script>
<script>
'use strict';

const CFG = {
  facil:   { on: 1200, gap: 420, trampa: 0 },
  normal:  { on: 950,  gap: 340, trampa: 0 },
  dificil: { on: 750,  gap: 280, trampa: 0.18 },
  experto: { on: 580,  gap: 220, trampa: 0.25 },
};

const S = {
  diff: store.get('topos.diff', 'normal'),
  activo: -1, esTrampa: false, score: 0, vidas: 3,
  timerId: null, jugando: false, atinado: false,
};

const REGLAS = `<p>Se encienden casillas <b>verdes</b>: tócalas antes de que se apaguen. Cada una vale un punto y el ritmo <b>se acelera</b> con tu puntuación.</p>
<p>Tienes <b>3 vidas</b>: pierdes una si se te escapa una verde o si tocas donde no era.</p>
<p>En Difícil y Experto a veces se enciende una <b>roja</b>: esa NO se toca (déjala pasar). Tu marca es la puntuación.</p>`;

function renderSetup() {
  clearTimeout(S.timerId);
  S.jugando = false;
  const bests = ['facil', 'normal', 'dificil', 'experto'].map((d) => {
    const b = store.get('topos.best.' + d, 0);
    return `<div class="b"><div class="bn">${b || '—'}</div><div class="bl">${DIFF_LABEL[d]}</div></div>`;
  }).join('');
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Topos', '')}
    <div class="g-setup scroll">
      <div class="card" style="padding: 14px 18px 18px;">
        <div class="row" style="border:none; padding-bottom: 8px;"><div class="row-title">Ritmo</div></div>
        ${diffSegHTML('seg-d', S.diff)}
      </div>
      <div class="label-sm" style="margin-top:4px;">Mejores puntuaciones</div>
      <div class="bests">${bests}</div>
      <button class="btn btn-primary" style="margin-top:8px;" id="new">Jugar</button>
      <button class="howto" id="howto">¿Cómo se juega?</button>
    </div>
  </div>`;
  bindSeg('seg-d', (v) => { S.diff = v; store.set('topos.diff', v); });
  $('#new').onclick = startGame;
  bindHowto(REGLAS);
}

function startGame() {
  S.score = 0; S.vidas = 3; S.activo = -1; S.jugando = true;
  renderPlay();
  S.timerId = setTimeout(prender, 900);
}

function renderPlay() {
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Topos', `<span class="chip">${DIFF_LABEL[S.diff]}</span>`)}
    <div class="marcador"><span>Puntos <b id="pts">0</b></span><span class="vidas" id="vidas"></span></div>
    <div class="twrap">
      <div class="tgrid" id="tgrid">
        ${Array.from({ length: 9 }, (_, i) => `<button class="tp" data-i="${i}"></button>`).join('')}
      </div>
    </div>
    <div class="tools">
      <button class="tool" id="t-salir">Salir</button>
    </div>
  </div>`;
  $('#tgrid').onclick = (e) => {
    const b = e.target.closest('.tp');
    if (b) tap(Number(b.dataset.i));
  };
  $('#t-salir').onclick = () => { S.jugando = false; clearTimeout(S.timerId); renderSetup(); };
  hud();
}

function hud() {
  $('#pts').textContent = S.score;
  $('#vidas').textContent = '♥'.repeat(S.vidas);
}

const ritmo = (base) => Math.max(320, base - S.score * 9);

function prender() {
  if (!S.jugando) return;
  const c = CFG[S.diff];
  S.activo = randInt(9);
  S.esTrampa = Math.random() < c.trampa;
  S.atinado = false;
  const el = $(`.tp[data-i="${S.activo}"]`);
  if (el) el.classList.add(S.esTrampa ? 'mala' : 'on');
  S.timerId = setTimeout(() => apagar(true), ritmo(c.on));
}

function apagar(porTiempo) {
  const el = $(`.tp[data-i="${S.activo}"]`);
  if (el) el.classList.remove('on', 'mala');
  const escapoVerde = porTiempo && !S.esTrampa && !S.atinado;
  S.activo = -1;
  if (escapoVerde) return fallo('Se te escapó una verde');
  if (!S.jugando) return;
  S.timerId = setTimeout(prender, ritmo(CFG[S.diff].gap));
}

function tap(i) {
  if (!S.jugando) return;
  if (i === S.activo && !S.esTrampa) {
    S.score++;
    S.atinado = true;
    vibrate(8);
    hud();
    clearTimeout(S.timerId);
    apagar(false);
  } else if (i === S.activo && S.esTrampa) {
    clearTimeout(S.timerId);
    apagar(false);
    fallo('¡Esa era roja!');
  } else {
    fallo('Ahí no era');
  }
}

function fallo(porque) {
  if (!S.jugando) return;
  S.vidas--;
  vibrate([70, 50, 70]);
  hud();
  if (S.vidas <= 0) return terminar(porque);
  if (S.activo === -1) {
    clearTimeout(S.timerId);
    S.timerId = setTimeout(prender, 700);
  }
}

function terminar(porque) {
  S.jugando = false;
  clearTimeout(S.timerId);
  const best = store.get('topos.best.' + S.diff, 0);
  const isRecord = S.score > best;
  if (isRecord && S.score > 0) {
    store.set('topos.best.' + S.diff, S.score);
    store.set('topo.hub', `Mejor: ${S.score} pts`);
    confetti();
  }
  setTimeout(() => {
    openModal(`
      <h3>${isRecord && S.score > 0 ? '¡Récord!' : 'Sin vidas'}</h3>
      <p style="text-align:center;">${esc(porque)}.</p>
      <div class="stats" style="margin:14px 0;">
        <div class="stat"><div class="n">${S.score}</div><div class="l">puntos</div></div>
        <div class="stat"><div class="n">${Math.max(best, S.score)}</div><div class="l">mejor</div></div>
      </div>
      <div class="m-actions">
        <button class="btn btn-primary" id="m-again">Otra partida</button>
        <button class="btn btn-ghost" id="m-out">Salir</button>
      </div>
    `);
    $('#m-again').onclick = () => { closeModal(); startGame(); };
    $('#m-out').onclick = () => { closeModal(); renderSetup(); };
  }, 500);
}

renderSetup();
</script>
</body>
</html>
