<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAF4E8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="description" content="Criptograma: descifra el refrán cambiando cada letra cifrada por la real." />
<title>Criptograma</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C0603A'/%3E%3Crect x='13' y='9' width='38' height='44' rx='6' fill='%23FAF4E8'/%3E%3Ctext x='32' y='42' font-size='28' font-family='Arial,Helvetica,sans-serif' font-weight='700' fill='%2333302B' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
<link rel="manifest" href="../../manifest.webmanifest" />
<link rel="apple-touch-icon" href="../../icons/icon-180.png" />
<link rel="stylesheet" href="../../comun/estilo.css" />
<style>
  /* Prefijo propio .cg- para no pisar la barra compartida (.seg, .chip, .tool…). */
  /* La pantalla de juego reparte el alto sobrante entre marcador, refrán, teclado
     y mandos; la de inicio no (ahí el «Jugar» iría al fondo). */
  .cg-zona { display: flex; flex-direction: column; justify-content: space-evenly; padding: 0 0 4px; }
  .cg-marc { display: flex; justify-content: center; gap: 22px; padding: 4px 16px 0; }
  .cg-marc span { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--sub); display: flex; align-items: baseline; gap: 7px; }
  .cg-marc b { font-family: var(--font); font-size: 17px; font-weight: 500; color: var(--ink); letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }

  /* El refrán: palabras enteras (no se parten) en filas; cada casilla lleva la
     letra real arriba y la cifrada abajo, en monoespaciada chica. */
  .cg-frase {
    --cg-c: clamp(22px, calc((100vw - 34px) / 13), 30px);
    display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
    gap: 6px 10px; padding: 0 12px; user-select: none; -webkit-user-select: none;
  }
  .cg-w { display: inline-flex; gap: 2px; }
  .cg-cel {
    width: var(--cg-c); height: 38px; padding: 0; border-radius: 7px; cursor: pointer;
    background: var(--card); border: var(--trazo) solid var(--linea-fuerte); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    font-family: var(--font); transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .cg-cel .cg-r { font-size: 17px; font-weight: 500; line-height: 20px; padding-top: 1px; min-height: 21px; }
  .cg-cel .cg-k { font-family: var(--mono); font-size: 9.5px; line-height: 12px; padding-bottom: 2px; color: var(--sub); letter-spacing: 0; }
  /* Letra puesta por el jugador en terracota de texto (4,5:1); las fijas (reveladas
     o de pista) en tinta, como los «dados» del Sudoku. */
  .cg-cel.usr .cg-r { color: var(--accent-texto); }
  .cg-cel.fija { background: var(--panel); border-color: transparent; }
  .cg-cel.mal .cg-r { color: var(--bad); }
  .cg-cel.sel { background: var(--accent-soft); border-color: var(--accent); }
  .cg-cel.sel .cg-k { color: var(--accent-texto); }
  .cg-frase.fin .cg-cel { background: var(--good-soft); border-color: transparent; }
  .cg-frase.fin .cg-cel .cg-r { color: var(--ink); }

  /* Cuenta de apariciones por letra cifrada (Fácil, Normal y Difícil). También
     sirve para seleccionar una letra cifrada sin buscarla en el refrán. */
  .cg-frec { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 5px; padding: 0 14px; }
  .cg-f {
    border: none; border-radius: var(--pastilla); background: var(--panel); color: var(--sub); cursor: pointer;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; padding: 4px 8px; line-height: 12px;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .cg-f b { font-weight: 500; color: var(--ink); }
  .cg-f.ok { opacity: .42; }
  .cg-f.sel { background: var(--accent-soft); color: var(--accent-texto); opacity: 1; }
  .cg-f.sel b { color: var(--accent-texto); }

  /* Teclado: 7 columnas × 4 filas (27 letras + borrar). Crece con el alto que
     sobra, con tope, como el del Sudoku; teclas ≥ 40 px. */
  .cg-pad {
    margin: 0 10px; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; gap: 5px;
    flex: 1 1 auto; max-height: 196px; min-height: 175px;
  }
  .cg-key {
    min-height: 40px; height: 100%; border: none; border-radius: 10px; background: var(--card);
    font-family: var(--font); font-size: 17px; font-weight: 500; color: var(--ink); cursor: pointer; padding: 0;
    transition: background var(--dur) var(--ease), opacity var(--dur) var(--ease);
  }
  .cg-key:active { opacity: .6; }
  .cg-key.usada { opacity: .38; }
  .cg-key.puesta { background: var(--accent-soft); color: var(--accent-texto); opacity: 1; }
  .cg-key svg { display: block; margin: 0 auto; }
  .cg-key:disabled { opacity: .3; cursor: default; }

  .cg-tools { margin: 0 12px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 8px; justify-content: center; flex-shrink: 0; }
  .cg-tool {
    border: var(--trazo) solid var(--linea-fuerte); cursor: pointer; font-family: var(--title-font); font-weight: 500;
    font-size: 13px; padding: 10px 14px; border-radius: var(--pastilla); background: var(--card); color: var(--ink);
    min-height: 40px;
  }
  .cg-tool:active { opacity: .6; }
  .cg-tool:disabled { opacity: .4; cursor: default; }
  .cg-msg { padding: 0 16px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>

<script src="../../comun/nucleo.js"></script>
<script>
'use strict';

/* Banco de refranes (copia del de «Ordena la frase»). Se clasifican por número
   de letras distintas, que es lo que hace fácil o difícil un criptograma:
   cuantas más letras distintas, más patrones que reconocer. */
const REFRANES = [
  'Más vale tarde que nunca', 'Perro que ladra no muerde', 'Al mal tiempo buena cara',
  'Más vale maña que fuerza', 'La práctica hace al maestro', 'Cada oveja con su pareja',
  'El tiempo es oro', 'Querer es poder', 'La curiosidad mató al gato',
  'Más vale prevenir que lamentar', 'El saber no ocupa lugar', 'Lo barato sale caro',
  'Cada loco con su tema', 'Amor con amor se paga', 'De tal palo tal astilla',
  'Zapatero a tus zapatos', 'Barriga llena corazón contento', 'A palabras necias oídos sordos',
  'Con dinero baila el perro', 'Cuentas claras amistades largas', 'A falta de pan tortillas',
  'Quien mucho duerme poco aprende', 'Al buen entendedor pocas palabras', 'La esperanza muere al último',
  'El que no llora no mama', 'Ojos vendados corazón contento', 'Camarón dormido se lo lleva',
  'Al pan pan al vino vino', 'Del dicho al hecho hay trecho', 'Genio y figura hasta la sepultura',
  'Quien calla otorga', 'Más vale solo que mal acompañado', 'A lo hecho pecho',
  'Nadie escarmienta en cabeza ajena', 'El que espera desespera', 'Obra de romanos',
  'Poco a poco se anda lejos', 'De noche todos los gatos son pardos', 'A cada santo su vela',
  'La ropa sucia se lava en casa', 'El flojo trabaja doble', 'Hablando se entiende la gente',
  'Al que madruga le va bien', 'Cada cabeza es un mundo', 'Lo prometido es deuda',
  'La unión hace la fuerza', 'Más vale poco que nada', 'El hambre es mala consejera',
  'Hoy por ti mañana por mí', 'Sobre gustos no hay nada escrito', 'En boca cerrada no entran moscas',
  'A quien madruga Dios lo ayuda', 'El que mucho abarca poco aprieta', 'El hábito no hace al monje',
  'El pez por su boca muere', 'Gato con guantes no caza ratones', 'A río revuelto ganancia de pescadores',
  'Éramos muchos y parió la abuela', 'No hay mal que dure cien años', 'Las palabras se las lleva el viento',
  'No por mucho madrugar amanece más temprano', 'Cría cuervos y te sacarán los ojos', 'En casa de herrero cuchillo de palo',
  'El que ríe al último ríe mejor', 'Ojos que no ven corazón que no siente', 'Más vale pájaro en mano que ciento volando',
  'No hay mal que por bien no venga', 'Agua que no has de beber déjala correr', 'Cuando el río suena es que agua lleva',
  'Árbol que nace torcido jamás su rama endereza', 'El que quiera azul celeste que le cueste', 'Matrimonio y mortaja del cielo bajan',
  'Nadie sabe para quién trabaja', 'El que la sigue la consigue', 'Donde manda capitán no gobierna marinero',
  'Al mejor cocinero se le va un tomate', 'Cuando el gato no está los ratones hacen fiesta', 'De médico poeta y loco todos tenemos un poco',
  'La cabra siempre tira al monte', 'Perro que come huevo aunque le quemen el hocico', 'El que a buen árbol se arrima buena sombra le cobija',
  'Antes que te cases mira lo que haces', 'No todo lo que brilla es oro', 'A buen hambre no hay pan duro',
  'El que tiene tienda que la atienda', 'Amor de lejos amor de pendejos', 'Al ojo del amo engorda el caballo',
  'En martes ni te cases ni te embarques', 'Quien siembra vientos recoge tempestades', 'La ocasión hace al ladrón',
  'De grano en grano llena la gallina el buche', 'El pez grande se come al chico', 'A la cama no te irás sin saber una cosa más',
  'Quien bien te quiere te hará llorar', 'Más vale un por si acaso que un yo pensé', 'El burro hablando de orejas',
  'Camarón que se duerme se lo lleva la corriente', 'Dime con quién andas y te diré quién eres', 'Del plato a la boca se cae la sopa',
  'Más sabe el diablo por viejo que por diablo', 'Al que le quede el saco que se lo ponga', 'No dejes para mañana lo que puedas hacer hoy',
  'Aunque la mona se vista de seda mona se queda', 'El que con lobos anda a aullar se enseña', 'No hay peor sordo que el que no quiere oír',
  'Más vale malo por conocido que bueno por conocer', 'A caballo regalado no se le mira el colmillo', 'Tanto va el cántaro al agua hasta que se rompe',
  'Nadie sabe lo que tiene hasta que lo ve perdido', 'Dime de qué presumes y te diré de qué careces', 'El que parte y reparte se queda con la mejor parte',
  'El que nace para tamal del cielo le caen las hojas', 'No hay fecha que no se cumpla ni plazo que no se venza', 'Al nopal lo van a ver solo cuando tiene tunas',
  'El muerto al pozo y el vivo al gozo', 'La suerte de la fea la bonita la desea', 'Aunque te chille el cochino no le aflojes el mecate',
  'El que se fue a la villa perdió su silla', 'Más vale paso que dure y no trote que canse', 'Cada quien habla de cómo le fue en la feria',
  'No por mucho madrugar se acaba el trabajo antes', 'El que quiera peces que se moje el trasero', 'Cuando veas las barbas de tu vecino cortar pon las tuyas a remojar',
  'A quien le dan pan que llore', 'El que se lleva se aguanta', 'Está más perdido que un perro en misa',
  'No hay peor ciego que el que no quiere ver', 'Unos nacen con estrella y otros nacen estrellados', 'Cuando el tecolote canta el indio muere',
  'Después de ahogado el niño a tapar el pozo', 'A donde fueres haz lo que vieres', 'Quien no oye consejo no llega a viejo',
  'El que da primero da dos veces', 'Ya que no puedas con ellos úneteles', 'Zapatero remendón compón tu zapatón',
  'A palabras de borracho oídos de cantinero', 'No hay que buscarle tres pies al gato', 'El que se enoja pierde y el que pierde se enoja',
  'De qué le sirve al ciego el espejo', 'Chango viejo no aprende maroma nueva', 'A cada capillita le llega su fiestecita',
  'El que nace pa maceta no sale del corredor', 'No dejes camino viejo por vereda nueva', 'El diablo sabe más por viejo que por diablo',
];

const ALFABETO = 'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ';
const NIVELES_CG = ['facil', 'normal', 'dificil', 'experto'];
/* min/max = letras distintas del refrán; revela = letras dadas al empezar;
   frec = si se muestra la cuenta de apariciones; base = puntos de salida. */
const CFG = {
  facil:   { min: 14, max: 18, revela: 3, frec: true,  base: 200 },
  normal:  { min: 12, max: 18, revela: 1, frec: true,  base: 300 },
  dificil: { min: 12, max: 14, revela: 0, frec: true,  base: 400 },
  experto: { min: 7,  max: 11, revela: 0, frec: false, base: 500 },
};
const COSTE_PISTA = 25;   // puntos por letra revelada a petición
const COSTE_ERROR = 10;   // puntos por letra equivocada confirmada
const SEG_PUNTO = 10;     // cada tantos segundos se va un punto

/* Minúsculas sin tildes, conservando la ñ y los espacios. */
const plano = (s) => s.toLowerCase().replace(/ñ/g, '\u0001').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\u0001/g, 'ñ');
const distintas = (f) => new Set(plano(f).replace(/[^a-zñ]/g, '')).size;
const POOL = {};
for (const n of NIVELES_CG) POOL[n] = REFRANES.map((f, i) => i).filter((i) => { const d = distintas(REFRANES[i]); return d >= CFG[n].min && d <= CFG[n].max; });

/* Permutación del alfabeto sin puntos fijos: ninguna letra se cifra como ella misma. */
function cifrado() {
  for (;;) {
    const p = shuffle([...ALFABETO]);
    if (p.every((c, i) => c !== ALFABETO[i])) {
      const m = {};
      for (let i = 0; i < ALFABETO.length; i++) m[ALFABETO[i].toLowerCase()] = p[i].toLowerCase();
      return m;
    }
  }
}

const S = {
  nivel: store.get('crip.nivel', 'normal'),
  idx: -1, palabras: [], clave: null, inv: null, celdas: [], cifradas: [], cuenta: {},
  asig: {}, fijas: new Set(), sel: null, pos: 0, pistas: 0, errores: 0, penal: new Set(),
  jugando: false, tMsg: null, tFin: null,
};
const reloj = makeClock(() => $('#cg-clk'));

const REGLAS = `<p>Un <b>refrán</b> se escribió cambiando cada letra por otra: siempre la misma, y ninguna por sí misma. Debajo de cada casilla ves la <b>letra cifrada</b>.</p>
<p>Toca una casilla y elige en el teclado la letra real: se rellenan <b>todas</b> las casillas que llevan esa cifra. Tocar una letra ya usada la mueve; la misma letra otra vez la quita.</p>
<p>En Fácil, Normal y Difícil ves <b>cuántas veces sale</b> cada letra cifrada: las más repetidas suelen ser vocales. Fácil te da 3 letras de entrada y Normal 1. Experto no da ninguna, no muestra cuentas y usa refranes más cortos.</p>
<p>Cuando llenas todas las casillas se comprueba: las que no cuadran se marcan en rojo. Empiezas con los <b>puntos del nivel</b> y bajan 1 cada ${SEG_PUNTO} s, ${COSTE_PISTA} por pista y ${COSTE_ERROR} por letra equivocada.</p>`;

function mejorNivel() {
  for (let i = NIVELES_CG.length - 1; i >= 0; i--) {
    const b = store.get('crip.best.' + NIVELES_CG[i], null);
    if (b != null) return { nivel: NIVELES_CG[i], pts: b };
  }
  return null;
}

function renderSetup() {
  reloj.stop();
  clearTimeout(S.tMsg); clearTimeout(S.tFin);
  S.jugando = false;
  const bests = NIVELES_CG.map((d) => {
    const b = store.get('crip.best.' + d, null);
    return `<div class="b"><div class="bn">${b == null ? '—' : b}</div><div class="bl">${DIFF_LABEL[d]}</div></div>`;
  }).join('');
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Criptograma', '')}
    <div class="g-setup scroll">
      <div class="card" style="padding: 14px 18px 18px;">
        <div class="row" style="border:none; padding-bottom: 8px;"><div class="row-title">Dificultad</div><div class="row-hint" id="cg-hint"></div></div>
        ${diffSegHTML('seg-d', S.nivel)}
      </div>
      <div class="label-sm" style="margin-top:4px;">Mejores puntuaciones</div>
      <div class="bests">${bests}</div>
      <button class="btn btn-primary" style="margin-top:8px;" id="new">Jugar</button>
      <button class="howto" id="howto">¿Cómo se juega?</button>
    </div>
  </div>`;
  const hint = () => {
    const c = CFG[S.nivel];
    $('#cg-hint').textContent = `${c.base} pts · ${c.revela ? c.revela + (c.revela === 1 ? ' letra dada' : ' letras dadas') : 'sin letras dadas'}${c.frec ? '' : ' · sin cuentas'}`;
  };
  hint();
  bindSeg('seg-d', (v) => { S.nivel = v; store.set('crip.nivel', v); hint(); });
  $('#new').onclick = () => nuevaPartida();
  bindHowto(REGLAS);
}

/* Prepara un refrán del nivel (o el índice que se pida, para pruebas). */
function nuevaPartida(forzarIdx) {
  reloj.stop();
  clearTimeout(S.tMsg); clearTimeout(S.tFin);
  const pool = POOL[S.nivel];
  let idx = forzarIdx;
  if (idx == null) {
    // evita repetir el último refrán jugado en este nivel
    const ultimo = store.get('crip.ultimo.' + S.nivel, -1);
    const cands = pool.length > 1 ? pool.filter((i) => i !== ultimo) : pool;
    idx = cands[randInt(cands.length)];
  }
  store.set('crip.ultimo.' + S.nivel, idx);
  S.idx = idx;
  S.palabras = plano(REFRANES[idx]).split(' ');
  S.clave = cifrado();
  S.inv = {};
  for (const k in S.clave) S.inv[S.clave[k]] = k;
  S.celdas = [];
  S.cuenta = {};
  S.palabras.forEach((w, wi) => [...w].forEach((ch) => {
    const c = S.clave[ch];
    S.celdas.push({ real: ch, cif: c, w: wi });
    S.cuenta[c] = (S.cuenta[c] || 0) + 1;
  }));
  S.cifradas = Object.keys(S.cuenta).sort((a, b) => S.cuenta[b] - S.cuenta[a] || (a < b ? -1 : 1));
  S.asig = {}; S.fijas = new Set(); S.penal = new Set();
  // letras dadas al empezar: al azar entre las que aparecen
  for (const c of shuffle(S.cifradas).slice(0, Math.min(CFG[S.nivel].revela, S.cifradas.length))) {
    S.asig[c] = S.inv[c]; S.fijas.add(c);
  }
  S.pistas = 0; S.errores = 0; S.jugando = true;
  S.pos = S.celdas.findIndex((c) => !S.fijas.has(c.cif));
  S.sel = S.pos >= 0 ? S.celdas[S.pos].cif : null;
  renderPlay();
  reloj.start();
}

function puntos() {
  const p = CFG[S.nivel].base - S.pistas * COSTE_PISTA - S.errores * COSTE_ERROR - Math.floor(reloj.seconds / SEG_PUNTO);
  return Math.max(0, p);
}

function renderPlay() {
  const cfg = CFG[S.nivel];
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Criptograma', `<span class="chip">${DIFF_LABEL[S.nivel]}</span><span class="clock" id="cg-clk">0:00</span>`)}
    <div class="scroll cg-zona">
      <div class="cg-marc">
        <span>Puntos <b id="cg-pts">${cfg.base}</b></span>
        <span>Faltan <b id="cg-falta">0</b></span>
        <span>Pistas <b id="cg-pis">0</b></span>
      </div>
      <div class="cg-frase" id="cg-frase">
        ${S.palabras.map((w, wi) => `<span class="cg-w">${[...w].map((ch, k) => {
          const i = S.celdas.findIndex((c) => c.w === wi) + k;
          return `<button class="cg-cel" data-i="${i}" data-c="${S.celdas[i].cif}"><span class="cg-r"></span><span class="cg-k">${S.celdas[i].cif.toUpperCase()}</span></button>`;
        }).join('')}</span>`).join('')}
      </div>
      ${cfg.frec ? `<div class="cg-frec" id="cg-frec">${S.cifradas.map((c) => `<button class="cg-f" data-c="${c}">${c.toUpperCase()} <b>${S.cuenta[c]}</b></button>`).join('')}</div>` : ''}
      <div class="msg cg-msg" id="cg-msg"></div>
      <div class="cg-pad" id="cg-pad">
        ${[...ALFABETO].map((l) => `<button class="cg-key" data-l="${l.toLowerCase()}">${l}</button>`).join('')}
        <button class="cg-key" data-l="" aria-label="Borrar"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6H9l-6 6 6 6h11a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"></path><path d="M17 10l-4 4M13 10l4 4"></path></svg></button>
      </div>
      <div class="cg-tools">
        <button class="cg-tool" id="t-pista">Pista −${COSTE_PISTA}</button>
        <button class="cg-tool" id="t-nueva">Nueva</button>
        <button class="cg-tool" id="t-salir">Salir</button>
      </div>
    </div>
  </div>`;
  $('#cg-frase').onclick = (e) => {
    const b = e.target.closest('.cg-cel');
    if (b) seleccionar(b.dataset.c, Number(b.dataset.i));
  };
  const fr = $('#cg-frec');
  if (fr) fr.onclick = (e) => {
    const b = e.target.closest('.cg-f');
    if (b) seleccionar(b.dataset.c, S.celdas.findIndex((c) => c.cif === b.dataset.c));
  };
  $('#cg-pad').onclick = (e) => {
    const b = e.target.closest('.cg-key');
    if (b) teclear(b.dataset.l);
  };
  $('#t-pista').onclick = pista;
  $('#t-nueva').onclick = () => nuevaPartida();
  $('#t-salir').onclick = renderSetup;
  pintar();
}

function seleccionar(cif, i) {
  if (!S.jugando) return;
  S.sel = cif; S.pos = i;
  pintar();
}

function mensaje(txt, cls) {
  const m = $('#cg-msg'); if (!m) return;
  m.textContent = txt; m.className = 'msg cg-msg ' + (cls || '');
  clearTimeout(S.tMsg);
  S.tMsg = setTimeout(() => { const el = $('#cg-msg'); if (el) { el.textContent = ''; el.className = 'msg cg-msg'; } }, 2200);
}

/* Asigna (o quita) la letra real «l» a la cifra seleccionada. */
function teclear(l) {
  if (!S.jugando || !S.sel) return;
  const c = S.sel;
  if (S.fijas.has(c)) { mensaje('Esa letra ya está fija'); return; }
  if (!l || S.asig[c] === l) { delete S.asig[c]; pintar(); return; }
  // ¿la letra real ya la tiene otra cifra? si es fija no se mueve; si no, se traslada
  const dueña = Object.keys(S.asig).find((k) => S.asig[k] === l);
  if (dueña && S.fijas.has(dueña)) { mensaje(`La ${l.toUpperCase()} ya está fija en ${dueña.toUpperCase()}`); return; }
  if (dueña) delete S.asig[dueña];
  S.asig[c] = l;
  vibrate(6);
  avanzar();
  pintar();
  comprobar();
}

/* Salta a la siguiente casilla sin resolver (en orden de lectura), si la hay. */
function avanzar() {
  const n = S.celdas.length;
  for (let k = 1; k <= n; k++) {
    const i = (S.pos + k) % n;
    if (!S.asig[S.celdas[i].cif]) { S.pos = i; S.sel = S.celdas[i].cif; return; }
  }
}

function pista() {
  if (!S.jugando) return;
  // la cifra seleccionada si está sin resolver o mal; si no, la que más sale
  let c = S.sel && !S.fijas.has(S.sel) && S.asig[S.sel] !== S.inv[S.sel] ? S.sel : null;
  if (!c) c = S.cifradas.find((k) => !S.fijas.has(k) && S.asig[k] !== S.inv[k]);
  if (!c) return;
  const real = S.inv[c];
  const dueña = Object.keys(S.asig).find((k) => S.asig[k] === real);
  if (dueña && dueña !== c) delete S.asig[dueña];
  S.asig[c] = real; S.fijas.add(c);
  S.pistas++;
  S.sel = c; S.pos = S.celdas.findIndex((x) => x.cif === c);
  vibrate(20);
  avanzar();
  pintar();
  mensaje(`${c.toUpperCase()} es ${real.toUpperCase()} · −${COSTE_PISTA}`, 'check');
  comprobar();
}

function pintar() {
  if (!$('#cg-frase')) return;   // el jugador ya se fue de la pantalla
  const mal = new Set();
  // solo se marcan en rojo las cifras ya confirmadas (comprobadas al llenar todo)
  for (const c in S.asig) if (S.penal.has(c + S.asig[c]) && S.asig[c] !== S.inv[c]) mal.add(c);
  $$('.cg-cel').forEach((el) => {
    const c = el.dataset.c;
    const l = S.asig[c];
    el.className = 'cg-cel' + (S.fijas.has(c) ? ' fija' : (l ? ' usr' : '')) + (mal.has(c) ? ' mal' : '') + (S.sel === c ? ' sel' : '');
    $('.cg-r', el).textContent = l ? l.toUpperCase() : '';
  });
  $$('.cg-f').forEach((el) => {
    const c = el.dataset.c;
    el.className = 'cg-f' + (S.asig[c] ? ' ok' : '') + (S.sel === c ? ' sel' : '');
  });
  const usadas = new Set(Object.values(S.asig));
  const actual = S.sel ? S.asig[S.sel] : null;
  $$('.cg-key[data-l]').forEach((k) => {
    const l = k.dataset.l;
    if (!l) return;
    k.className = 'cg-key' + (l === actual ? ' puesta' : (usadas.has(l) ? ' usada' : ''));
  });
  const faltan = S.cifradas.filter((c) => !S.asig[c]).length;
  $('#cg-falta').textContent = faltan;
  $('#cg-pis').textContent = S.pistas;
  $('#cg-pts').textContent = puntos();
  const bp = $('#t-pista');
  if (bp) bp.disabled = !S.jugando || S.cifradas.every((c) => S.fijas.has(c) || S.asig[c] === S.inv[c]);
}

/* Al quedar todas las casillas llenas se comprueba: las cifras equivocadas se
   marcan y cada par (cifra, letra) equivocado se cobra una sola vez. */
function comprobar() {
  if (!$('#cg-frase')) return;
  if (S.cifradas.some((c) => !S.asig[c])) return;
  const malas = S.cifradas.filter((c) => S.asig[c] !== S.inv[c]);
  if (!malas.length) { ganar(); return; }
  let nuevas = 0;
  for (const c of malas) { const k = c + S.asig[c]; if (!S.penal.has(k)) { S.penal.add(k); nuevas++; } }
  S.errores += nuevas;
  vibrate([50, 40, 50]);
  pintar();
  $('#cg-frase').classList.add('shake');
  setTimeout(() => { const el = $('#cg-frase'); if (el) el.classList.remove('shake'); }, 420);
  mensaje(`${malas.length === 1 ? 'Una letra no cuadra' : malas.length + ' letras no cuadran'}${nuevas ? ` · −${nuevas * COSTE_ERROR}` : ''}`, 'err');
}

function ganar() {
  S.jugando = false;
  reloj.stop();
  const pts = puntos();
  const seg = reloj.seconds;
  const k = 'crip.best.' + S.nivel;
  const best = store.get(k, null);
  const isRecord = best == null || pts > best;
  if (isRecord) {
    store.set(k, pts);
    const top = mejorNivel();
    if (top) store.set('crip.hub', `Mejor ${top.pts} pts · ${DIFF_LABEL[top.nivel]}`);
  }
  pintar();
  $('#cg-frase').classList.add('fin');
  const bp = $('#t-pista'); if (bp) bp.disabled = true;
  confetti(); vibrate([30, 60, 30]);
  clearTimeout(S.tFin);
  S.tFin = setTimeout(() => {
    if (!$('#cg-frase')) return;   // el jugador salió antes de que llegara el modal
    openModal(`
      <h3>${isRecord ? '¡Récord!' : '¡Descifrado!'}</h3>
      <div class="m-word">«${esc(REFRANES[S.idx])}»</div>
      <div class="stats" style="margin:14px 0;">
        <div class="stat"><div class="n">${pts}</div><div class="l">puntos</div></div>
        <div class="stat"><div class="n">${fmtTime(seg)}</div><div class="l">tiempo</div></div>
        <div class="stat"><div class="n">${S.pistas}</div><div class="l">pistas</div></div>
      </div>
      <p style="text-align:center;">${isRecord ? `Tu mejor marca en ${DIFF_LABEL[S.nivel]}.` : `Tu mejor marca en ${DIFF_LABEL[S.nivel]}: <b>${best} pts</b>.`}</p>
      <div class="m-actions">
        <button class="btn btn-primary" id="m-again">Otro refrán</button>
        <button class="btn btn-ghost" id="m-out">Salir</button>
      </div>
    `);
    $('#m-again').onclick = () => { closeModal(); nuevaPartida(); };
    $('#m-out').onclick = () => { closeModal(); renderSetup(); };
  }, 700);
}

/* Los puntos bajan con el reloj: se refresca cada segundo junto con él. */
setInterval(() => { if (S.jugando && $('#cg-pts')) $('#cg-pts').textContent = puntos(); }, 1000);

/* Teclado físico */
addEventListener('keydown', (e) => {
  if (!$('#cg-frase') || !S.jugando) return;
  const k = e.key.toLowerCase();
  if (k.length === 1 && ALFABETO.toLowerCase().includes(k)) teclear(k);
  else if (e.key === 'Backspace' || e.key === 'Delete') teclear('');
});

renderSetup();
</script>
</body>
</html>
