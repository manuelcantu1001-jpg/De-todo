<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAF9F5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="description" content="Adivina la palabra a partir de su definición, con pistas de letras si te atoras." />
<title>La definición</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23D97757'/%3E%3Crect x='13' y='9' width='38' height='44' rx='6' fill='%23FAF9F5'/%3E%3Ctext x='32' y='42' font-size='28' font-family='Arial,Helvetica,sans-serif' font-weight='700' fill='%23141413' text-anchor='middle'%3E%3F%3C/text%3E%3C/svg%3E" />
<link rel="manifest" href="../../manifest.webmanifest" />
<link rel="apple-touch-icon" href="../../icons/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../comun/estilo.css" />
<style>
  .zona { padding: 14px 18px 0; }
  .pista-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; text-align: center; border: 1.5px solid var(--ink); }
  .pista-card .p { font-size: 17px; line-height: 1.45; color: var(--ink); font-weight: 500; }
  .letras { padding: 18px 0 0; }
  .letras .tile { min-width: 36px; height: 44px; font-size: 22px; }
  .letras .tile.hueco { color: var(--faint); }
  .entrada { padding: 16px 0 0; display: flex; gap: 10px; }
  .entrada .field { flex: 1; text-transform: lowercase; }
  .entrada .btn { width: auto; padding: 16px 20px; flex-shrink: 0; }
  .ayudas { display: flex; gap: 10px; justify-content: center; padding-top: 12px; }
  .marcador { display: flex; justify-content: center; gap: 20px; padding-top: 12px; font-size: 13.5px; font-weight: 700; color: var(--bg-sub); }
  .marcador b { color: var(--bg-ink); font-size: 15px; }
  .tools { margin: auto 16px calc(14px + env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; padding-top: 10px; }
  .tool { border: var(--trazo) solid var(--ink); cursor: pointer; font-family: var(--title-font); font-weight: 600;
    font-size: 13px; padding: 10px 17px; border-radius: var(--pastilla); background: var(--card); color: var(--ink);
    box-shadow: var(--shadow-sutil); }
  .tool:active { transform: translate(1.5px, 2px); box-shadow: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>

<script src="../crucigrama/pistas-es.js"></script>
<script src="../../comun/nucleo.js"></script>
<script>
'use strict';

const RONDAS = 10;
const BUCKET = { facil: 'facil', normal: 'media', dificil: 'dificil' };

const S = {
  diff: store.get('definicion.diff', 'normal'),
  lista: [], ronda: 0, palabra: '', pista: '',
  reveladas: [], puntos: 0, aciertos: 0, jugando: false, bloqueo: false,
};

const REGLAS = `<p>El crucigrama al revés: te damos la <b>definición</b> y tú escribes la palabra. Las rayitas marcan cuántas letras tiene.</p>
<p>Cada acierto vale <b>3 puntos</b>. Puedes pedir <b>letras de pista</b> (cada una resta 1 punto) o <b>pasar</b> a la siguiente sin puntos.</p>
<p>La partida son ${RONDAS} definiciones del banco propio de la colección. Las tildes no importan al responder.</p>`;

function renderSetup() {
  const bests = ['facil', 'normal', 'dificil'].map((d) => {
    const b = store.get('definicion.best.' + d, -1);
    return `<div class="b"><div class="bn">${b >= 0 ? b : '—'}</div><div class="bl">${DIFF_LABEL[d]}</div></div>`;
  }).join('');
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('La definición', '')}
    <div class="g-setup scroll">
      <div class="card" style="padding: 14px 18px 18px;">
        <div class="row" style="border:none; padding-bottom: 8px;"><div class="row-title">Dificultad</div></div>
        ${diffSegHTML('seg-d', S.diff, ['facil', 'normal', 'dificil'])}
      </div>
      <div class="label-sm" style="margin-top:4px;">Mejores puntuaciones (de ${RONDAS * 3})</div>
      <div class="bests">${bests}</div>
      <button class="btn btn-primary" style="margin-top:8px;" id="new">Jugar</button>
      <button class="howto" id="howto">¿Cómo se juega?</button>
    </div>
  </div>`;
  bindSeg('seg-d', (v) => { S.diff = v; store.set('definicion.diff', v); });
  $('#new').onclick = startGame;
  bindHowto(REGLAS);
}

function startGame() {
  S.lista = shuffle(window.PISTAS_ES[BUCKET[S.diff]]).slice(0, RONDAS);
  S.ronda = 0; S.puntos = 0; S.aciertos = 0; S.jugando = true;
  nextRonda(true);
}

function nextRonda(first) {
  const [pal, pista] = S.lista[S.ronda];
  S.palabra = pal; S.pista = pista;
  S.reveladas = new Array(pal.length).fill(false);
  S.bloqueo = false;
  if (first) renderPlay(); else paint();
  const inp = $('#inp');
  inp.value = ''; inp.disabled = false;
  $('#msg').textContent = ''; $('#msg').className = 'msg';
}

function renderPlay() {
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('La definición', `<span class="chip" id="prog"></span>`)}
    <div class="marcador"><span>Puntos <b id="pts">0</b></span><span>Aciertos <b id="aci">0</b></span></div>
    <div class="zona">
      <div class="pista-card"><div class="p" id="pista"></div></div>
      <div class="letras"><div class="tiles" id="tiles"></div></div>
      <div class="entrada">
        <input class="field" id="inp" type="text" autocomplete="off" autocapitalize="none" enterkeyhint="send" placeholder="La palabra es…" />
        <button class="btn btn-primary" id="b-ok">Va</button>
      </div>
      <div class="msg" id="msg" style="padding-top:12px;"></div>
      <div class="ayudas">
        <button class="btn btn-soft btn-sm" id="b-letra">Letra (−1 pt)</button>
        <button class="btn btn-ghost btn-sm" id="b-pasar">Pasar</button>
      </div>
    </div>
    <div class="tools">
      <button class="tool" id="t-salir">Salir</button>
    </div>
  </div>`;
  $('#b-ok').onclick = probar;
  $('#inp').onkeydown = (e) => { if (e.key === 'Enter') probar(); };
  $('#b-letra').onclick = pedirLetra;
  $('#b-pasar').onclick = pasar;
  $('#t-salir').onclick = () => { S.jugando = false; renderSetup(); };
  paint();
}

function paint() {
  $('#prog').textContent = `${S.ronda + 1} / ${RONDAS}`;
  $('#pista').textContent = S.pista;
  $('#tiles').innerHTML = S.palabra.split('').map((l, i) =>
    S.reveladas[i]
      ? `<div class="tile">${esc(l.toUpperCase())}</div>`
      : `<div class="tile hueco">·</div>`).join('');
  $('#pts').textContent = S.puntos;
  $('#aci').textContent = S.aciertos;
}

function valorActual() {
  return Math.max(1, 3 - S.reveladas.filter(Boolean).length);
}

function setMsg(t, cls) { const el = $('#msg'); if (el) { el.textContent = t; el.className = 'msg ' + (cls || ''); } }

function probar() {
  if (!S.jugando || S.bloqueo) return;
  const n = norm($('#inp').value);
  if (!n) return;
  if (n === norm(S.palabra)) {
    const v = valorActual();
    S.puntos += v; S.aciertos++;
    S.reveladas.fill(true);
    S.bloqueo = true;
    vibrate([15, 40, 15]);
    paint();
    setMsg(`¡${S.palabra.toUpperCase()}! +${v}`, 'ok');
    avanzar();
  } else {
    vibrate([60, 40, 60]);
    setMsg('No es esa', 'err');
    const el = $('#tiles');
    el.classList.add('shake');
    setTimeout(() => { const t = $('#tiles'); if (t) t.classList.remove('shake'); }, 420);
  }
}

function pedirLetra() {
  if (!S.jugando || S.bloqueo) return;
  const huecos = S.reveladas.map((r, i) => r ? -1 : i).filter((i) => i >= 0);
  if (huecos.length <= 1) { setMsg('Ya casi la tienes entera…', 'check'); return; }
  S.reveladas[huecos[randInt(huecos.length)]] = true;
  vibrate(8);
  paint();
  setMsg(`Ahora vale ${valorActual()} pt${valorActual() === 1 ? '' : 's'}`, 'check');
}

function pasar() {
  if (!S.jugando || S.bloqueo) return;
  S.bloqueo = true;
  S.reveladas.fill(true);
  paint();
  setMsg(`Era «${S.palabra}»`, 'check');
  avanzar();
}

function avanzar() {
  $('#inp').disabled = true;
  S.ronda++;
  setTimeout(() => S.ronda >= RONDAS ? terminar() : nextRonda(false), 1300);
}

function terminar() {
  S.jugando = false;
  const best = store.get('definicion.best.' + S.diff, -1);
  const isRecord = S.puntos > best;
  if (isRecord) {
    store.set('definicion.best.' + S.diff, S.puntos);
    store.set('def.hub', `Mejor: ${S.puntos}/${RONDAS * 3}`);
  }
  if (S.puntos > 0) confetti();
  openModal(`
    <h3>${isRecord && S.puntos > 0 ? '¡Récord!' : 'Fin de la partida'}</h3>
    <div class="stats" style="margin:14px 0;">
      <div class="stat"><div class="n">${S.puntos}</div><div class="l">de ${RONDAS * 3} pts</div></div>
      <div class="stat"><div class="n">${S.aciertos}</div><div class="l">aciertos</div></div>
      <div class="stat"><div class="n">${Math.max(best, S.puntos)}</div><div class="l">mejor</div></div>
    </div>
    <div class="m-actions">
      <button class="btn btn-primary" id="m-again">Otra partida</button>
      <button class="btn btn-ghost" id="m-out">Salir</button>
    </div>
  `);
  $('#m-again').onclick = () => { closeModal(); startGame(); };
  $('#m-out').onclick = () => { closeModal(); renderSetup(); };
}

renderSetup();
</script>
</body>
</html>
