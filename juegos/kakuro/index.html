<style>
  .boardwrap { display: flex; justify-content: center; padding: 8px 10px 4px; }

    border-radius: 5px 6px 6px 4px / 6px 4px 4px 4px; position: relative; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .kc.negra {
    background: linear-gradient(to top right,
      var(--ink) 0%, var(--ink) 49.5%, color-mix(in srgb, var(--ink) 82%, #fff) 49.5%,
      color-mix(in srgb, var(--ink) 82%, #fff) 50.5%, var(--ink) 50.5%, var(--ink) 100%);

  .kc.blanca.runsel { background: var(--accent-soft); }

    font-family: var(--title-font); font-size: 21px; font-weight: 600; color: var(--ink); cursor: pointer;
  }

  .tool {
    border: var(--trazo) solid var(--ink); cursor: pointer; font-family: var(--title-font); font-weight: 600; font-size: 13px; padding: 10px 17px; border-radius: var(--pastilla); background: var(--card); color: var(--ink); box-shadow: var(--shadow-sutil);

<body>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>

<script src="../../comun/nucleo.js"></script>
<script>
'use strict';

const CFG = { facil: 5, normal: 6, dificil: 7, experto: 8 };

const S = {
  diff: store.get('kak.diff', 'normal'),
  W: 0, H: 0,           // tamaño total (incluye fila/columna de sumas)
  celdas: [],           // [r][c] = {negra, right, down} | {negra:false, sol, val}
  runs: [],             // {cells:[[r,c]...], sum, dir}
  deCelda: new Map(),   // "r,c" -> [runIdx...]
  sel: null, pistas: 3, done: false,
};
const clock = makeClock(() => $('#clock'));
const kk = (r, c) => r + ',' + c;

const REGLAS = `<p>Es un crucigrama de números. Cada bloque blanco seguido debe <b>sumar</b> lo que indica su casilla negra: el número de arriba a la derecha manda sobre el bloque a su derecha, y el de abajo a la izquierda sobre el bloque hacia abajo.</p>
<p>Solo se usan dígitos del <b>1 al 9</b> y dentro de un mismo bloque <b>no se repiten</b>. Los repetidos se marcan en rojo, y un bloque completo con suma equivocada se sombrea.</p>
<p>Toca una casilla y escribe con el teclado. Gana al llenar todo con las sumas correctas. <b>Pista</b> rellena una casilla (3 por partida).</p>
<p>Cada tablero tiene <b>una sola solución</b>.</p>`;

/* ── Generación ──────────────────────────────────────────────────────── */
/* COMBOS[largo][suma] = máscaras de 9 bits (bit d-1) de dígitos distintos que suman eso. */
const COMBOS = (() => {
  const t = [];
  for (let L = 0; L <= 9; L++) { t.push([]); for (let s = 0; s <= 45; s++) t[L].push([]); }
  for (let m = 1; m < 512; m++) {
    let L = 0, s = 0;
    for (let d = 1; d <= 9; d++) if (m & (1 << (d - 1))) { L++; s += d; }
    t[L][s].push(m);
  }
  return t;
})();
const BITS = (() => { const a = new Uint8Array(512); for (let m = 1; m < 512; m++) a[m] = a[m >> 1] + (m & 1); return a; })();
const DIGS = (() => {
  const t = [];
  for (let m = 0; m < 512; m++) { const a = []; for (let d = 1; d <= 9; d++) if (m & (1 << (d - 1))) a.push(1 << (d - 1)); t.push(a); }
  return t;
})();
const DP = new Uint8Array(1 << 9);

const MAX_RUN = 5;                                        // bloques de 2 a 5 celdas
const BONO = { facil: 220, normal: 220, dificil: 150, experto: 0 };  // ms extra buscando un tablero sin adivinar

/* ── Patrón de negras: simétrico 180°, bloques de 2 a 5, 35-45% de negras ── */
function largosOK(n, neg, exigirMax) {
  const I = (r, c) => r * n + c;
  let blancas = 0;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (neg[I(r, c)]) continue;
    blancas++;
    // largo mínimo 2: toda blanca necesita vecina blanca a los lados y arriba o abajo
    const h = (c > 0 && !neg[I(r, c - 1)]) || (c < n - 1 && !neg[I(r, c + 1)]);
    const v = (r > 0 && !neg[I(r - 1, c)]) || (r < n - 1 && !neg[I(r + 1, c)]);
    if (!h || !v) return false;
  }
  if (!blancas) return false;
  if (!exigirMax) return true;
  for (let r = 0; r < n; r++) {
    let len = 0;
    for (let c = 0; c <= n; c++) { if (c < n && !neg[I(r, c)]) len++; else { if (len > MAX_RUN) return false; len = 0; } }
  }
  for (let c = 0; c < n; c++) {
    let len = 0;
    for (let r = 0; r <= n; r++) { if (r < n && !neg[I(r, c)]) len++; else { if (len > MAX_RUN) return false; len = 0; } }
  }
  return true;
}

function generarPatron(n) {
  const total = n * n;
  const minNeg = Math.round(total * 0.35), maxNeg = Math.round(total * 0.45);
  const pares = [];
  for (let i = 0; i < total; i++) {
    const j = total - 1 - i;
    if (j > i) pares.push([i, j]); else if (j === i) pares.push([i]);
  }
  for (let intento = 0; intento < 120; intento++) {
    const neg = new Uint8Array(total);
    let cuenta = 0;
    const orden = shuffle(pares.slice());
    for (let pasada = 0; pasada < 3; pasada++) {
      for (const par of orden) {
        if (cuenta + par.length > maxNeg) continue;
        if (par.some((i) => neg[i])) continue;
        par.forEach((i) => { neg[i] = 1; });
        if (largosOK(n, neg, false)) cuenta += par.length;
        else par.forEach((i) => { neg[i] = 0; });
      }
    }
    if (cuenta < minNeg) continue;
    if (!largosOK(n, neg, true)) continue;
    return neg;
  }
  return null;
}

/* Relleno inicial: dígitos distintos dentro de cada bloque. */
function rellenarDigitos(n, neg) {
  const I = (r, c) => r * n + c;
  const val = new Int8Array(n * n);
  const orden = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (!neg[I(r, c)]) orden.push([r, c]);
  const cabe = (r, c, v) => {
    for (let c2 = c - 1; c2 >= 0 && !neg[I(r, c2)]; c2--) if (val[I(r, c2)] === v) return false;
    for (let r2 = r - 1; r2 >= 0 && !neg[I(r2, c)]; r2--) if (val[I(r2, c)] === v) return false;
    // patrón mortal: un cuadro blanco 2×2 con a,b / b,a se voltea y da otra solución
    if (r > 0 && c > 0 && !neg[I(r - 1, c - 1)] && !neg[I(r - 1, c)] && !neg[I(r, c - 1)]
      && val[I(r - 1, c - 1)] === v && val[I(r - 1, c)] === val[I(r, c - 1)]) return false;
    return true;
  };
  const opciones = orden.map(() => null);
  let i = 0, vueltas = 0;
  while (i >= 0 && i < orden.length && vueltas < 20000) {
    const [r, c] = orden[i];
    if (!opciones[i]) opciones[i] = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]);
    let puesto = false;
    while (opciones[i].length) {
      const v = opciones[i].pop();
      if (cabe(r, c, v)) { val[I(r, c)] = v; puesto = true; break; }
    }
    if (puesto) i++;
    else { opciones[i] = null; val[I(r, c)] = 0; i--; if (i >= 0) val[I(orden[i][0], orden[i][1])] = 0; vueltas++; }
  }
  return i >= orden.length ? val : null;
}

/* ── Resolutor ── */
/* ¿Los dígitos de la máscara caben uno por celda del bloque? */
function emparejable(dom, cs, m, L) {
  const digs = DIGS[m];
  if (digs.length !== L) return false;
  const full = (1 << L) - 1;
  DP.fill(0, 0, full + 1);
  DP[0] = 1;
  for (let s = 0; s <= full; s++) {
    if (!DP[s]) continue;
    const k = BITS[s];
    if (k === L) return true;
    const d = dom[cs[k]];
    for (let j = 0; j < L; j++) if (!(s & (1 << j)) && (d & digs[j])) DP[s | (1 << j)] = 1;
  }
  return !!DP[full];
}

/* Propagación: deja en cada celda solo los dígitos que caben en alguna combinación
   válida de sus dos bloques. Nunca descarta un dígito de una solución real. */
function propagar(est, runSums, dom, cola, enCola) {
  const { runCells, cellRuns } = est;
  cola.length = 0;
  enCola.fill(1);
  for (let i = 0; i < runCells.length; i++) cola.push(i);
  while (cola.length) {
    const ri = cola.pop();
    enCola[ri] = 0;
    const cs = runCells[ri], L = cs.length, lista = COMBOS[L][runSums[ri]];
    if (!lista.length) return false;
    let union = 0;
    for (let k = 0; k < L; k++) union |= dom[cs[k]];
    const permit = est.buf;
    for (let k = 0; k < L; k++) permit[k] = 0;
    let alguna = false;
    for (let mi = 0; mi < lista.length; mi++) {
      const m = lista[mi];
      if ((m & union) !== m) continue;
      let ok = true;
      for (let k = 0; k < L; k++) if (!(dom[cs[k]] & m)) { ok = false; break; }
      if (!ok || !emparejable(dom, cs, m, L)) continue;
      alguna = true;
      for (let k = 0; k < L; k++) permit[k] |= dom[cs[k]] & m;
    }
    if (!alguna) return false;
    for (let k = 0; k < L; k++) {
      const ci = cs[k];
      if (dom[ci] !== permit[k]) {
        dom[ci] = permit[k];
        if (!permit[k]) return false;
        for (const rj of cellRuns[ci]) if (!enCola[rj]) { enCola[rj] = 1; cola.push(rj); }
      }
    }
  }
  return true;
}

/* Cuenta soluciones hasta `limite`. */
function contarSoluciones(est, runSums, limite) {
  const nC = est.nCeldas;
  const cola = [], enCola = new Uint8Array(est.runCells.length);
  let total = 0;
  function bt(dom0) {
    if (total >= limite) return;
    const dom = dom0.slice();
    if (!propagar(est, runSums, dom, cola, enCola)) return;
    let mejor = -1, mejorN = 10;
    for (let i = 0; i < nC; i++) {
      const sz = BITS[dom[i]];
      if (sz > 1 && sz < mejorN) { mejorN = sz; mejor = i; if (sz === 2) break; }
    }
    if (mejor < 0) { total++; return; }
    for (const bit of DIGS[dom[mejor]]) {
      const d2 = dom.slice(); d2[mejor] = bit;
      bt(d2);
      if (total >= limite) return;
    }
  }
  bt(new Int32Array(nC).fill(0x1FF));
  return total;
}

/* Estructura de bloques del patrón (índices de celda, no sumas). */
function estructura(n, neg) {
  const W = n + 1;
  const negro = (r, c) => (r === 0 || c === 0 || !!neg[(r - 1) * n + (c - 1)]);
  const idx = new Map(), celdaDe = [];
  for (let r = 1; r < W; r++) for (let c = 1; c < W; c++) if (!negro(r, c)) { idx.set(kk(r, c), idx.size); celdaDe.push((r - 1) * n + (c - 1)); }
  const runCells = [], runInfo = [];
  for (let r = 0; r < W; r++) for (let c = 0; c < W; c++) {
    if (!negro(r, c)) continue;
    if (c + 1 < W && !negro(r, c + 1)) {
      const cs = [], cells = [];
      for (let c2 = c + 1; c2 < W && !negro(r, c2); c2++) { cs.push(idx.get(kk(r, c2))); cells.push([r, c2]); }
      runCells.push(cs); runInfo.push({ cells, dir: 'H', clave: [r, c] });
    }
    if (r + 1 < W && !negro(r + 1, c)) {
      const cs = [], cells = [];
      for (let r2 = r + 1; r2 < W && !negro(r2, c); r2++) { cs.push(idx.get(kk(r2, c))); cells.push([r2, c]); }
      runCells.push(cs); runInfo.push({ cells, dir: 'V', clave: [r, c] });
    }
  }
  const cellRuns = celdaDe.map(() => []);
  runCells.forEach((cs, ri) => cs.forEach((ci) => cellRuns[ci].push(ri)));
  return { runCells, cellRuns, runInfo, celdaDe, nCeldas: idx.size, buf: new Int32Array(MAX_RUN) };
}

/* Búsqueda local: retoca dígitos hasta que el tablero tiene UNA sola solución.
   Energía = (soluciones-1)·100 + celdas que la lógica no deduce; 0 = deducible sin adivinar. */
function buscarUnico(n, neg, tope, bono) {
  const est = estructura(n, neg);
  const { runCells, cellRuns, celdaDe, nCeldas } = est;
  const val = rellenarDigitos(n, neg);
  if (!val) return null;
  const cval = new Int8Array(nCeldas);
  for (let i = 0; i < nCeldas; i++) cval[i] = val[celdaDe[i]];
  const runSums = runCells.map((cs) => cs.reduce((s, ci) => s + cval[ci], 0));
  const dom = new Int32Array(nCeldas);
  const cola = [], enCola = new Uint8Array(runCells.length);
  const medir = () => {
    dom.fill(0x1FF);
    if (!propagar(est, runSums, dom, cola, enCola)) return 1e6;
    let sinDeducir = 0;
    for (let i = 0; i < nCeldas; i++) if (BITS[dom[i]] > 1) sinDeducir++;
    if (!sinDeducir) return 0;
    return (contarSoluciones(est, runSums, 6) - 1) * 100 + sinDeducir;
  };
  let e = medir();
  const t0 = performance.now();
  let tUnico = -1;
  const amb = [];
  while (e > 0) {
    const ahora = performance.now();
    if (ahora - t0 > tope) break;
    if (e < 100) { if (tUnico < 0) tUnico = ahora; if (ahora - tUnico > bono) break; }
    amb.length = 0;
    for (let i = 0; i < nCeldas; i++) if (BITS[dom[i]] > 1) amb.push(i);
    const ci = amb.length ? amb[randInt(amb.length)] : randInt(nCeldas);
    let usados = 0;
    for (const ri of cellRuns[ci]) for (const cj of runCells[ri]) if (cj !== ci) usados |= 1 << cval[cj];
    const opts = [];
    for (let d = 1; d <= 9; d++) if (!(usados & (1 << d)) && d !== cval[ci]) opts.push(d);
    if (!opts.length) continue;
    const viejo = cval[ci], nuevo = opts[randInt(opts.length)];
    cval[ci] = nuevo;
    for (const ri of cellRuns[ci]) runSums[ri] += nuevo - viejo;
    const e2 = medir();
    if (e2 <= e) e = e2;
    else { cval[ci] = viejo; for (const ri of cellRuns[ci]) runSums[ri] += viejo - nuevo; }
  }
  if (e >= 100) return null;                 // no llegó a solución única
  for (let i = 0; i < nCeldas; i++) val[celdaDe[i]] = cval[i];
  return { est, val, runSums, deducible: e === 0 };
}

function generar() {
  const n = CFG[S.diff];
  const bono = BONO[S.diff];
  for (let intento = 0; intento < 40; intento++) {
    const neg = generarPatron(n);
    if (!neg) continue;
    const r = buscarUnico(n, neg, 800, bono);
    if (!r) continue;
    const { est, val, runSums } = r;
    const W = n + 1, H = n + 1;
    const celdas = Array.from({ length: H }, (_, rr) => Array.from({ length: W }, (_, cc) => {
      if (rr === 0 || cc === 0 || neg[(rr - 1) * n + (cc - 1)]) return { negra: true, right: 0, down: 0 };
      return { negra: false, sol: val[(rr - 1) * n + (cc - 1)], val: 0 };
    }));
    const runs = est.runInfo.map((info, ri) => ({ cells: info.cells, sum: runSums[ri], dir: info.dir }));
    est.runInfo.forEach((info, ri) => {
      const [r0, c0] = info.clave;
      if (info.dir === 'H') celdas[r0][c0].right = runSums[ri];
      else celdas[r0][c0].down = runSums[ri];
    });
    const deCelda = new Map();
    runs.forEach((run, idx) => run.cells.forEach(([rr, cc]) => {
      if (!deCelda.has(kk(rr, cc))) deCelda.set(kk(rr, cc), []);
      deCelda.get(kk(rr, cc)).push(idx);
    }));
    S.W = W; S.H = H; S.celdas = celdas; S.runs = runs; S.deCelda = deCelda;
    return true;
  }
  return false;
}

/* ── Pantallas ───────────────────────────────────────────────────────── */
function renderSetup() {
  clock.stop();
  const bests = ['facil', 'normal', 'dificil', 'experto'].map((d) => {
    const b = store.get('kak.best.' + d, null);
    return `<div class="b"><div class="bn">${b ? fmtTime(b) : '—'}</div><div class="bl">${DIFF_LABEL[d]}</div></div>`;
  }).join('');
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Kakuro', '')}
    <div class="g-setup scroll">
      <div class="card" style="padding: 14px 18px 18px;">
        <div class="row" style="border:none; padding-bottom: 8px;"><div class="row-title">Dificultad</div></div>
        ${diffSegHTML('seg-d', S.diff)}
        <div class="row-hint" style="padding: 10px 2px 6px;" id="d-hint"></div>
      </div>
      <div class="label-sm" style="margin-top:4px;">Mejores tiempos</div>
      <div class="bests">${bests}</div>
      <button class="btn btn-primary" style="margin-top:8px;" id="new">Jugar</button>
      <button class="howto" id="howto">¿Cómo se juega?</button>
    </div>
  </div>`;
  const hint = () => { $('#d-hint').textContent = `Área de juego ${CFG[S.diff]}×${CFG[S.diff]}`; };
  bindSeg('seg-d', (v) => { S.diff = v; store.set('kak.diff', v); hint(); });
  hint();
  $('#new').onclick = startGame;
  bindHowto(REGLAS);
}

function startGame() {
  if (!generar()) return;
  S.sel = null; S.pistas = 3; S.done = false;
  renderPlay();
  clock.start();
}

function renderPlay() {
  const cell = Math.min(46, Math.floor(378 / S.W));
  const cs = [];
  for (let r = 0; r < S.H; r++) for (let c = 0; c < S.W; c++) {
    const d = S.celdas[r][c];
    if (d.negra) {
      const sinsumas = !d.right && !d.down;
      cs.push(`<div class="kc negra ${sinsumas ? 'sinsumas' : ''}" style="width:${cell}px;height:${cell}px;">
        ${d.right ? `<span class="sr">${d.right}</span>` : ''}${d.down ? `<span class="sd">${d.down}</span>` : ''}</div>`);
    } else {
      cs.push(`<div class="kc blanca" data-k="${kk(r, c)}" style="width:${cell}px;height:${cell}px;font-size:${Math.floor(cell * .48)}px;"></div>`);
    }
  }
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Kakuro', `<span class="chip">${DIFF_LABEL[S.diff]}</span><span class="clock" id="clock">0:00</span>`)}
    <div class="scroll">
      <div class="boardwrap"><div class="board" style="grid-template-columns: repeat(${S.W}, ${cell}px);">${cs.join('')}</div></div>
      <div class="pad" id="pad">
        ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((v) => `<button class="key" data-n="${v}">${v}</button>`).join('')}
        <button class="key" data-n="0" aria-label="Borrar"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6H9l-6 6 6 6h11a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"></path><path d="M17 10l-4 4M13 10l4 4"></path></svg></button>
      </div>
    </div>
    <div class="tools">
      <button class="tool" id="t-pista">Pista · <span id="pistas-n">3</span></button>
      <button class="tool" id="t-nueva">Nueva</button>
      <button class="tool" id="t-salir">Salir</button>
    </div>
  </div>`;
  $$('.kc.blanca').forEach((el) => el.onclick = () => { S.sel = el.dataset.k; paint(); });
  $('#pad').onclick = (e) => {
    const b = e.target.closest('.key');
    if (b) tecla(Number(b.dataset.n));
  };
  $('#t-pista').onclick = usePista;
  $('#t-nueva').onclick = startGame;
  $('#t-salir').onclick = renderSetup;
  paint();
}

function celda(k2) {
  const [r, c] = k2.split(',').map(Number);
  return S.celdas[r][c];
}

function paint() {
  const runSel = new Set();
  if (S.sel) for (const idx of (S.deCelda.get(S.sel) || [])) {
    for (const [r, c] of S.runs[idx].cells) runSel.add(kk(r, c));
  }
  // duplicados y sumas por bloque
  const dup = new Set(), malsuma = new Set();
  for (const run of S.runs) {
    const vistos = {};
    let suma = 0, llenas = 0;
    for (const [r, c] of run.cells) {
      const v = S.celdas[r][c].val;
      if (v) {
        llenas++;
        suma += v;
        if (vistos[v]) { dup.add(kk(r, c)); dup.add(vistos[v]); }
        vistos[v] = kk(r, c);
      }
    }
    if (llenas === run.cells.length && suma !== run.sum) {
      for (const [r, c] of run.cells) malsuma.add(kk(r, c));
    }
  }
  $$('.kc.blanca').forEach((el) => {
    const d = celda(el.dataset.k);
    el.textContent = d.val || '';
    el.classList.toggle('sel', el.dataset.k === S.sel);
    el.classList.toggle('runsel', runSel.has(el.dataset.k) && el.dataset.k !== S.sel);
    el.classList.toggle('dup', dup.has(el.dataset.k));
    el.classList.toggle('malsuma', malsuma.has(el.dataset.k));
  });
}

function tecla(v) {
  if (S.done || !S.sel) return;
  const d = celda(S.sel);
  d.val = (v === 0 || d.val === v) ? 0 : v;
  vibrate(10);
  paint();
  checkWin();
}

function usePista() {
  if (S.done || S.pistas <= 0) return;
  let k2 = S.sel;
  if (!k2 || celda(k2).val === celda(k2).sol) {
    const malas = [];
    for (let r = 0; r < S.H; r++) for (let c = 0; c < S.W; c++) {
      const d = S.celdas[r][c];
      if (!d.negra && d.val !== d.sol) malas.push(kk(r, c));
    }
    if (!malas.length) return;
    k2 = malas[randInt(malas.length)];
  }
  S.pistas--;
  $('#pistas-n').textContent = S.pistas;
  if (S.pistas <= 0) $('#t-pista').disabled = true;
  S.sel = k2;
  celda(k2).val = celda(k2).sol;
  vibrate(20);
  paint();
  checkWin();
}

function checkWin() {
  // gana con cualquier llenado válido: sumas correctas y sin repetidos
  for (let r = 0; r < S.H; r++) for (let c = 0; c < S.W; c++) {
    const d = S.celdas[r][c];
    if (!d.negra && !d.val) return;
  }
  for (const run of S.runs) {
    const vals = run.cells.map(([r, c]) => S.celdas[r][c].val);
    if (new Set(vals).size !== vals.length) return;
    if (vals.reduce((a, b) => a + b, 0) !== run.sum) return;
  }
  S.done = true;
  clock.stop();
  const secs = clock.seconds;
  const k = 'kak.best.' + S.diff;
  const best = store.get(k, null);
  const isRecord = !best || secs < best;
  if (isRecord) {
    store.set(k, secs);
    store.set('kak.hub', `Mejor ${fmtTime(secs)} · ${DIFF_LABEL[S.diff]}`);
  }
  confetti(); vibrate([30, 60, 30]);
  openModal(`
    <h3>¡Cuadró todo!</h3>
    <div class="stats" style="margin:14px 0;">
      <div class="stat"><div class="n">${fmtTime(secs)}</div><div class="l">tiempo</div></div>
      <div class="stat"><div class="n">${S.runs.length}</div><div class="l">bloques</div></div>
    </div>
    ${isRecord ? '<p style="text-align:center;"><span class="record">🏆 ¡Nuevo mejor tiempo!</span></p>'
      : (best ? `<p style="text-align:center;">Tu mejor tiempo: <b>${fmtTime(best)}</b></p>` : '')}
    <div class="m-actions">
      <button class="btn btn-primary" id="m-again">Otro kakuro</button>
      <button class="btn btn-ghost" id="m-diff">Cambiar dificultad</button>
    </div>
  `);
  $('#m-again').onclick = () => { closeModal(); startGame(); };
  $('#m-diff').onclick = () => { closeModal(); renderSetup(); };
}

/* Teclado físico */
addEventListener('keydown', (e) => {
  if (!$('.board')) return;
  if (e.key >= '1' && e.key <= '9') tecla(Number(e.key));
  else if (e.key === 'Backspace' || e.key === '0' || e.key === 'Delete') tecla(0);
});

renderSetup();
</script>
</body>
