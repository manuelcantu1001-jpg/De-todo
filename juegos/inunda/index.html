<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAF4E8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="description" content="Inunda el tablero: píntalo todo de un color antes de agotar los movimientos." />
<title>Inunda</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C0603A'/%3E%3Crect x='13' y='9' width='38' height='44' rx='6' fill='%23FAF4E8'/%3E%3Ctext x='32' y='42' font-size='28' font-family='Arial,Helvetica,sans-serif' font-weight='700' fill='%2333302B' text-anchor='middle'%3E▧%3C/text%3E%3C/svg%3E" />
<link rel="manifest" href="../../manifest.webmanifest" />
<link rel="apple-touch-icon" href="../../icons/icon-180.png" />
<link rel="stylesheet" href="../../comun/estilo.css" />
<style>
  /* La zona de juego reparte el alto que sobra entre marcador, tablero y paleta:
     sin media pantalla vacía antes de los mandos. */
  .zona { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-evenly; }
  .iwrap { display: flex; justify-content: center; padding: 14px 14px 0; }
  .igrid { display: grid; gap: 0; width: min(92vw, 380px); border-radius: 12px; overflow: hidden; border: var(--trazo) solid var(--linea-fuerte); }
  .igrid i { aspect-ratio: 1; display: block; transition: background .18s var(--ease); }
  .paleta { display: flex; gap: 10px; justify-content: center; padding: 16px 16px 0; }
  .paleta button {
    width: 44px; height: 44px; border-radius: 12px; border: none; cursor: pointer;
    transition: opacity var(--dur) var(--ease);
  }
  .paleta button:active { opacity: .7; }
  /* El color que ya tiene la mancha: tocarlo no hace nada, así que se marca. */
  .paleta button.actual { outline: var(--trazo) solid var(--ink); outline-offset: 3px; }
  /* Marcador al estilo de la piel: etiqueta técnica en monoespaciada y el número
     en sans a peso medio, no todo en negrita. */
  .marcador { display: flex; justify-content: center; gap: 22px; padding-top: 14px; }
  .marcador span { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--sub); display: flex; align-items: baseline; gap: 7px; }
  .marcador b { font-family: var(--font); font-size: 17px; font-weight: 500; color: var(--ink); letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
  .tools { margin: 0 16px calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; padding-top: 12px; }
  .tool { border: var(--trazo) solid var(--linea-fuerte); cursor: pointer; font-family: var(--title-font); font-weight: 500;
    font-size: 13px; padding: 10px 17px; border-radius: var(--pastilla); background: var(--card); color: var(--ink); }
  .tool:active { opacity: .6; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>

<script src="../../comun/nucleo.js"></script>
<script>
'use strict';

/* Las tintas van ordenadas por separación, no por número: los tableros de 5 y
   6 colores toman las primeras N, y así el par más parecido de la paleta
   (tinta 5 y 6, ΔE2000 15) solo coincide en el de 8. Con este orden el mínimo
   entre los 5 primeros es ΔE 24 y entre los 6 primeros, 21. */
const COLORES = ['--tinta-1', '--tinta-2', '--tinta-3', '--tinta-5',
  '--tinta-7', '--tinta-4', '--tinta-8', '--tinta-6'].map(color);
const CFG = {
  facil:   { n: 9,  c: 5, margen: 5 },
  normal:  { n: 12, c: 6, margen: 4 },
  dificil: { n: 14, c: 6, margen: 3 },
  experto: { n: 14, c: 8, margen: 2 },
};

const S = {
  diff: store.get('inunda.diff', 'normal'),
  n: 0, c: 0, grid: null, lim: 0, usados: 0, jugando: false,
};

const REGLAS = `<p>Todo empieza desde la <b>esquina superior izquierda</b>: al tocar un color, tu mancha se pinta de ese color y <b>absorbe</b> las casillas vecinas que lo tengan.</p>
<p>La meta: dejar el tablero entero <b>de un solo color</b> antes de agotar los movimientos. El límite se calcula para que siempre alcance (con algo de colmillo).</p>
<p>Tu marca es ganar usando la <b>menor cantidad</b> de movimientos.</p>`;

/* ── Lógica de inundación ────────────────────────────────────────────── */
function region(grid, n) {
  const c0 = grid[0], vista = new Set([0]), cola = [0];
  while (cola.length) {
    const i = cola.pop();
    const r = Math.floor(i / n), col = i % n;
    for (const j of [r > 0 ? i - n : -1, r < n - 1 ? i + n : -1, col > 0 ? i - 1 : -1, col < n - 1 ? i + 1 : -1]) {
      if (j >= 0 && !vista.has(j) && grid[j] === c0) { vista.add(j); cola.push(j); }
    }
  }
  return vista;
}

function inundar(grid, n, color) {
  const reg = region(grid, n);
  for (const i of reg) grid[i] = color;
  return region(grid, n).size;
}

function vorazMovs(grid0, n, colores) {
  const g = grid0.slice();
  let movs = 0;
  while (region(g, n).size < n * n && movs < 99) {
    let mejor = -1, mejorC = 0;
    for (let c = 0; c < colores; c++) {
      if (c === g[0]) continue;
      const g2 = g.slice();
      const tam = inundar(g2, n, c);
      if (tam > mejor) { mejor = tam; mejorC = c; }
    }
    inundar(g, n, mejorC);
    movs++;
  }
  return movs;
}

function genTablero() {
  const { n, c, margen } = CFG[S.diff];
  S.n = n; S.c = c;
  S.grid = Array.from({ length: n * n }, () => randInt(c));
  S.lim = vorazMovs(S.grid, n, c) + margen;
  S.usados = 0;
  S.jugando = true;
}

/* ── Pantallas ───────────────────────────────────────────────────────── */
function renderSetup() {
  const bests = ['facil', 'normal', 'dificil', 'experto'].map((d) => {
    const b = store.get('inunda.best.' + d, 0);
    return `<div class="b"><div class="bn">${b || '—'}</div><div class="bl">${DIFF_LABEL[d]}</div></div>`;
  }).join('');
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Inunda', '')}
    <div class="g-setup scroll">
      <div class="card" style="padding: 14px 18px 18px;">
        <div class="row" style="border:none; padding-bottom: 8px;"><div class="row-title">Dificultad</div><div class="row-hint" id="d-hint"></div></div>
        ${diffSegHTML('seg-d', S.diff)}
      </div>
      <div class="label-sm" style="margin-top:4px;">Menos movimientos</div>
      <div class="bests">${bests}</div>
      <button class="btn btn-primary" style="margin-top:8px;" id="new">Jugar</button>
      <button class="howto" id="howto">¿Cómo se juega?</button>
    </div>
  </div>`;
  const hint = () => { const c = CFG[S.diff]; $('#d-hint').textContent = `${c.n}×${c.n} · ${c.c} colores`; };
  hint();
  bindSeg('seg-d', (v) => { S.diff = v; store.set('inunda.diff', v); hint(); });
  $('#new').onclick = () => { genTablero(); renderPlay(); };
  bindHowto(REGLAS);
}

function renderPlay() {
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Inunda', `<span class="chip">${DIFF_LABEL[S.diff]}</span>`)}
    <div class="zona">
      <div class="marcador"><span>Te quedan <b id="rest"></b></span><span>Tu mancha <b id="tam"></b></span></div>
      <div class="iwrap">
        <div class="igrid" id="igrid" style="grid-template-columns: repeat(${S.n}, 1fr);">
          ${S.grid.map(() => '<i></i>').join('')}
        </div>
      </div>
      <div class="paleta" id="paleta">
        ${Array.from({ length: S.c }, (_, c) => `<button data-c="${c}" style="background:${COLORES[c]}" aria-label="Color ${c + 1}"></button>`).join('')}
      </div>
    </div>
    <div class="tools">
      <button class="tool" id="t-salir">Salir</button>
    </div>
  </div>`;
  $('#paleta').onclick = (e) => {
    const b = e.target.closest('button');
    if (b) tap(Number(b.dataset.c));
  };
  $('#t-salir').onclick = () => { S.jugando = false; renderSetup(); };
  paint();
}

function paint() {
  const celdas = $$('#igrid i');
  S.grid.forEach((c, i) => { celdas[i].style.background = COLORES[c]; });
  $('#rest').textContent = S.lim - S.usados;
  $('#tam').textContent = region(S.grid, S.n).size + ' / ' + S.n * S.n;
  $$('#paleta button').forEach((b) => b.classList.toggle('actual', Number(b.dataset.c) === S.grid[0]));
}

function tap(c) {
  if (!S.jugando || c === S.grid[0]) return;
  const tam = inundar(S.grid, S.n, c);
  S.usados++;
  vibrate(8);
  paint();
  if (tam === S.n * S.n) return ganar();
  if (S.usados >= S.lim) return perder();
}

function ganar() {
  S.jugando = false;
  const best = store.get('inunda.best.' + S.diff, 0);
  const isRecord = !best || S.usados < best;
  if (isRecord) {
    store.set('inunda.best.' + S.diff, S.usados);
    store.set('inu.hub', `Mejor: ${S.usados} mov.`);
  }
  confetti(); vibrate([30, 60, 30]);
  setTimeout(() => {
    openModal(`
      <h3>${isRecord ? '¡Récord!' : '¡Todo de un color!'}</h3>
      <div class="stats" style="margin:14px 0;">
        <div class="stat"><div class="n">${S.usados}</div><div class="l">movimientos</div></div>
        <div class="stat"><div class="n">${S.lim - S.usados}</div><div class="l">de sobra</div></div>
        <div class="stat"><div class="n">${isRecord ? S.usados : best}</div><div class="l">mejor</div></div>
      </div>
      <div class="m-actions">
        <button class="btn btn-primary" id="m-again">Otro tablero</button>
        <button class="btn btn-ghost" id="m-out">Salir</button>
      </div>
    `);
    $('#m-again').onclick = () => { closeModal(); genTablero(); renderPlay(); };
    $('#m-out').onclick = () => { closeModal(); renderSetup(); };
  }, 600);
}

function perder() {
  S.jugando = false;
  vibrate([80, 60, 80]);
  setTimeout(() => {
    openModal(`
      <h3>Se acabaron los movimientos</h3>
      <p style="text-align:center;">Tu mancha llegó a ${region(S.grid, S.n).size} de ${S.n * S.n} casillas.</p>
      <div class="m-actions">
        <button class="btn btn-primary" id="m-again">Otro tablero</button>
        <button class="btn btn-ghost" id="m-out">Salir</button>
      </div>
    `);
    $('#m-again').onclick = () => { closeModal(); genTablero(); renderPlay(); };
    $('#m-out').onclick = () => { closeModal(); renderSetup(); };
  }, 500);
}

renderSetup();
</script>
</body>
</html>
