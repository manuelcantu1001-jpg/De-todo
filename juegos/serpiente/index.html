<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAF4E8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="description" content="La serpiente clásica: come, crece y no te muerdas." />
<title>Serpiente</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C0603A'/%3E%3Crect x='13' y='9' width='38' height='44' rx='6' fill='%23FAF4E8'/%3E%3Ctext x='32' y='42' font-size='28' font-family='Arial,Helvetica,sans-serif' font-weight='700' fill='%2333302B' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
<link rel="manifest" href="../../manifest.webmanifest" />
<link rel="apple-touch-icon" href="../../icons/icon-180.png" />
<link rel="stylesheet" href="../../comun/estilo.css" />
<style>
  .lienzo { display: flex; justify-content: center; padding: 12px 12px 0; }
  /* El borde del tablero es la pared que te mata: 2 px, no un susurro (el
     tablero contra el crema mide ΔE 4 y sin filete no se distinguía). */
  canvas { border-radius: 12px; border: 2px solid var(--linea-fuerte); touch-action: none; }
  /* Marcador: etiqueta técnica en monoespaciada y número en sans a peso 500. */
  .statusrow { display: flex; justify-content: center; gap: 26px; padding: 8px 0 0; }
  .statusrow span {
    display: flex; align-items: baseline; gap: 7px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--sub);
  }
  .statusrow b { font-family: var(--font); font-size: 17px; font-weight: 500; letter-spacing: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
  .aviso { text-align: center; font-family: var(--display); font-style: italic; font-size: 13.5px; color: var(--bg-sub); padding-top: 8px; min-height: 17px; }

  /* Mando de pulgar: cruz de 4 flechas en la zona baja, donde llega la mano. */
  .mando {
    margin: auto auto 0; display: grid; gap: 7px; padding: 6px 0 2px;
    grid-template-columns: repeat(3, 70px); grid-template-rows: repeat(3, 64px);
  }
  .flecha {
    border: var(--trazo) solid var(--linea-fuerte); background: var(--card); color: var(--ink);
    cursor: pointer; padding: 0; display: grid; place-items: center;
    touch-action: none; -webkit-user-select: none; user-select: none; border-radius: var(--mano-1);
  }
  .flecha:active, .flecha.pulsada { background: var(--accent-soft); opacity: .82; }
  .flecha svg { width: 26px; height: 26px; }
  .f-arr { grid-area: 1 / 2; } .f-izq { grid-area: 2 / 1; }
  .f-der { grid-area: 2 / 3; } .f-aba { grid-area: 3 / 2; }
  .mando .centro { grid-area: 2 / 2; display: grid; place-items: center; font-family: var(--font);
    font-size: 11px; font-style: italic; color: var(--faint); text-align: center; line-height: 1.15; }
  @media (max-height: 760px) { .mando { grid-template-rows: repeat(3, 50px); } }
  .tools { margin: 8px 16px calc(14px + env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; padding-top: 6px; }
  .tool { border: var(--trazo) solid var(--linea-fuerte); cursor: pointer; font-family: var(--font); font-weight: 500;
    font-size: 13px; padding: 10px 17px; border-radius: var(--pastilla); background: var(--card); color: var(--ink); }
  .tool:active { opacity: .6; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>

<script src="../../comun/nucleo.js"></script>
<script>
'use strict';

const N = 17;
const CFG = { facil: 150, normal: 115, dificil: 88, experto: 65 };
const UMBRAL = 18;      // píxeles de dedo que disparan el giro, sin soltar
const ACEL = 0.99;      // cada fruta acorta el tick un 1 %
const SUELO = 0.65;     // …pero nunca por debajo del 65 % del ritmo inicial

const S = {
  diff: store.get('serp.diff', 'normal'),
  snake: [], dir: [1, 0], cola: [], food: null,
  score: 0, tick: null, over: false, pausa: false,
};

/* Ritmo actual: arranca en CFG y se aprieta con cada fruta hasta el suelo. */
function intervalo() {
  const base = CFG[S.diff];
  return Math.max(Math.round(base * SUELO), Math.round(base * Math.pow(ACEL, S.score)));
}

const REGLAS = `<p>Dirige a la serpiente con las <b>cuatro flechas</b> de abajo o <b>arrastrando</b> el dedo por el tablero: gira en cuanto el dedo se mueve ${UMBRAL} px, sin levantarlo, así que puedes encadenar giros de un tirón.</p>
<p>Come la fruta para crecer: cada una vale un punto y <b>aprieta un poco el ritmo</b>. Pierdes si chocas con la <b>pared</b> o contigo misma. No puedes girar 180° de golpe.</p>
<p>La dificultad es la velocidad de salida. Si sales de la app a media partida, se pausa sola; toca el tablero para seguir.</p>`;

function renderSetup() {
  detener();
  const bests = ['facil', 'normal', 'dificil', 'experto'].map((d) => {
    const b = store.get('serp.best.' + d, 0);
    return `<div class="b"><div class="bn">${b || '—'}</div><div class="bl">${DIFF_LABEL[d]}</div></div>`;
  }).join('');
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Serpiente', '')}
    <div class="g-setup scroll">
      <div class="card" style="padding: 14px 18px 18px;">
        <div class="row" style="border:none; padding-bottom: 8px;"><div class="row-title">Velocidad</div></div>
        ${diffSegHTML('seg-d', S.diff)}
      </div>
      <div class="label-sm" style="margin-top:4px;">Mejores puntajes</div>
      <div class="bests">${bests}</div>
      <button class="btn btn-primary" style="margin-top:8px;" id="new">Jugar</button>
      <button class="howto" id="howto">¿Cómo se juega?</button>
    </div>
  </div>`;
  bindSeg('seg-d', (v) => { S.diff = v; store.set('serp.diff', v); });
  $('#new').onclick = startGame;
  bindHowto(REGLAS);
}

function startGame() {
  const m = Math.floor(N / 2);
  S.snake = [[m - 1, m], [m, m]];
  S.dir = [1, 0];
  S.cola = [];
  S.score = 0;
  S.over = false;
  S.pausa = false;
  ponerComida();
  renderPlay();
  arrancar();
}

function ponerComida() {
  const ocupado = new Set(S.snake.map(([x, y]) => x + ',' + y));
  let x, y;
  do { x = randInt(N); y = randInt(N); } while (ocupado.has(x + ',' + y));
  S.food = [x, y];
}

const FLECHA = (rot) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
  stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${rot}deg)"><path d="M12 19V6M6 12l6-6 6 6"/></svg>`;

function renderPlay() {
  // También acotado por alto: en un teléfono de 667 px el mando no cabía debajo.
  const size = Math.min(378, Math.floor(innerWidth * .94), innerHeight - 350);
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Serpiente', `<span class="chip">${DIFF_LABEL[S.diff]}</span>`)}
    <div class="statusrow">
      <span>Puntos <b id="pts">0</b></span>
      <span>Mejor <b>${store.get('serp.best.' + S.diff, 0)}</b></span>
    </div>
    <div class="lienzo"><canvas id="cv" width="${size}" height="${size}"></canvas></div>
    <div class="aviso" id="aviso">Flechas o dedo sobre el tablero</div>
    <div class="mando" id="mando">
      <button class="flecha f-arr" data-d="0,-1" aria-label="Arriba">${FLECHA(0)}</button>
      <button class="flecha f-izq" data-d="-1,0" aria-label="Izquierda">${FLECHA(-90)}</button>
      <div class="centro">gira<br>aquí</div>
      <button class="flecha f-der" data-d="1,0" aria-label="Derecha">${FLECHA(90)}</button>
      <button class="flecha f-aba" data-d="0,1" aria-label="Abajo">${FLECHA(180)}</button>
    </div>
    <div class="tools">
      <button class="tool" id="t-salir">Salir</button>
    </div>
  </div>`;
  const cv = $('#cv');

  /* El giro sale en el PRIMER pointermove que cruza el umbral, no al soltar.
     Al girar, el origen del gesto se reinicia donde está el dedo: así se
     encadenan curvas sin levantarlo. */
  let g = null;
  const despertar = () => {
    if (S.pausa && !S.over) { S.pausa = false; const a = $('#aviso'); if (a) a.textContent = ''; arrancar(); }
  };
  cv.addEventListener('pointerdown', (e) => {
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    g = { x: e.clientX, y: e.clientY, id: e.pointerId };
    despertar();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!g || e.pointerId !== g.id) return;
    const dx = e.clientX - g.x, dy = e.clientY - g.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < UMBRAL) return;
    girar(Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)]);
    g.x = e.clientX; g.y = e.clientY;
  });
  const soltar = () => { g = null; };
  cv.addEventListener('pointerup', soltar);
  cv.addEventListener('pointercancel', soltar);

  // Mando de pulgar: responde en pointerdown, sin esperar al click.
  $('#mando').addEventListener('pointerdown', (e) => {
    const b = e.target.closest('.flecha');
    if (!b) return;
    e.preventDefault();
    despertar();
    girar(b.dataset.d.split(',').map(Number));
    b.classList.add('pulsada');
    setTimeout(() => b.classList.remove('pulsada'), 90);
    vibrate(4);
  });

  $('#t-salir').onclick = renderSetup;
  dibujar();
}

function girar(d) {
  const cur = S.cola.length ? S.cola[S.cola.length - 1] : S.dir;
  if (d[0] === -cur[0] && d[1] === -cur[1]) return;   // sin 180°
  if (d[0] === cur[0] && d[1] === cur[1]) return;
  if (S.cola.length < 2) S.cola.push(d);
}

/* Cada tick se reprograma solo: así el ritmo puede apretarse con cada
   fruta sin reiniciar el reloj a destiempo. */
function arrancar() {
  detener();
  S.tick = setTimeout(function ciclo() {
    paso();
    if (S.tick) S.tick = setTimeout(ciclo, intervalo());
  }, intervalo());
}
function detener() {
  if (S.tick) { clearTimeout(S.tick); S.tick = null; }
}

function paso() {
  if (S.cola.length) S.dir = S.cola.shift();
  const cabeza = S.snake[S.snake.length - 1];
  const nx = cabeza[0] + S.dir[0], ny = cabeza[1] + S.dir[1];
  if (nx < 0 || nx >= N || ny < 0 || ny >= N) return morir();
  if (S.snake.some(([x, y], i) => i > 0 && x === nx && y === ny)) return morir();
  S.snake.push([nx, ny]);
  if (S.food && nx === S.food[0] && ny === S.food[1]) {
    S.score++;
    $('#pts').textContent = S.score;
    vibrate(12);
    ponerComida();
  } else {
    S.snake.shift();
  }
  dibujar();
}

/* El tablero de fondo no cambia nunca: se pinta una vez aparte y luego se
   estampa de un golpe. Antes eran 400 rectángulos en cada cuadro. */
let fondo = null, fondoClave = '';
function fondoDelTablero(lado, cell) {
  const clave = `${lado}x${N}`;
  if (fondo && fondoClave === clave) return fondo;
  fondo = document.createElement('canvas');
  fondo.width = fondo.height = lado;
  fondoClave = clave;
  const f = fondo.getContext('2d');
  f.fillStyle = color('--card');
  f.fillRect(0, 0, lado, lado);
  f.fillStyle = color('--soft');
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
    if ((x + y) % 2 === 0) f.fillRect(x * cell, y * cell, cell, cell);
  }
  return fondo;
}

function dibujar() {
  const cv = $('#cv');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const cell = cv.width / N;
  ctx.drawImage(fondoDelTablero(cv.width, cell), 0, 0);
  // comida: tinta-2, que sí llega a 4,4:1 sobre la casilla oscura (--second se quedaba en 2,6)
  if (S.food) {
    ctx.fillStyle = color('--tinta-2');
    ctx.beginPath();
    ctx.arc((S.food[0] + .5) * cell, (S.food[1] + .5) * cell, cell * .34, 0, Math.PI * 2);
    ctx.fill();
  }
  // serpiente: cuerpo terracota pleno (al 82 % bajaba a 2,6:1) y cabeza de
  // tinta, que se distingue del cuerpo por color (ΔE 35) y no solo por los ojos
  const acc = color('--accent'), tinta = color('--ink');
  S.snake.forEach(([x, y], i) => {
    const esCabeza = i === S.snake.length - 1;
    ctx.fillStyle = esCabeza ? tinta : acc;
    const pad = cell * .08;
    const r = cell * .3;
    ctx.beginPath();
    ctx.roundRect(x * cell + pad, y * cell + pad, cell - pad * 2, cell - pad * 2, r);
    ctx.fill();
    if (esCabeza) {
      ctx.fillStyle = color('--card');
      const ox = S.dir[0], oy = S.dir[1];
      ctx.beginPath();
      ctx.arc((x + .5 + ox * .15 - oy * .18) * cell, (y + .5 + oy * .15 + ox * .18) * cell, cell * .07, 0, Math.PI * 2);
      ctx.arc((x + .5 + ox * .15 + oy * .18) * cell, (y + .5 + oy * .15 - ox * .18) * cell, cell * .07, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

function morir() {
  detener();
  S.over = true;
  vibrate([80, 60, 80]);
  const best = store.get('serp.best.' + S.diff, 0);
  const isRecord = S.score > best;
  if (isRecord) {
    store.set('serp.best.' + S.diff, S.score);
    store.set('serp.hub', `Mejor: ${S.score} pts · ${DIFF_LABEL[S.diff]}`);
  }
  setTimeout(() => {
    openModal(`
      <h3>${isRecord && S.score > 0 ? '¡Récord!' : 'Fin del paseo'}</h3>
      <div class="stats" style="margin:14px 0;">
        <div class="stat"><div class="n">${S.score}</div><div class="l">puntos</div></div>
        <div class="stat"><div class="n">${Math.max(best, S.score)}</div><div class="l">mejor</div></div>
      </div>
      <div class="m-actions">
        <button class="btn btn-primary" id="m-again">Otra partida</button>
        <button class="btn btn-ghost" id="m-diff">Cambiar velocidad</button>
      </div>
    `);
    $('#m-again').onclick = () => { closeModal(); startGame(); };
    $('#m-diff').onclick = () => { closeModal(); renderSetup(); };
  }, 400);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && S.tick) {
    detener();
    S.pausa = true;
    const a = $('#aviso');
    if (a) a.textContent = 'Pausa — toca el tablero para seguir';
  }
});

addEventListener('keydown', (e) => {
  const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (d && $('#cv')) {
    if (S.pausa && !S.over) { S.pausa = false; $('#aviso').textContent = ''; arrancar(); }
    girar(d);
    e.preventDefault();
  }
});

renderSetup();
</script>
</body>
</html>
