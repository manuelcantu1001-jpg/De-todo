<style>
  /* Todo con prefijo cua- : una clase con nombre genérico ya pisó dos veces el
     estilo compartido (.seg de la naval, .meta del ludo). */

  /* Solo la pantalla de juego reparte el alto que sobra; la de inicio no. */
  .cua-zona { display: flex; flex-direction: column; justify-content: space-evenly; padding: 0 16px; }

  .cua-marca { display: flex; justify-content: center; gap: 22px; }
  .cua-marca span {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .11em; text-transform: uppercase;
    color: var(--sub); display: flex; align-items: baseline; gap: 6px;
  }
  .cua-marca b {
    font-family: var(--font); font-size: 16px; font-weight: 500; color: var(--ink);
    letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums;
  }
  .cua-marca span.apura b { color: var(--bad); }
  .cua-pie { text-align: center; font-family: var(--display); font-style: italic; font-size: 13px; color: var(--sub); }

  /* Palabras ya hechas: pastillas en el bloque beige. */
  .cua-hechas { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 30px; align-items: center; }
  .cua-h {
    font-size: 13px; font-weight: 500; padding: 5px 12px; border-radius: var(--pastilla);
    background: var(--panel); color: var(--ink);
  }
  .cua-h.vacio { background: none; font-family: var(--display); font-style: italic; font-weight: 400; color: var(--sub); padding: 5px 0; }

  /* El cuadrado. Cuatro barras (los lados) y doce fichas encima. */
  .cua-caja { display: flex; justify-content: center; }
  .cua-cuadro {
    width: min(84vw, 330px, calc(100dvh - 372px)); min-width: 208px; height: auto; aspect-ratio: 1;
    -webkit-user-select: none; user-select: none; touch-action: manipulation; overflow: visible;
  }
  /* Cada lado es un bloque beige: es el token de la casa para «agrupar sin
     dibujar caja», y aquí lo que hay que agrupar son las tres letras de un
     lado, que es justo la regla del juego. */
  .cua-lado { fill: var(--panel); }
  .cua-marco { fill: none; stroke: var(--linea); stroke-width: .8; }
  .cua-traza { stroke: var(--second); stroke-width: 1; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .cua-traza.viva { stroke: var(--accent); stroke-width: 1.8; }
  /* El blanco de toque no cambia de tamaño aunque la ficha encoja: sigue
     siendo de 56px de lado incluso cuando la letra está apagada. */
  .cua-pt .cua-hit { fill: transparent; stroke: none; cursor: pointer; }
  .cua-pt .cua-mota {
    fill: var(--card); stroke: var(--linea-fuerte); stroke-width: .8; pointer-events: none;
    transition: fill var(--dur) var(--ease), stroke var(--dur) var(--ease), r var(--dur) var(--ease);
  }
  .cua-pt text {
    font-family: var(--font); font-size: 8.6px; font-weight: 500; fill: var(--ink);
    text-anchor: middle; dominant-baseline: central; text-transform: uppercase; pointer-events: none;
  }
  /* El relleno cuenta lo permanente (letra ya gastada) y el aro, lo de ahora
     (letra de la palabra que estás formando): son dos cosas distintas y se
     pueden dar a la vez. */
  .cua-pt.hecha .cua-mota { fill: var(--accent-texto); stroke: var(--accent-texto); }
  .cua-pt.hecha text { fill: var(--accent-ink); }
  .cua-pt.viva .cua-mota { stroke: var(--ink); stroke-width: 1.6; }
  /* Las tres del lado de la última letra: ahora no valen. Encogen y se
     apagan un poco; el grueso del aviso lo lleva el tamaño, no el color,
     porque bajar más la opacidad tiraba la letra crema de una ficha ya
     gastada por debajo de 3:1 sobre su propio relleno. */
  .cua-pt.apagada { opacity: .8; }
  .cua-pt.apagada .cua-mota { r: 6.4px; }

  /* Palabra en formación */
  .cua-entrada {
    display: flex; justify-content: center; align-items: center; min-height: 40px; padding: 0 8px;
    font-family: var(--font); font-size: 27px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase;
    color: var(--ink); -webkit-user-select: none; user-select: none; overflow: hidden; white-space: nowrap;
  }
  .cua-entrada .cua-fija { color: var(--accent-texto); }
  .cua-entrada .cua-caret { display: inline-block; width: 2px; height: 28px; margin-left: 3px; background: var(--accent); animation: cuaCaret 1.1s var(--ease) infinite; }
  @keyframes cuaCaret { 50% { opacity: 0; } }

  .cua-acciones { display: flex; gap: 9px; justify-content: center; }
  .cua-acciones .btn { flex: 1; min-width: 0; padding: 12px 6px; font-size: 14px; }
  .cua-acciones .btn-primary { flex: 1.35; }

  .cua-tools { margin: 0 14px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 8px; justify-content: center; padding-top: 8px; }
  .cua-tools button {
    flex: 1 1 0; min-width: 0; border: var(--trazo) solid var(--linea-fuerte); cursor: pointer;
    font-family: var(--title-font); font-weight: 500; font-size: 12.5px; min-height: 40px;
    padding: 10px 4px; border-radius: var(--pastilla); background: var(--card); color: var(--ink);
  }
  .cua-tools button:active { opacity: .6; }

  /* Inicio */
  .cua-hoy { font-size: 13.5px; color: var(--sub); line-height: 1.5; }
  .cua-hoy b { color: var(--ink); font-weight: 500; }

  .cua-sol { text-align: center; font-size: 15px; color: var(--sub); line-height: 1.7; }
  .cua-sol b { color: var(--ink); font-weight: 500; }
</style>

<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>

<script src="../../banco-es.js"></script>
<script src="../../vocab-es.js"></script>
<script>
'use strict';

/* ==GEN== Núcleo del Cuadrado de letras: vocabulario, resolutor y generador.
   No toca el DOM, así que se puede correr aparte para medirlo.

   Reglas que codifica:
   · 12 letras distintas, 3 por lado.
   · Una palabra es legal si todas sus letras están en el cuadrado y dos letras
     seguidas nunca son del mismo lado (por eso las palabras con letra doble,
     «carro», «llave», quedan fuera de raíz: una letra siempre está en su lado).
   · Cada palabra empieza por la última letra de la anterior.
   · Se gana cuando las doce letras han salido.

   El vocabulario del que salen los retos es EXACTAMENTE el que se acepta:
   banco-es.js (curado) + vocab-es.js (plurales y conjugaciones). */

const AL = 'abcdefghijklmnñopqrstuvwxyz';
const COD = (() => { const t = new Int8Array(256).fill(-1); for (let i = 0; i < AL.length; i++) t[AL.charCodeAt(i)] = i; return t; })();
const pop = (m) => { let k = 0; while (m) { m &= m - 1; k++; } return k; };
const FULL = 4095;

/* Nombres propios colados en las dos listas: no son palabras del español, así
   que ni se proponen ni se aceptan (misma lista que usa la Escalera). */
const NOMBRES = new Set(['carla', 'garcia', 'tamara', 'marcia', 'paula', 'lola', 'rita', 'victor']);

let PAL = null, PORINI = null, MAPA = null;

function prepararVocabulario() {
  if (PAL) return;
  PAL = []; MAPA = new Map();
  const meter = (w, n, rank) => {
    if (n.length < 3 || MAPA.has(n) || NOMBRES.has(n)) return;
    const c = new Int8Array(n.length);
    let m = 0, ant = -1, ok = true;
    for (let i = 0; i < n.length; i++) {
      const k = COD[n.charCodeAt(i)];
      if (k < 0 || k === ant) { ok = false; break; }   // letra doble seguida: imposible en el cuadrado
      c[i] = k; m |= 1 << k; ant = k;
    }
    if (!ok || pop(m) > 12) return;
    const p = { w, n, c, m, ini: c[0], fin: c[c.length - 1], rank };
    MAPA.set(n, p); PAL.push(p);
  };
  for (const e of Banco.list) meter(e.w, e.n, e.rank);
  for (const e of Vocab.list) meter(e.w, e.n, 1e6 + e.rank);
  PORINI = []; for (let i = 0; i < 27; i++) PORINI.push([]);
  for (const p of PAL) PORINI[p.ini].push(p);
}

/* ── Azar reproducible (mulberry32; nada de LCG en coma flotante) ─────── */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function barajar(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ── Cuadrado ────────────────────────────────────────────────────────── */
/* cu = { L: 12 códigos en orden (lado 0 = arriba, 1 = derecha, 2 = abajo,
   3 = izquierda), mask: bits de las 12 letras, lado[27], pos[27] } */
function armarCuadrado(grupos, rng) {
  const gs = barajar(grupos, rng).map((g) => barajar(g, rng));
  const L = [].concat.apply([], gs);
  const lado = new Int8Array(27).fill(-1);
  const pos = new Int8Array(27).fill(-1);
  let mask = 0;
  for (let i = 0; i < 12; i++) { const c = L[i]; lado[c] = (i / 3) | 0; pos[c] = i; mask |= 1 << c; }
  return { L, mask, lado, pos };
}
const letrasDe = (cu) => cu.L.map((c) => AL[c]);

/* Palabras legales en un cuadrado. Devuelve la lista deduplicada por firma
   (letras usadas + primera + última): para buscar el mínimo dos palabras con
   la misma firma son intercambiables, y «mult» guarda cuántas hay de verdad
   para poder contar soluciones distintas sin recorrerlas todas. */
function palabrasDelCuadrado(cu, filtro) {
  const mask = cu.mask, lado = cu.lado, pos = cu.pos, fuera = ~mask;
  const firmas = new Map();
  let totales = 0;
  for (let i = 0; i < PAL.length; i++) {
    const p = PAL[i];
    if (p.m & fuera) continue;
    if (filtro && !filtro(p)) continue;
    let ok = true, ant = -1, rm = 0;
    for (let k = 0; k < p.c.length; k++) {
      const l = lado[p.c[k]];
      if (l === ant) { ok = false; break; }
      ant = l; rm |= 1 << pos[p.c[k]];
    }
    if (!ok) continue;
    totales++;
    const ini = pos[p.c[0]], fin = pos[p.c[p.c.length - 1]];
    const clave = (rm * 12 + ini) * 12 + fin;
    const y = firmas.get(clave);
    if (y) { y.mult++; if (p.rank < y.p.rank) y.p = p; }
    else firmas.set(clave, { p: p, rm: rm, ini: ini, fin: fin, mult: 1, i: firmas.size });
  }
  const W = Array.from(firmas.values());
  W.totales = totales;
  return W;
}

/* Mínimo de palabras y una solución de ejemplo, por anchura sobre los estados
   (letras ya usadas, última letra). El espacio de estados es completo —4096
   máscaras × 12 letras—, así que el primer estado completo que aparece está en
   la capa mínima: el número que sale es el mínimo de verdad, no una cota. */
function resolver(W, tope) {
  const porIni = []; for (let i = 0; i < 12; i++) porIni.push([]);
  for (const w of W) porIni[w.ini].push(w);
  const N = 4096 * 12;
  const dist = new Uint8Array(N), prev = new Int32Array(N).fill(-1), cual = new Int32Array(N).fill(-1);
  let capa = [], meta = -1;
  for (let i = 0; i < W.length; i++) {
    const w = W[i], s = w.rm * 12 + w.fin;
    if (!dist[s]) { dist[s] = 1; cual[s] = i; capa.push(s); if (w.rm === FULL && meta < 0) meta = s; }
  }
  let d = 1;
  while (meta < 0 && d < tope && capa.length) {
    const sig = [];
    for (let a = 0; a < capa.length; a++) {
      const s = capa[a], mk = (s / 12) | 0, lt = s % 12, lista = porIni[lt];
      for (let b = 0; b < lista.length; b++) {
        const w = lista[b], nm = mk | w.rm, ns = nm * 12 + w.fin;
        if (dist[ns]) continue;
        dist[ns] = d + 1; prev[ns] = s; cual[ns] = w.i; sig.push(ns);
        if (nm === FULL && meta < 0) meta = ns;
      }
    }
    capa = sig; d++;
  }
  if (meta < 0) return null;
  const sol = [];
  for (let s = meta; s >= 0; s = prev[s]) sol.push(W[cual[s]]);
  sol.reverse();
  return sol;
}

/* Cuántas secuencias de palabras distintas resuelven el cuadrado con «tope»
   palabras o menos. Cuenta palabras de verdad (multiplica por «mult») y se
   satura en «cap» para no desbordar. */
function contarSoluciones(W, tope, cap) {
  const porIni = []; for (let i = 0; i < 12; i++) porIni.push([]);
  for (const w of W) porIni[w.ini].push(w);
  const N = 4096 * 12;
  let cur = new Float64Array(N), sig = new Float64Array(N);
  let total = 0;
  const activos = [];
  for (const w of W) { const s = w.rm * 12 + w.fin; if (!cur[s]) activos.push(s); cur[s] += w.mult; }
  let lista = activos;
  for (let d = 1; d <= tope; d++) {
    for (const s of lista) if (((s / 12) | 0) === FULL) total += cur[s];
    if (total > cap) return cap;
    if (d === tope) break;
    sig.fill(0);
    const nuevos = [];
    for (const s of lista) {
      const v = cur[s]; if (!v) continue;
      const mk = (s / 12) | 0, lt = s % 12;
      if (mk === FULL) continue;                 // ya resuelto: no se sigue
      for (const w of porIni[lt]) {
        const ns = (mk | w.rm) * 12 + w.fin;
        if (!sig[ns]) nuevos.push(ns);
        sig[ns] += v * w.mult;
        if (sig[ns] > cap) sig[ns] = cap;
      }
    }
    const t = cur; cur = sig; sig = t;
    lista = nuevos;
  }
  return Math.min(total, cap);
}

/* ── Generador ───────────────────────────────────────────────────────── */
/* Reparte las 12 letras en 4 lados de 3 de forma que ninguna pareja «choca»
   (letras seguidas en alguna palabra de la solución sembrada) caiga en el
   mismo lado. Vuelta atrás con los lados vacíos considerados uno solo. */
function repartir(letras, conf, rng) {
  const orden = letras.slice().sort((a, b) => (conf.get(b) ? conf.get(b).size : 0) - (conf.get(a) ? conf.get(a).size : 0));
  const lados = [[], [], [], []];
  let nodos = 0;
  const rec = (i) => {
    if (i === 12) return true;
    if (++nodos > 40000) return false;
    const L = orden[i], cf = conf.get(L);
    let vacioUsado = false;
    for (const s of barajar([0, 1, 2, 3], rng)) {
      if (lados[s].length >= 3) continue;
      if (lados[s].length === 0) { if (vacioUsado) continue; vacioUsado = true; }
      let choca = false;
      if (cf) for (const x of lados[s]) if (cf.has(x)) { choca = true; break; }
      if (choca) continue;
      lados[s].push(L);
      if (rec(i + 1)) return true;
      lados[s].pop();
    }
    return false;
  };
  return rec(0) ? lados : null;
}

function conflictosDe(palabras) {
  const conf = new Map();
  for (const p of palabras) {
    for (let i = 1; i < p.c.length; i++) {
      const a = p.c[i - 1], b = p.c[i];
      if (!conf.has(a)) conf.set(a, new Set());
      if (!conf.has(b)) conf.set(b, new Set());
      conf.get(a).add(b); conf.get(b).add(a);
    }
  }
  return conf;
}

/* Cadena de k palabras encadenadas cuya unión son exactamente 12 letras. */
function cadena(k, rng, topeSemilla) {
  const semillas = SEMILLAS(topeSemilla);
  for (let t = 0; t < 60; t++) {
    const w1 = semillas[Math.floor(rng() * semillas.length)];
    if (k === 2) {
      const cand = [];
      for (const w2 of PORINI[w1.fin]) if (w2 !== w1 && pop(w1.m | w2.m) === 12) cand.push(w2);
      if (cand.length) return [w1, cand[Math.floor(rng() * cand.length)]];
    } else {
      const medias = [];
      for (const w2 of PORINI[w1.fin]) { const u = pop(w1.m | w2.m); if (w2 !== w1 && u >= 8 && u <= 11) medias.push(w2); }
      if (!medias.length) continue;
      for (let j = 0; j < 8; j++) {
        const w2 = medias[Math.floor(rng() * medias.length)];
        const cand = [];
        for (const w3 of PORINI[w2.fin]) if (w3 !== w1 && w3 !== w2 && pop(w1.m | w2.m | w3.m) === 12) cand.push(w3);
        if (cand.length) return [w1, w2, cand[Math.floor(rng() * cand.length)]];
      }
    }
  }
  return null;
}

const CACHE_SEM = new Map();
function SEMILLAS(tope) {
  if (CACHE_SEM.has(tope)) return CACHE_SEM.get(tope);
  const out = PAL.filter((p) => p.rank < tope && p.c.length >= 4 && p.c.length <= 10 && pop(p.m) >= 5);
  CACHE_SEM.set(tope, out);
  return out;
}

/* Niveles: el reto es el LÍMITE de palabras; lo que cambia entre niveles es
   cuánto margen deja ese límite sobre el mínimo real del cuadrado y con qué
   vocabulario se llega. «comun» exige que exista solución dentro de «comunLim»
   palabras usando SOLO el banco curado hasta ese rango, para que el nivel
   fácil se resuelva con palabras de andar por casa. «minSol» es el número
   mínimo de soluciones distintas que se le exige al cuadrado. */
const CFG = {
  facil:   { limite: 5, min: 2, semilla: 2500, comun: 2500, comunLim: 3, minSol: 40 },
  normal:  { limite: 4, min: 3, semilla: 4000, comun: 4000, comunLim: 4, minSol: 20 },
  dificil: { limite: 3, min: 3, semilla: 6000, comun: 7802, comunLim: 3, minSol: 20 },
  experto: { limite: 2, min: 2, semilla: 7802, comun: 7802, comunLim: 2, minSol: 6 },
};
/* El diario es el mismo para todos: como Normal, pero con vocabulario más de
   diario y más caminos abiertos. */
const DIARIO = { limite: 4, min: 3, semilla: 3000, comun: 3000, comunLim: 4, minSol: 40 };

/* Genera un cuadrado que CUMPLE el nivel: mínimo exacto = c.min, solución de
   ejemplo sin repetir palabra y dentro del límite, y —si el nivel lo pide—
   solución alcanzable con el banco común. Devuelve null si no lo consigue. */
function generar(cfg, rng, intentos) {
  prepararVocabulario();
  const max = intentos || 400;
  for (let t = 1; t <= max; t++) {
    const ch = cadena(cfg.min, rng, cfg.semilla);
    if (!ch) continue;
    let mask = 0; for (const p of ch) mask |= p.m;
    const letras = []; for (let c = 0; c < 27; c++) if (mask & (1 << c)) letras.push(c);
    if (letras.length !== 12) continue;
    const grupos = repartir(letras, conflictosDe(ch), rng);
    if (!grupos) continue;
    const cu = armarCuadrado(grupos, rng);
    const W = palabrasDelCuadrado(cu);
    const sol = resolver(W, cfg.min);
    if (!sol || sol.length !== cfg.min) continue;          // el mínimo tiene que ser el pedido
    const ns = new Set(sol.map((x) => x.p.n));
    if (ns.size !== sol.length) continue;                  // la solución de ejemplo no repite palabra
    if (cfg.comun) {
      const Wc = palabrasDelCuadrado(cu, (p) => p.rank < cfg.comun);
      const sc = resolver(Wc, cfg.comunLim);
      if (!sc) continue;
      cu.solComun = sc.map((x) => x.p);
    }
    if (cfg.minSol > 1 && contarSoluciones(W, cfg.limite, cfg.minSol) < cfg.minSol) continue;
    cu.sol = sol.map((x) => x.p);
    cu.min = sol.length;
    cu.nPal = W.totales;
    cu.intentos = t;
    return cu;
  }
  return null;
}
/* ==FINGEN== */

/* ══ PANTALLA ═════════════════════════════════════════════════════════ */

const NIV = ['facil', 'normal', 'dificil', 'experto'];

const S = {
  modo: store.get('cuadrado.modo', 'diaria'),
  nivel: store.get('cuadrado.nivel', 'facil'),
  cu: null, limite: 0,
  palabras: [],        // [{ n, w, ruta: [posiciones] }]
  draft: [],           // posiciones de la palabra en formación
  usadas: 0,           // máscara de 12 bits de letras ya gastadas
  fin: false, gano: false, rendido: false, diaHecho: false,
  tmMsg: null, tmFin: null,
};

const REGLAS = `<p>Doce letras, <b>tres en cada lado</b>. Forma palabras tocando letras: <b>dos seguidas nunca del mismo lado</b>, por eso las de ese lado se apagan. Cada palabra nueva <b>empieza por la última de la anterior</b>, que ya viene puesta.</p>
<p>Ganas cuando has usado las <b>doce</b> letras, dentro del límite del nivel: Fácil 5 palabras, Normal 4, Difícil 3, Experto 2. Todos los cuadrados tienen solución dentro de su límite —el juego la busca antes de dártelo y te la enseña si te rindes— y arriba ves el <b>mínimo</b> de ese cuadrado.</p>
<p>Valen las palabras de la lista del juego (banco curado más plurales y conjugaciones), de <b>3 letras o más</b>, sin tildes y sin repetir; la <b>ñ</b> es letra propia. Es la misma lista con la que se arma el reto.</p>
<p>Tu marca es en <b>cuántas palabras</b> lo resolviste: menos es mejor. En <b>Diario</b> el cuadrado es el mismo para todos y cada día resuelto alarga la racha.</p>`;

/* ── Fecha y diario ──────────────────────────────────────────────────── */
const fecha = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const hoy = () => fecha(new Date());
const ayer = () => { const d = new Date(); d.setDate(d.getDate() - 1); return fecha(d); };
function semillaDia(s) {
  let h = 2166136261;
  for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function cargarDiaria() {
  const d = store.get('cua.diaria', null);
  if (d && d.date === hoy()) return d;
  return { date: hoy(), palabras: [], hecho: false, gano: false, n: 0 };
}
/* Conserva lo mejor del día: si ya se resolvió, un reintento peor no lo borra. */
function guardarDiaria() {
  if (S.modo !== 'diaria' || !S.cu) return;
  const prev = cargarDiaria();
  const yaGanado = !!(prev.hecho && prev.gano);
  const gano = S.gano || yaGanado;
  let n = S.palabras.length;
  if (yaGanado) n = S.gano ? Math.min(prev.n, S.palabras.length) : prev.n;
  store.set('cua.diaria', {
    date: hoy(), letras: letrasDe(S.cu).join(''),
    palabras: S.palabras.map((p) => p.n), hecho: S.fin || yaGanado, gano: gano, n: n,
  });
}
function rachaViva() {
  const r = store.get('cua.racha', { n: 0, last: '', pal: 0 });
  return (r.last === hoy() || r.last === ayer()) ? r : { n: 0, last: '', pal: 0 };
}
function registrarDia(nPal) {
  const r = store.get('cua.racha', { n: 0, last: '', pal: 0 });
  if (r.last === hoy()) return r.n;
  r.n = (r.last === ayer()) ? r.n + 1 : 1;
  r.last = hoy(); r.pal = nPal;
  store.set('cua.racha', r);
  if (r.n > store.get('cua.mejorRacha', 0)) store.set('cua.mejorRacha', r.n);
  return r.n;
}
/* Al hub va la marca del nivel más alto resuelto; si solo se ha jugado el
   diario, la racha. */
function actualizarHub() {
  for (let i = NIV.length - 1; i >= 0; i--) {
    const b = store.get('cua.best.' + NIV[i], 0);
    if (b) { store.set('cua.hub', `${b} palabra${b === 1 ? '' : 's'} · ${DIFF_LABEL[NIV[i]]}`); return; }
  }
  const r = rachaViva();
  if (r.n > 0) store.set('cua.hub', `Racha diaria: ${r.n}`);
}

/* ── Geometría del cuadrado ──────────────────────────────────────────── */
/* El cuadrado va de 16 a 84 del lienzo de 100; las tres letras de cada lado
   se separan de las esquinas para que los cuatro bloques se lean sueltos. */
const A = 16, B = 84, T = [30.96, 50, 69.04];
const PUNTOS = [];
for (const x of T) PUNTOS.push([x, A]);
for (const y of T) PUNTOS.push([B, y]);
for (const x of T) PUNTOS.push([x, B]);
for (const y of T) PUNTOS.push([A, y]);

/* ── Pantalla de inicio ──────────────────────────────────────────────── */
function pararTemporizadores() {
  clearTimeout(S.tmMsg); clearTimeout(S.tmFin);
  S.tmMsg = S.tmFin = null;
}

const textoJugar = (dd) => dd.hecho ? 'Repetir el de hoy' : (dd.palabras.length ? 'Seguir con el de hoy' : 'Jugar');

function renderSetup() {
  pararTemporizadores();
  S.cu = null;
  const bests = NIV.map((d) => {
    const b = store.get('cua.best.' + d, 0);
    return `<div class="b"><div class="bn">${b || '—'}</div><div class="bl">${DIFF_LABEL[d]}</div></div>`;
  }).join('');
  const dd = cargarDiaria();
  const r = rachaViva();
  const hoyTxt = dd.hecho
    ? (dd.gano ? `Hoy: resuelto en <b>${dd.n}</b> palabra${dd.n === 1 ? '' : 's'}` : 'Hoy: terminado sin resolver')
    : (dd.palabras.length ? `Hoy: <b>${dd.palabras.length}</b> palabra${dd.palabras.length === 1 ? '' : 's'} puestas` : 'Hoy aún no has empezado');
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Cuadrado de letras', '')}
    <div class="g-setup scroll">
      <div class="card" style="padding: 14px 18px 18px;">
        <div class="row" style="border:none; padding-bottom: 8px;"><div class="row-title">Modo</div><div class="row-hint" id="m-hint"></div></div>
        <div class="seg" id="seg-m">
          <button data-v="diaria" class="${S.modo === 'diaria' ? 'sel' : ''}">Diario</button>
          <button data-v="libre" class="${S.modo === 'libre' ? 'sel' : ''}">Libre</button>
        </div>
        <div id="bloque-d" ${S.modo === 'libre' ? '' : 'hidden'}>
          <div class="row" style="border:none; padding-bottom: 8px;"><div class="row-title">Dificultad</div><div class="row-hint" id="d-hint"></div></div>
          ${diffSegHTML('seg-d', S.nivel)}
        </div>
        <div id="bloque-h" class="cua-hoy" style="padding-top: 12px;" ${S.modo === 'diaria' ? '' : 'hidden'}>
          ${hoyTxt}<br>Racha: <b>${r.n}</b> · Mejor racha: <b>${store.get('cua.mejorRacha', 0)}</b>
        </div>
      </div>
      <div class="label-sm" style="margin-top:4px;">Palabras que te bastaron (menos es mejor)</div>
      <div class="bests">${bests}</div>
      <button class="btn btn-primary" style="margin-top:8px;" id="new">${textoJugar(dd)}</button>
      <button class="howto" id="howto">¿Cómo se juega?</button>
    </div>
  </div>`;
  const hint = () => {
    if ($('#m-hint')) $('#m-hint').textContent = S.modo === 'diaria' ? 'El mismo para todos' : 'Uno nuevo cada vez';
    if ($('#d-hint')) $('#d-hint').textContent = `Límite ${CFG[S.nivel].limite} palabras`;
  };
  hint();
  bindSeg('seg-m', (v) => {
    S.modo = v; store.set('cuadrado.modo', v);
    $('#bloque-d').hidden = v !== 'libre';
    $('#bloque-h').hidden = v !== 'diaria';
    $('#new').textContent = v === 'diaria' ? textoJugar(dd) : 'Jugar';
    hint();
  });
  bindSeg('seg-d', (v) => { S.nivel = v; store.set('cuadrado.nivel', v); hint(); });
  $('#new').onclick = () => empezar();
  bindHowto(REGLAS);
}

/* ── Partida ─────────────────────────────────────────────────────────── */
function empezar(reiniciar) {
  pararTemporizadores();
  S.palabras = []; S.draft = []; S.usadas = 0;
  S.fin = false; S.gano = false; S.rendido = false; S.diaHecho = false;
  if (S.modo === 'diaria') {
    S.cu = generar(DIARIO, mulberry32(semillaDia(hoy())), 3000);
    S.limite = DIARIO.limite;
    const d = cargarDiaria();
    if (S.cu && !reiniciar && d.letras === letrasDe(S.cu).join('') && !d.hecho) rehacer(d.palabras);
  } else {
    S.cu = generar(CFG[S.nivel], Math.random, 800);
    S.limite = CFG[S.nivel].limite;
  }
  if (!S.cu) { renderSetup(); return; }
  renderPlay();
  if (reiniciar) guardarDiaria();
}

/* Rehace una partida guardada palabra a palabra (el estado del diario solo
   guarda las palabras, no el trazo). */
function rehacer(lista) {
  for (const n of lista) {
    const p = MAPA.get(n);
    if (!p) continue;
    const ruta = rutaDe(p);
    if (!ruta) continue;
    if (S.palabras.length && ruta[0] !== S.palabras[S.palabras.length - 1].ruta.slice(-1)[0]) continue;
    S.palabras.push({ n: p.n, w: p.w, ruta: ruta });
    for (const i of ruta) S.usadas |= 1 << i;
  }
  const ult = S.palabras[S.palabras.length - 1];
  S.draft = ult ? [ult.ruta[ult.ruta.length - 1]] : [];
}

/* Posiciones que recorre una palabra en este cuadrado, o null si no es legal. */
function rutaDe(p) {
  const ruta = [];
  let ant = -1;
  for (let k = 0; k < p.c.length; k++) {
    const c = p.c[k];
    if (!(S.cu.mask & (1 << c))) return null;
    const l = S.cu.lado[c];
    if (l === ant) return null;
    ant = l;
    ruta.push(S.cu.pos[c]);
  }
  return ruta;
}

function renderPlay() {
  const letras = letrasDe(S.cu);
  const fichas = PUNTOS.map((pt, i) =>
    `<g class="cua-pt" data-i="${i}"><circle class="cua-hit" cx="${pt[0]}" cy="${pt[1]}" r="9.5"></circle>` +
    `<circle class="cua-mota" cx="${pt[0]}" cy="${pt[1]}" r="8"></circle>` +
    `<text x="${pt[0]}" y="${pt[1]}">${letras[i]}</text></g>`).join('');
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Cuadrado de letras', `<span class="chip">${S.modo === 'diaria' ? 'Diario' : DIFF_LABEL[S.nivel]}</span>`)}
    <div class="scroll cua-zona">
      <div class="cua-marca">
        <span>Palabras <b id="c-n">0/${S.limite}</b></span>
        <span id="c-falta-w">Faltan <b id="c-falta">12</b> letras</span>
      </div>
      <div class="cua-pie" id="c-pie"></div>
      <div class="cua-hechas" id="c-hechas"></div>
      <div class="cua-caja">
        <svg class="cua-cuadro" id="cua-svg" viewBox="0 0 100 100" aria-label="Cuadrado de letras">
          <rect class="cua-marco" x="${A}" y="${A}" width="${B - A}" height="${B - A}" rx="9"></rect>
          <rect class="cua-lado" x="22" y="${A - 8}" width="56" height="16" rx="8"></rect>
          <rect class="cua-lado" x="${B - 8}" y="22" width="16" height="56" rx="8"></rect>
          <rect class="cua-lado" x="22" y="${B - 8}" width="56" height="16" rx="8"></rect>
          <rect class="cua-lado" x="${A - 8}" y="22" width="16" height="56" rx="8"></rect>
          <g id="c-trazos"></g>
          <g id="c-fichas">${fichas}</g>
        </svg>
      </div>
      <div class="cua-entrada" id="c-entrada"></div>
      <div class="msg" id="c-msg"></div>
      <div class="cua-acciones">
        <button class="btn btn-sm" id="b-deshacer">Deshacer</button>
        <button class="btn btn-sm" id="b-borrar">Borrar</button>
        <button class="btn btn-primary btn-sm" id="b-enviar">Enviar</button>
      </div>
    </div>
    <div class="cua-tools">
      <button id="t-ver">Ver solución</button>
      <button id="t-nueva">${S.modo === 'diaria' ? 'Reiniciar' : 'Otro cuadrado'}</button>
      <button id="t-salir">Salir</button>
    </div>
  </div>`;
  $('#cua-svg').addEventListener('click', (e) => {
    const g = e.target.closest ? e.target.closest('.cua-pt') : null;
    if (g) tocar(Number(g.dataset.i));
  });
  $('#b-deshacer').onclick = deshacer;
  $('#b-borrar').onclick = borrar;
  $('#b-enviar').onclick = enviar;
  $('#t-ver').onclick = rendirse;
  // En diario «Reiniciar» vuelve a empezar el MISMO cuadrado desde cero, así
  // que hay que decirle que no rehaga las palabras guardadas.
  $('#t-nueva').onclick = () => { pararTemporizadores(); empezar(S.modo === 'diaria'); };
  $('#t-salir').onclick = () => { pararTemporizadores(); renderSetup(); };
  pintar();
}

/* ── Pintado ─────────────────────────────────────────────────────────── */
function pintar() {
  if (!$('#cua-svg')) return;
  const falta = 12 - pop(S.usadas);
  $('#c-n').textContent = `${S.palabras.length}/${S.limite}`;
  $('#c-falta').textContent = falta;
  $('#c-falta-w').classList.toggle('apura', falta > 0 && S.palabras.length >= S.limite - 1);
  $('#c-pie').textContent = S.fin
    ? (S.gano ? '¡Las doce letras!' : 'Se acabaron las palabras')
    : `Se puede resolver en ${S.cu.min} palabra${S.cu.min === 1 ? '' : 's'}`;
  pintarHechas();
  pintarTrazos();
  pintarFichas();
  pintarEntrada();
  const sinPalabras = S.fin;
  $('#b-deshacer').disabled = sinPalabras || !S.palabras.length;
  $('#b-borrar').disabled = sinPalabras || S.draft.length <= (S.palabras.length ? 1 : 0);
  $('#b-enviar').disabled = sinPalabras;
}

function pintarHechas() {
  const el = $('#c-hechas');
  if (!el) return;
  el.innerHTML = S.palabras.length
    ? S.palabras.map((p) => `<span class="cua-h">${esc(p.w)}</span>`).join('')
    : '<span class="cua-h vacio">Aún no has puesto ninguna</span>';
}

function pintarTrazos() {
  const g = $('#c-trazos');
  if (!g) return;
  const linea = (ruta, viva) => {
    if (ruta.length < 2) return '';
    const d = ruta.map((i, k) => `${k ? 'L' : 'M'}${PUNTOS[i][0]} ${PUNTOS[i][1]}`).join(' ');
    return `<path class="cua-traza${viva ? ' viva' : ''}" d="${d}"></path>`;
  };
  g.innerHTML = S.palabras.map((p) => linea(p.ruta, false)).join('') + linea(S.draft, true);
}

function pintarFichas() {
  const enDraft = new Set(S.draft);
  const ultimo = S.draft.length ? S.draft[S.draft.length - 1] : -1;
  const ladoVeto = ultimo >= 0 ? (ultimo / 3) | 0 : -1;
  $$('#c-fichas .cua-pt').forEach((g) => {
    const i = Number(g.dataset.i);
    g.classList.toggle('viva', enDraft.has(i));
    g.classList.toggle('hecha', !!(S.usadas & (1 << i)));
    g.classList.toggle('apagada', !S.fin && ladoVeto >= 0 && ((i / 3) | 0) === ladoVeto && !enDraft.has(i));
  });
}

function pintarEntrada() {
  const el = $('#c-entrada');
  if (!el) return;
  const letras = letrasDe(S.cu);
  const fija = S.palabras.length ? 1 : 0;
  el.innerHTML = S.draft.map((i, k) => `<span class="${k < fija ? 'cua-fija' : ''}">${letras[i]}</span>`).join('')
    + (S.fin ? '' : '<span class="cua-caret"></span>');
}

function aviso(texto, tipo) {
  const m = $('#c-msg');
  if (!m) return;
  clearTimeout(S.tmMsg);
  m.textContent = texto; m.className = 'msg ' + (tipo || '');
  S.tmMsg = setTimeout(() => { const e = $('#c-msg'); if (e && e.textContent === texto) { e.textContent = ''; e.className = 'msg'; } }, 1800);
}
function sacudir() {
  const el = $('#c-entrada');
  if (!el) return;
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  vibrate(40);
}

/* ── Jugadas ─────────────────────────────────────────────────────────── */
function tocar(i) {
  if (S.fin || !S.cu) return;
  const ultimo = S.draft.length ? S.draft[S.draft.length - 1] : -1;
  if (ultimo >= 0 && ((i / 3) | 0) === ((ultimo / 3) | 0)) {
    aviso('Dos letras seguidas del mismo lado, no', 'err'); sacudir(); return;
  }
  if (S.draft.length >= 18) return;
  S.draft.push(i);
  vibrate(6);
  pintar();
}
function borrar() {
  const fija = S.palabras.length ? 1 : 0;
  if (S.fin || S.draft.length <= fija) return;
  S.draft.pop();
  pintar();
}
function deshacer() {
  if (S.fin || !S.palabras.length) return;
  S.palabras.pop();
  S.usadas = 0;
  for (const p of S.palabras) for (const i of p.ruta) S.usadas |= 1 << i;
  const ult = S.palabras[S.palabras.length - 1];
  S.draft = ult ? [ult.ruta[ult.ruta.length - 1]] : [];
  guardarDiaria();
  pintar();
  aviso('Palabra quitada', 'check');
}

function enviar() {
  if (S.fin || !S.cu) return;
  if (S.draft.length < 3) { aviso('Muy corta: mínimo 3 letras', 'err'); sacudir(); return; }
  const letras = letrasDe(S.cu);
  const n = S.draft.map((i) => letras[i]).join('');
  if (S.palabras.some((p) => p.n === n)) { aviso('Ya la usaste', 'err'); sacudir(); return; }
  const p = MAPA.get(n);
  if (!p) { aviso('No está en la lista', 'err'); sacudir(); return; }
  const ruta = S.draft.slice();
  const antes = pop(S.usadas);
  S.palabras.push({ n: n, w: p.w, ruta: ruta });
  for (const i of ruta) S.usadas |= 1 << i;
  S.draft = [ruta[ruta.length - 1]];
  vibrate(12);
  const falta = 12 - pop(S.usadas);
  if (falta === 0) { ganar(); return; }
  if (S.palabras.length >= S.limite) { perder(); return; }
  const nuevas = pop(S.usadas) - antes;
  const quedan = S.limite - S.palabras.length;
  aviso(quedan === 1 ? 'Última palabra' : `+${nuevas} letra${nuevas === 1 ? '' : 's'}`, quedan === 1 ? 'err' : 'ok');
  guardarDiaria();
  pintar();
}

/* ── Final ───────────────────────────────────────────────────────────── */
function ganar() {
  S.fin = true; S.gano = true; S.draft = [];
  const n = S.palabras.length;
  let record = false, racha = 0;
  if (S.modo === 'libre') {
    const k = 'cua.best.' + S.nivel;
    const b = store.get(k, 0);
    if (!b || n < b) { store.set(k, n); record = true; }
    actualizarHub();
  } else {
    racha = registrarDia(n);
    guardarDiaria();
    actualizarHub();
  }
  pintar();
  confetti(); vibrate([30, 60, 30]);
  S.tmFin = setTimeout(() => {
    if (!$('#cua-svg')) return;
    const mejor = S.modo === 'libre' ? store.get('cua.best.' + S.nivel, n) : 0;
    openModal(`
      <h3>${record ? '¡Récord!' : n === S.cu.min ? '¡Mínimo clavado!' : '¡Las doce letras!'}</h3>
      <div class="stats" style="margin:14px 0;">
        <div class="stat"><div class="n">${n}</div><div class="l">palabras</div></div>
        <div class="stat"><div class="n">${S.cu.min}</div><div class="l">mínimo</div></div>
        <div class="stat"><div class="n">${S.modo === 'libre' ? mejor : racha}</div><div class="l">${S.modo === 'libre' ? 'tu mejor' : 'racha'}</div></div>
      </div>
      <p class="cua-sol">${S.palabras.map((p) => `<b>${esc(p.w)}</b>`).join(' → ')}</p>
      ${S.modo === 'diaria' ? '<p style="text-align:center;">Mañana hay cuadrado nuevo.</p>' : ''}
      <div class="m-actions">
        <button class="btn btn-primary" id="m-again">${S.modo === 'diaria' ? 'Jugar en libre' : 'Otro cuadrado'}</button>
        <button class="btn btn-ghost" id="m-out">Salir</button>
      </div>
    `, closeModal);
    $('#m-again').onclick = () => {
      closeModal();
      if (S.modo === 'diaria') { S.modo = 'libre'; store.set('cuadrado.modo', 'libre'); }
      empezar();
    };
    $('#m-out').onclick = () => { closeModal(); renderSetup(); };
  }, 620);
}

function perder() {
  S.fin = true; S.gano = false; S.draft = [];
  guardarDiaria();
  pintar();
  vibrate([60, 40, 60]);
  S.tmFin = setTimeout(() => modalSolucion('Se acabaron las palabras',
    `Gastaste las ${S.limite} y aún faltaban ${12 - pop(S.usadas)} letras.`), 420);
}

function rendirse() {
  if (S.fin) { modalSolucion('La solución', ''); return; }
  S.fin = true; S.gano = false; S.rendido = true;
  guardarDiaria();
  pintar();
  modalSolucion('La solución', '');
}

function modalSolucion(titulo, texto) {
  if (!$('#cua-svg')) return;
  const sol = (S.cu.solComun && S.cu.solComun.length <= S.limite) ? S.cu.solComun : S.cu.sol;
  openModal(`
    <h3>${esc(titulo)}</h3>
    ${texto ? `<p style="text-align:center;">${esc(texto)}</p>` : ''}
    <p class="cua-sol">${sol.map((p) => `<b>${esc(p.w)}</b>`).join(' → ')}</p>
    <p style="text-align:center;">${sol.length} palabra${sol.length === 1 ? '' : 's'}; el mínimo de este cuadrado es ${S.cu.min}.</p>
    <div class="m-actions">
      <button class="btn btn-primary" id="m-again">${S.modo === 'diaria' ? 'Jugar en libre' : 'Otro cuadrado'}</button>
      <button class="btn btn-ghost" id="m-out">Salir</button>
    </div>
  `, closeModal);
  $('#m-again').onclick = () => {
    closeModal();
    if (S.modo === 'diaria') { S.modo = 'libre'; store.set('cuadrado.modo', 'libre'); }
    empezar();
  };
  $('#m-out').onclick = () => { closeModal(); renderSetup(); };
}

/* ── Teclado físico ──────────────────────────────────────────────────── */
addEventListener('keydown', (e) => {
  if (!S.cu || !$('#cua-svg') || $('#modal').classList.contains('open')) return;
  const k = e.key.toLowerCase();
  if (k === 'backspace') { borrar(); e.preventDefault(); return; }
  if (k === 'enter') { enviar(); return; }
  if (k.length !== 1 || !/^[a-zñ]$/.test(k)) return;
  const letras = letrasDe(S.cu);
  const ultimo = S.draft.length ? S.draft[S.draft.length - 1] : -1;
  const veto = ultimo >= 0 ? (ultimo / 3) | 0 : -1;
  let i = -1;
  for (let j = 0; j < 12; j++) if (letras[j] === k && ((j / 3) | 0) !== veto) { i = j; break; }
  if (i < 0) {
    if (letras.indexOf(k) < 0) aviso('Esa letra no está en el cuadrado', 'err');
    else aviso('Dos letras seguidas del mismo lado, no', 'err');
    sacudir();
    return;
  }
  tocar(i);
});

renderSetup();
</script>
