<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FBF6ED" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="description" content="Buscaminas clásico: despeja el tablero sin pisar ninguna." />
<title>Buscaminas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C0603A'/%3E%3Crect x='13' y='9' width='38' height='44' rx='6' fill='%23FBF6ED'/%3E%3Ctext x='32' y='42' font-size='28' font-family='Arial,Helvetica,sans-serif' font-weight='700' fill='%2333302B' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E" />
<link rel="manifest" href="../../manifest.webmanifest" />
<link rel="apple-touch-icon" href="../../icons/icon-180.png" />
<link rel="stylesheet" href="../../comun/estilo.css" />
<style>
  .boardwrap { display: flex; justify-content: center; padding: 8px 10px 4px; }
  .board {
    display: grid; gap: 2px; background: var(--border); padding: 3px; border-radius: 12px;
    box-shadow: var(--shadow); touch-action: manipulation; user-select: none; -webkit-user-select: none; border: 1px solid var(--linea-fuerte); }
  .mc {
    display: flex; align-items: center; justify-content: center; border-radius: 12px;
    font-weight: 700; cursor: pointer; position: relative;
    background: var(--card); box-shadow:;
  }
  .mc.open { background: var(--soft); box-shadow: none; cursor: default; }
  .mc.boom { background: var(--bad); }
  .mc.mine-show { background: var(--bad-soft); }
  .mc svg { display: block; }
  .n1 { color: var(--second); } .n2 { color: var(--good); } .n3 { color: var(--bad); }
  .n4 { color: #6A5AD0; } .n5 { color: var(--second); } .n6 { color: #1F7F8A; }
  .n7 { color: var(--ink); } .n8 { color: var(--sub); }
  .statusrow { display: flex; justify-content: center; gap: 20px; font-size: 13.5px; font-weight: 600; color: var(--sub); padding: 8px 0 0; }
  .statusrow b { color: var(--ink); }
  .tools { margin: 10px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; }
  .tool {
    border: var(--trazo) solid var(--linea-fuerte); cursor: pointer; font-family: var(--title-font); font-weight: 600; font-size: 13px; padding: 10px 17px; border-radius: var(--pastilla); background: var(--card); color: var(--ink); box-shadow: var(--shadow-sutil); display: flex; align-items: center; gap: 7px;
  }
  .tool:active { opacity: .6; }
  .tool.on { background: var(--second); color: #fff; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>

<script src="../../comun/nucleo.js"></script>
<script>
'use strict';

const CFG = {
  facil:   { w: 8,  h: 8,  mines: 9 },
  normal:  { w: 10, h: 10, mines: 16 },
  dificil: { w: 12, h: 12, mines: 26 },
  experto: { w: 13, h: 15, mines: 40 },
};

const FLAG = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4"></path><path d="M6 4h11l-2.6 3.5L17 11H6"></path></svg>';
const MINE = '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="5.5"></circle><path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2" fill="none"></path></svg>';

const S = {
  diff: store.get('mina.diff', 'normal'),
  w: 0, h: 0, mines: 0,
  vec: [], mine: [], open: [], flag: [], adj: [],
  started: false, done: false, flagMode: false, openCount: 0, flagCount: 0,
  press: null,
};
const clock = makeClock(() => $('#clock'));

const REGLAS = `<p>Despeja todas las casillas que no esconden mina. Cada número te dice <b>cuántas minas hay pegadas</b> a esa casilla (incluidas las diagonales).</p>
<p><b>Toca</b> para abrir una casilla; <b>mantén presionado</b> —o activa el modo <b>Bandera</b>— para marcar donde crees que hay mina. El primer toque nunca explota.</p>
<p>Si abres una mina, boom: fin de la partida. Abre todo lo seguro y ganas; tu mejor tiempo queda guardado.</p>
<p>Los tableros se reparten de modo que <b>siempre se puedan terminar razonando</b>: nunca hace falta adivinar a ver qué pasa.</p>`;

function renderSetup() {
  clock.stop();
  const bests = ['facil', 'normal', 'dificil', 'experto'].map((d) => {
    const b = store.get('mina.best.' + d, null);
    return `<div class="b"><div class="bn">${b ? fmtTime(b) : '—'}</div><div class="bl">${DIFF_LABEL[d]}</div></div>`;
  }).join('');
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Buscaminas', '')}
    <div class="g-setup scroll">
      <div class="card" style="padding: 14px 18px 18px;">
        <div class="row" style="border:none; padding-bottom: 8px;"><div class="row-title">Dificultad</div></div>
        ${diffSegHTML('seg-d', S.diff)}
        <div class="row-hint" style="padding: 10px 2px 6px;" id="d-hint"></div>
      </div>
      <div class="label-sm" style="margin-top:4px;">Mejores tiempos</div>
      <div class="bests">${bests}</div>
      <button class="btn btn-primary" style="margin-top:8px;" id="new">Jugar</button>
      <div class="row-hint" style="text-align:center;">Toque: abrir · Toque largo o modo bandera: marcar</div>
      <button class="howto" id="howto">¿Cómo se juega?</button>
    </div>
  </div>`;
  const hint = () => {
    const c = CFG[S.diff];
    $('#d-hint').textContent = `Tablero ${c.w}×${c.h} · ${c.mines} minas`;
  };
  bindSeg('seg-d', (v) => { S.diff = v; store.set('mina.diff', v); hint(); });
  hint();
  $('#new').onclick = startGame;
  bindHowto(REGLAS);
}

function idx(r, c) { return r * S.w + c; }
function calcVecinos(w, h) {
  const v = [];
  for (let i = 0; i < w * h; i++) {
    const r = Math.floor(i / w), c = i % w, out = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < h && nc >= 0 && nc < w) out.push(nr * w + nc);
    }
    v.push(out);
  }
  return v;
}
function neighbors(i) { return S.vec[i]; }

function startGame() {
  const c = CFG[S.diff];
  S.w = c.w; S.h = c.h; S.mines = c.mines;
  const n = S.w * S.h;
  S.vec = calcVecinos(S.w, S.h);
  S.mine = new Array(n).fill(false);
  S.open = new Array(n).fill(false);
  S.flag = new Array(n).fill(false);
  S.adj = new Array(n).fill(0);
  S.started = false; S.done = false; S.flagMode = false;
  S.openCount = 0; S.flagCount = 0;
  renderPlay();
  clock.start();
}

/* ── Resolutor lógico: ¿la partida se termina sin adivinar? ──────────────
   Usa las tres herramientas de un jugador humano: la cuenta de cada número,
   la enumeración de las combinaciones posibles en la frontera, y el total de
   minas que quedan. Solo deduce lo forzado: nunca adivina. */
function enumeraGrupo(celdas, restr, tope) {
  const m = celdas.length;
  const porCelda = celdas.map(() => []);
  restr.forEach((c, ci) => c.vars.forEach((v) => porCelda[v].push(ci)));
  const puestos = restr.map(() => 0), libres = restr.map((c) => c.vars.length);
  const asign = new Uint8Array(m);
  const cuenta = [], nSol = [];
  let soluciones = 0, cortado = false;
  function bt(k, minas) {
    if (cortado) return;
    if (minas > tope) return;
    if (k === m) {
      if (!cuenta[minas]) { cuenta[minas] = new Int32Array(m); nSol[minas] = 0; }
      nSol[minas]++;
      for (let i = 0; i < m; i++) if (asign[i]) cuenta[minas][i]++;
      if (++soluciones > 200000) cortado = true;
      return;
    }
    for (let v = 0; v <= 1; v++) {
      asign[k] = v;
      let ok = true;
      for (const ci of porCelda[k]) {
        puestos[ci] += v; libres[ci]--;
        if (puestos[ci] > restr[ci].req || puestos[ci] + libres[ci] < restr[ci].req) ok = false;
      }
      if (ok) bt(k + 1, minas + v);
      for (const ci of porCelda[k]) { puestos[ci] -= v; libres[ci]++; }
    }
  }
  bt(0, 0);
  return cortado ? null : { cuenta, nSol };
}

function resolubleSinAdivinar(mine, adj, vec, n, minas, primera) {
  const est = new Uint8Array(n);          // 0 tapada · 1 abierta · 2 bandera
  let abiertas = 0, banderas = 0;
  const seguras = n - minas;
  const abrir = (i) => {
    const pila = [i];
    while (pila.length) {
      const k = pila.pop();
      if (est[k]) continue;
      est[k] = 1; abiertas++;
      if (adj[k] === 0) for (const j of vec[k]) if (!est[j]) pila.push(j);
    }
  };
  abrir(primera);
  while (abiertas < seguras) {
    let avance = false;
    // 1) reglas locales de cada número
    for (let i = 0; i < n; i++) {
      if (est[i] !== 1 || !adj[i]) continue;
      let desc = 0, ban = 0;
      for (const j of vec[i]) { if (est[j] === 0) desc++; else if (est[j] === 2) ban++; }
      if (!desc) continue;
      if (adj[i] === ban) { for (const j of vec[i]) if (est[j] === 0) abrir(j); avance = true; }
      else if (adj[i] - ban === desc) { for (const j of vec[i]) if (est[j] === 0) { est[j] = 2; banderas++; } avance = true; }
    }
    if (avance) continue;

    const restantes = minas - banderas;
    const tapadas = [];
    for (let i = 0; i < n; i++) if (est[i] === 0) tapadas.push(i);
    // 2) cuenta global de minas
    if (restantes === 0) { tapadas.forEach(abrir); continue; }
    if (restantes === tapadas.length) { tapadas.forEach((i) => { est[i] = 2; banderas++; }); continue; }

    // 3) frontera: restricciones y grupos independientes
    const enFrontera = new Map();
    const restr = [];
    for (let i = 0; i < n; i++) {
      if (est[i] !== 1 || !adj[i]) continue;
      const vars = [];
      let ban = 0;
      for (const j of vec[i]) { if (est[j] === 0) vars.push(j); else if (est[j] === 2) ban++; }
      if (!vars.length) continue;
      restr.push({ celdas: vars, req: adj[i] - ban });
      vars.forEach((j) => enFrontera.set(j, true));
    }
    if (!restr.length) break;
    // agrupa restricciones conectadas
    const padre = new Map();
    const buscar = (x) => { while (padre.get(x) !== x) { padre.set(x, padre.get(padre.get(x))); x = padre.get(x); } return x; };
    for (const j of enFrontera.keys()) padre.set(j, j);
    for (const c of restr) for (let k = 1; k < c.celdas.length; k++) padre.set(buscar(c.celdas[k]), buscar(c.celdas[0]));
    const grupos = new Map();
    for (const j of enFrontera.keys()) {
      const r = buscar(j);
      if (!grupos.has(r)) grupos.set(r, []);
      grupos.get(r).push(j);
    }
    const fuera = tapadas.length - enFrontera.size;
    const info = [];
    let imposible = false;
    for (const celdas of grupos.values()) {
      if (celdas.length > 26) { imposible = true; break; }
      const pos = new Map(celdas.map((c, k) => [c, k]));
      const rs = restr.filter((c) => pos.has(c.celdas[0])).map((c) => ({ vars: c.celdas.map((x) => pos.get(x)), req: c.req }));
      const e = enumeraGrupo(celdas, rs, Math.min(celdas.length, restantes));
      if (!e) { imposible = true; break; }
      const ks = [];
      for (let k = 0; k < e.nSol.length; k++) if (e.nSol[k]) ks.push(k);
      if (!ks.length) { imposible = true; break; }
      info.push({ celdas, ks, cuenta: e.cuenta, nSol: e.nSol });
    }
    if (imposible) break;

    // combinaciones globales posibles: suma de minas por grupo + las de fuera
    const G = info.length;
    const pre = [new Set([0])];
    for (let g = 0; g < G; g++) {
      const s = new Set();
      for (const a of pre[g]) for (const k of info[g].ks) if (a + k <= restantes) s.add(a + k);
      pre.push(s);
    }
    const post = new Array(G + 1);
    post[G] = new Set([0]);
    for (let g = G - 1; g >= 0; g--) {
      const s = new Set();
      for (const a of post[g + 1]) for (const k of info[g].ks) if (a + k <= restantes) s.add(a + k);
      post[g] = s;
    }
    const validoTotal = (t) => t <= restantes && restantes - t <= fuera;
    for (let g = 0; g < G; g++) {
      info[g].ksOK = info[g].ks.filter((k) => {
        for (const a of pre[g]) for (const b of post[g + 1]) if (validoTotal(a + k + b)) return true;
        return false;
      });
    }
    // ¿alguna celda es mina en todas las combinaciones, o segura en todas?
    for (const gi of info) {
      if (!gi.ksOK.length) { imposible = true; break; }
      for (let c = 0; c < gi.celdas.length; c++) {
        if (est[gi.celdas[c]] !== 0) continue;     // ya se resolvió en esta misma vuelta
        let todas = true, ninguna = true;
        for (const k of gi.ksOK) {
          const v = gi.cuenta[k][c];
          if (v !== gi.nSol[k]) todas = false;
          if (v !== 0) ninguna = false;
        }
        if (todas) { est[gi.celdas[c]] = 2; banderas++; avance = true; }
        else if (ninguna) { abrir(gi.celdas[c]); avance = true; }
      }
    }
    if (imposible) break;
    // las celdas de fuera de la frontera, por descarte
    if (fuera) {
      let minF = Infinity, maxF = -Infinity;
      for (const t of pre[G]) if (validoTotal(t)) { minF = Math.min(minF, restantes - t); maxF = Math.max(maxF, restantes - t); }
      if (maxF === 0) { for (const i of tapadas) if (!enFrontera.has(i) && est[i] === 0) { abrir(i); avance = true; } }
      else if (minF === fuera) { for (const i of tapadas) if (!enFrontera.has(i) && est[i] === 0) { est[i] = 2; banderas++; avance = true; } }
    }
    if (!avance) break;
  }
  return abiertas === seguras;
}

function placeMines(safe) {
  const n = S.mine.length;
  const banned = new Set([safe, ...neighbors(safe)]);
  const spots = [];
  for (let i = 0; i < n; i++) if (!banned.has(i)) spots.push(i);
  const tope = performance.now() + 1400;
  let mine = null, adj = null;
  for (let intento = 0; ; intento++) {
    mine = new Array(n).fill(false);
    for (const i of shuffle(spots.slice()).slice(0, S.mines)) mine[i] = true;
    adj = new Array(n).fill(0);
    for (let i = 0; i < n; i++) adj[i] = S.vec[i].filter((j) => mine[j]).length;
    if (resolubleSinAdivinar(mine, adj, S.vec, n, S.mines, safe)) break;
    if (performance.now() > tope) break;   // se acabó el tiempo: vale el último
  }
  S.mine = mine; S.adj = adj;
  S.started = true;
}

function renderPlay() {
  const cell = Math.min(38, Math.floor((Math.min(402, innerWidth) * .96 - 8 - (S.w - 1) * 2) / S.w));
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Buscaminas', `<span class="chip">${DIFF_LABEL[S.diff]}</span><span class="clock" id="clock">0:00</span>`)}
    <div class="statusrow">
      <span>Minas <b id="minesleft">${S.mines}</b></span>
    </div>
    <div class="scroll">
      <div class="boardwrap">
        <div class="board" id="board" style="grid-template-columns: repeat(${S.w}, ${cell}px); grid-auto-rows: ${cell}px; font-size: ${Math.floor(cell * .5)}px;">
          ${Array.from({ length: S.w * S.h }, (_, i) => `<div class="mc" data-i="${i}"></div>`).join('')}
        </div>
      </div>
    </div>
    <div class="tools">
      <button class="tool" id="t-flag">${FLAG} Bandera</button>
      <button class="tool" id="t-nueva">Nueva</button>
      <button class="tool" id="t-salir">Salir</button>
    </div>
  </div>`;
  const board = $('#board');
  board.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.mc');
    if (!el || S.done) return;
    const i = Number(el.dataset.i);
    S.press = { i, t: Date.now(), fired: false, timer: setTimeout(() => {
      if (S.press && S.press.i === i) { S.press.fired = true; toggleFlag(i); vibrate(30); }
    }, 380) };
  });
  const release = (e) => {
    if (!S.press) return;
    clearTimeout(S.press.timer);
    const el = e.target.closest ? e.target.closest('.mc') : null;
    if (!S.press.fired && el && Number(el.dataset.i) === S.press.i) {
      if (S.flagMode) toggleFlag(S.press.i);
      else reveal(S.press.i);
    }
    S.press = null;
  };
  board.addEventListener('pointerup', release);
  board.addEventListener('pointercancel', () => { if (S.press) clearTimeout(S.press.timer); S.press = null; });
  board.addEventListener('contextmenu', (e) => { e.preventDefault(); });
  $('#t-flag').onclick = () => { S.flagMode = !S.flagMode; $('#t-flag').classList.toggle('on', S.flagMode); };
  $('#t-nueva').onclick = startGame;
  $('#t-salir').onclick = renderSetup;
  paint();
}

function toggleFlag(i) {
  if (!$('#minesleft')) return;  // el jugador ya se fue de la pantalla
  if (S.done || S.open[i]) return;
  S.flag[i] = !S.flag[i];
  S.flagCount += S.flag[i] ? 1 : -1;
  paintCell(i);
  $('#minesleft').textContent = Math.max(0, S.mines - S.flagCount);
}

function reveal(i) {
  if (S.done || S.flag[i] || S.open[i]) return;
  if (!S.started) placeMines(i);
  if (S.mine[i]) return boom(i);
  const stack = [i];
  while (stack.length) {
    const k = stack.pop();
    if (S.open[k] || S.flag[k]) continue;
    S.open[k] = true;
    S.openCount++;
    if (S.adj[k] === 0 && !S.mine[k]) {
      for (const j of neighbors(k)) if (!S.open[j] && !S.mine[j]) stack.push(j);
    }
  }
  paint();
  vibrate(10);
  if (S.openCount === S.w * S.h - S.mines) win();
}

function paintCell(i) {
  const el = $(`.mc[data-i="${i}"]`);
  if (!el) return;
  el.className = 'mc';
  if (S.open[i]) {
    el.classList.add('open');
    const a = S.adj[i];
    el.innerHTML = a ? `<span class="n${a}">${a}</span>` : '';
  } else if (S.flag[i]) {
    el.innerHTML = `<span style="color:var(--second)">${FLAG}</span>`;
  } else {
    el.innerHTML = '';
  }
}

function paint() {
  for (let i = 0; i < S.w * S.h; i++) paintCell(i);
}

function boom(hit) {
  S.done = true;
  clock.stop();
  for (let i = 0; i < S.mine.length; i++) {
    if (S.mine[i]) {
      const el = $(`.mc[data-i="${i}"]`);
      el.classList.add(i === hit ? 'boom' : 'mine-show');
      el.innerHTML = `<span style="color:${i === hit ? '#fff' : 'var(--bad)'}">${MINE}</span>`;
    }
  }
  vibrate([90, 60, 90]);
  setTimeout(() => {
    openModal(`
      <h3>¡Boom!</h3>
      <p style="text-align:center;">Pisaste una mina con ${S.openCount} casillas despejadas.</p>
      <div class="m-actions">
        <button class="btn btn-primary" id="m-again">Otra partida</button>
        <button class="btn btn-ghost" id="m-diff">Cambiar dificultad</button>
      </div>
    `);
    $('#m-again').onclick = () => { closeModal(); startGame(); };
    $('#m-diff').onclick = () => { closeModal(); renderSetup(); };
  }, 900);
}

function win() {
  S.done = true;
  clock.stop();
  // marca las minas restantes
  for (let i = 0; i < S.mine.length; i++) {
    if (S.mine[i] && !S.flag[i]) { S.flag[i] = true; paintCell(i); }
  }
  $('#minesleft').textContent = 0;
  const secs = clock.seconds;
  const key = 'mina.best.' + S.diff;
  const best = store.get(key, null);
  const isRecord = !best || secs < best;
  if (isRecord) {
    store.set(key, secs);
    store.set('mina.hub', `Mejor ${fmtTime(secs)} · ${DIFF_LABEL[S.diff]}`);
  }
  confetti(); vibrate([30, 60, 30]);
  openModal(`
    <h3>¡Campo despejado!</h3>
    <div class="stats" style="margin:14px 0;">
      <div class="stat"><div class="n">${fmtTime(secs)}</div><div class="l">tiempo</div></div>
      <div class="stat"><div class="n">${S.mines}</div><div class="l">minas</div></div>
    </div>
    ${isRecord ? '<p style="text-align:center;"><span class="record">🏆 ¡Nuevo mejor tiempo!</span></p>'
      : (best ? `<p style="text-align:center;">Tu mejor tiempo: <b>${fmtTime(best)}</b></p>` : '')}
    <div class="m-actions">
      <button class="btn btn-primary" id="m-again">Otra partida</button>
      <button class="btn btn-ghost" id="m-diff">Cambiar dificultad</button>
    </div>
  `);
  $('#m-again').onclick = () => { closeModal(); startGame(); };
  $('#m-diff').onclick = () => { closeModal(); renderSetup(); };
}

renderSetup();
</script>
</body>
</html>
