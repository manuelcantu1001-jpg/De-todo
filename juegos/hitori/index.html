<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FBF6ED" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="description" content="Hitori: tacha números repetidos sin juntar tachones y sin partir el tablero." />
<title>Hitori</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C0603A'/%3E%3Crect x='13' y='9' width='38' height='44' rx='6' fill='%23FBF6ED'/%3E%3Ctext x='32' y='42' font-size='28' font-family='Arial,Helvetica,sans-serif' font-weight='700' fill='%2333302B' text-anchor='middle'%3E▦%3C/text%3E%3C/svg%3E" />
<link rel="manifest" href="../../manifest.webmanifest" />
<link rel="apple-touch-icon" href="../../icons/icon-180.png" />
<link rel="stylesheet" href="../../comun/estilo.css" />
<style>
  .hwrap { display: flex; justify-content: center; padding: 16px 14px 0; }
  .hgrid { display: grid; gap: 4px; width: min(92vw, 400px); }
  .hc {
    aspect-ratio: 1; border: none; border-radius: 12px; cursor: pointer; padding: 0;
    background: var(--card); box-shadow: var(--shadow); position: relative;
    font-family: var(--title-font); font-weight: 700; color: var(--ink); transition: all .12s var(--ease);
    font-size: clamp(15px, 4.5vw, 22px);
  }
  .hc.negra { background: var(--ink); color: color-mix(in srgb, var(--card) 30%, transparent); box-shadow: none; }
  .hc.punto::after {
    content: ''; position: absolute; inset: 12%; border-radius: 999px;
    border: 2px solid var(--accent); opacity: .55;
  }
  .hc.dup { color: var(--bad); }
  .leyenda { text-align: center; padding-top: 12px; font-size: 12.5px; color: var(--bg-sub); font-weight: 600; }
  .tools { margin: auto 16px calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; padding-top: 14px; }
  .tool { border: var(--trazo) solid var(--linea-fuerte); cursor: pointer; font-family: var(--title-font); font-weight: 600;
    font-size: 13px; padding: 10px 17px; border-radius: var(--pastilla); background: var(--card); color: var(--ink);
    box-shadow: var(--shadow-sutil); }
  .tool:active { opacity: .6; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>

<script src="../../comun/nucleo.js"></script>
<script>
'use strict';

const CFG = {
  facil:   { n: 5 },
  normal:  { n: 6 },
  dificil: { n: 7 },
  experto: { n: 8 },
};

const S = {
  diff: store.get('hitori.diff', 'normal'),
  n: 0, val: null, estado: null,   // 0 blanca · 1 negra · 2 marcada blanca
  clock: makeClock(() => $('#clk')), jugando: false,
};

const REGLAS = `<p><b>Tacha números</b> (tocando una vez) hasta que en cada fila y columna no quede <b>ningún número repetido</b> sin tachar.</p>
<p>Dos reglas más: los tachones <b>no pueden tocarse</b> en horizontal ni vertical, y las casillas sin tachar deben quedar <b>todas conectadas</b> entre sí.</p>
<p>Un segundo toque pone un círculo (para apuntar «esta es buena») y el tercero la deja normal.</p>
<p>Cada tablero tiene <b>una sola solución</b> y sale razonando. Los números en <b>rojo</b> son los que ahora mismo te siguen quedando repetidos: avisan de dónde falta trabajo, no de cuál hay que tachar.</p>`;

/* ── Generador ───────────────────────────────────────────────────────── */
function conectadas(n, negras, extra) {
  // ¿Las blancas (fuera de negras y extra) forman un solo bloque?
  const mala = (i) => negras.has(i) || i === extra;
  let inicio = -1, total = 0;
  for (let i = 0; i < n * n; i++) if (!mala(i)) { total++; if (inicio < 0) inicio = i; }
  if (inicio < 0) return false;
  const vista = new Set([inicio]);
  const cola = [inicio];
  while (cola.length) {
    const i = cola.pop();
    const r = Math.floor(i / n), c = i % n;
    for (const j of [r > 0 ? i - n : -1, r < n - 1 ? i + n : -1, c > 0 ? i - 1 : -1, c < n - 1 ? i + 1 : -1]) {
      if (j >= 0 && !mala(j) && !vista.has(j)) { vista.add(j); cola.push(j); }
    }
  }
  return vista.size === total;
}

/* ── Resolutor: cuenta soluciones (deducción + ramificación) ───────────── */
function vecinos4(n) {
  const v = [];
  for (let i = 0; i < n * n; i++) {
    const r = Math.floor(i / n), c = i % n, o = [];
    if (r > 0) o.push(i - n);
    if (r < n - 1) o.push(i + n);
    if (c > 0) o.push(i - 1);
    if (c < n - 1) o.push(i + 1);
    v.push(o);
  }
  return v;
}

/* Grupos: celdas con el mismo valor dentro de una fila o de una columna.
   En la solución, de cada grupo queda blanca exactamente una. */
function gruposDe(val, n) {
  const gr = [];
  const meter = (idxs) => {
    const por = new Map();
    for (const i of idxs) {
      if (!por.has(val[i])) por.set(val[i], []);
      por.get(val[i]).push(i);
    }
    for (const arr of por.values()) if (arr.length > 1) gr.push(arr);
  };
  for (let r = 0; r < n; r++) meter(Array.from({ length: n }, (_, c) => r * n + c));
  for (let c = 0; c < n; c++) meter(Array.from({ length: n }, (_, r) => r * n + c));
  return gr;
}

// est: 0 sin decidir · 1 blanca · 2 tachada
function propagaHitori(est, n, vec, gr) {
  let cambio = true;
  while (cambio) {
    cambio = false;
    for (let i = 0; i < n * n; i++) {
      if (est[i] === 2) {
        for (const j of vec[i]) {
          if (est[j] === 2) return false;          // dos tachones pegados
          if (est[j] === 0) { est[j] = 1; cambio = true; }
        }
      }
    }
    for (let k = 0; k < gr.length; k++) {
      const g = gr[k];
      let blancas = 0, negras = 0;
      for (const i of g) { if (est[i] === 1) blancas++; else if (est[i] === 2) negras++; }
      if (blancas > 1) return false;               // dos iguales sin tachar en la misma línea
      // si una queda blanca, las demás del grupo van tachadas
      if (blancas === 1 && negras < g.length - 1) {
        for (const i of g) if (est[i] === 0) { est[i] = 2; cambio = true; }
      }
    }
  }
  // las casillas que no están tachadas deben poder seguir conectadas
  let inicio = -1, total = 0;
  for (let i = 0; i < n * n; i++) if (est[i] !== 2) { total++; if (inicio < 0) inicio = i; }
  if (inicio < 0) return false;
  const vista = new Uint8Array(n * n);
  const cola = [inicio];
  vista[inicio] = 1;
  let vistos = 1;
  while (cola.length) {
    const i = cola.pop();
    for (const j of vec[i]) if (est[j] !== 2 && !vista[j]) { vista[j] = 1; vistos++; cola.push(j); }
  }
  return vistos === total;
}

/* Cuenta soluciones según las reglas tal cual: sin repetidos blancos, sin tachones
   pegados y blancas conectadas. NO da por hecho que una casilla sin repetidos
   tenga que quedar blanca: tacharla de más también sería una solución válida. */
function contarHitori(val, n, limite) {
  const vec = vecinos4(n);
  const gr = gruposDe(val, n);
  let total = 0, pasos = 0, cortado = false;
  function bt(est0) {
    if (total >= limite || cortado) return;
    if (++pasos > 300000) { cortado = true; return; }
    const est = est0.slice();
    if (!propagaHitori(est, n, vec, gr)) return;
    let elegida = -1;
    for (let k = 0; k < gr.length && elegida < 0; k++) {
      for (const i of gr[k]) if (est[i] === 0) { elegida = i; break; }
    }
    if (elegida < 0) for (let i = 0; i < n * n; i++) if (est[i] === 0) { elegida = i; break; }
    if (elegida < 0) { total++; return; }
    for (const v of [2, 1]) {
      const e2 = est.slice(); e2[elegida] = v;
      bt(e2);
      if (total >= limite) return;
    }
  }
  bt(new Uint8Array(n * n));
  return cortado ? limite : total;
}

/* ── Generador ───────────────────────────────────────────────────────── */
/* Tachones: conjunto MÁXIMO de casillas no pegadas que deja las blancas conectadas.
   Que sea máximo es lo que hace única la solución: si sobrara una blanca que se
   pudiera tachar sin romper nada, tacharla sería otra solución igual de válida. */
function elegirNegras(n) {
  const negras = new Set();
  for (let pasada = 0; pasada < 3; pasada++) {
    for (const i of shuffle([...Array(n * n).keys()])) {
      if (negras.has(i)) continue;
      const r = Math.floor(i / n), c = i % n;
      const vs = [r > 0 ? i - n : -1, r < n - 1 ? i + n : -1, c > 0 ? i - 1 : -1, c < n - 1 ? i + 1 : -1];
      if (vs.some((j) => j >= 0 && negras.has(j))) continue;
      if (!conectadas(n, negras, i)) continue;
      negras.add(i);
    }
  }
  return negras;
}

/* ¿Ya no cabe ni un tachón más? (si cabe, habría más de una solución) */
function esMaximo(n, negras) {
  for (let i = 0; i < n * n; i++) {
    if (negras.has(i)) continue;
    const r = Math.floor(i / n), c = i % n;
    const vs = [r > 0 ? i - n : -1, r < n - 1 ? i + n : -1, c > 0 ? i - 1 : -1, c < n - 1 ? i + 1 : -1];
    if (vs.some((j) => j >= 0 && negras.has(j))) continue;
    if (conectadas(n, negras, i)) return false;
  }
  return true;
}

function genPuzzle() {
  const { n } = CFG[S.diff];
  const I = (r, c) => r * n + c;
  const tope = performance.now() + 1400;
  let ultimo = null;
  for (let intento = 0; intento < 600; intento++) {
    // 1) cuadrado latino barajado: sin repetidos, todas las líneas completas
    const rp = shuffle([...Array(n).keys()]), cp = shuffle([...Array(n).keys()]), sp = shuffle([...Array(n).keys()]);
    const val = new Array(n * n);
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) val[I(r, c)] = sp[(rp[r] + cp[c]) % n] + 1;
    // 2) tachones
    const negras = elegirNegras(n);
    const maximo = esMaximo(n, negras);
    // 3) valores de los tachones: todos los de una misma línea copian el MISMO
    //    número blanco, así ese número sale tres o más veces en la línea.
    const pendientes = new Set(negras);
    const lineas = [];
    for (let r = 0; r < n; r++) lineas.push(Array.from({ length: n }, (_, c) => I(r, c)));
    for (let c = 0; c < n; c++) lineas.push(Array.from({ length: n }, (_, r) => I(r, c)));
    while (pendientes.size) {
      // la línea con más tachones sin número todavía
      let mejor = null, mejorN = 0;
      for (const L of shuffle(lineas)) {
        const k = L.reduce((s, i) => s + (pendientes.has(i) ? 1 : 0), 0);
        if (k > mejorN) { mejorN = k; mejor = L; }
      }
      if (!mejor) break;
      const blancas = mejor.filter((i) => !negras.has(i));
      if (!blancas.length) { mejor.forEach((i) => pendientes.delete(i)); continue; }
      const v = val[blancas[randInt(blancas.length)]];
      for (const i of mejor) if (pendientes.has(i)) { val[i] = v; pendientes.delete(i); }
    }
    // 4) ¿solución única?
    ultimo = { val, negras };
    if (maximo && contarHitori(val, n, 2) === 1) {
      S.n = n; S.val = val; S.estado = new Array(n * n).fill(0);
      S.solNegras = [...negras];
      return;
    }
    if (performance.now() > tope) break;
  }
  // salvavidas: casi nunca ocurre
  S.n = n; S.val = ultimo.val; S.estado = new Array(n * n).fill(0);
  S.solNegras = [...ultimo.negras];
}

/* ── Validación ──────────────────────────────────────────────────────── */
function duplicadas() {
  const n = S.n, out = new Set();
  const I = (r, c) => r * n + c;
  const revisar = (idxs) => {
    const porValor = new Map();
    for (const i of idxs) {
      if (S.estado[i] === 1) continue;
      const v = S.val[i];
      if (!porValor.has(v)) porValor.set(v, []);
      porValor.get(v).push(i);
    }
    for (const arr of porValor.values()) if (arr.length > 1) arr.forEach((i) => out.add(i));
  };
  for (let r = 0; r < n; r++) revisar(Array.from({ length: n }, (_, c) => I(r, c)));
  for (let c = 0; c < n; c++) revisar(Array.from({ length: n }, (_, r) => I(r, c)));
  return out;
}

function negrasJuntas() {
  const n = S.n;
  for (let i = 0; i < n * n; i++) {
    if (S.estado[i] !== 1) continue;
    const r = Math.floor(i / n), c = i % n;
    if (r < n - 1 && S.estado[i + n] === 1) return true;
    if (c < n - 1 && S.estado[i + 1] === 1) return true;
  }
  return false;
}

function resuelto() {
  if (duplicadas().size || negrasJuntas()) return false;
  const negras = new Set(S.estado.map((e, i) => e === 1 ? i : -1).filter((i) => i >= 0));
  return conectadas(S.n, negras, -1);
}

/* ── Pantallas ───────────────────────────────────────────────────────── */
function renderSetup() {
  S.clock.stop();
  const bests = ['facil', 'normal', 'dificil', 'experto'].map((d) => {
    const b = store.get('hitori.best.' + d, 0);
    return `<div class="b"><div class="bn">${b ? fmtTime(b) : '—'}</div><div class="bl">${DIFF_LABEL[d]}</div></div>`;
  }).join('');
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Hitori', '')}
    <div class="g-setup scroll">
      <div class="card" style="padding: 14px 18px 18px;">
        <div class="row" style="border:none; padding-bottom: 8px;"><div class="row-title">Dificultad</div><div class="row-hint" id="d-hint"></div></div>
        ${diffSegHTML('seg-d', S.diff)}
      </div>
      <div class="label-sm" style="margin-top:4px;">Mejores tiempos</div>
      <div class="bests">${bests}</div>
      <button class="btn btn-primary" style="margin-top:8px;" id="new">Jugar</button>
      <button class="howto" id="howto">¿Cómo se juega?</button>
    </div>
  </div>`;
  const hint = () => { $('#d-hint').textContent = `${CFG[S.diff].n}×${CFG[S.diff].n}`; };
  hint();
  bindSeg('seg-d', (v) => { S.diff = v; store.set('hitori.diff', v); hint(); });
  $('#new').onclick = () => { genPuzzle(); S.jugando = true; renderPlay(); S.clock.start(); };
  bindHowto(REGLAS);
}

function renderPlay() {
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Hitori', `<span class="chip">${DIFF_LABEL[S.diff]}</span><span class="clock" id="clk">0:00</span>`)}
    <div class="hwrap">
      <div class="hgrid" id="hgrid" style="grid-template-columns: repeat(${S.n}, 1fr);">
        ${S.val.map((v, i) => `<button class="hc" data-i="${i}">${v}</button>`).join('')}
      </div>
    </div>
    <div class="leyenda">Los rojos siguen repetidos en su fila o columna</div>
    <div class="tools">
      <button class="tool" id="t-limpiar">Limpiar</button>
      <button class="tool" id="t-salir">Salir</button>
    </div>
  </div>`;
  $('#hgrid').onclick = (e) => {
    const b = e.target.closest('.hc');
    if (b) tap(Number(b.dataset.i));
  };
  $('#t-limpiar').onclick = () => { S.estado.fill(0); paint(); };
  $('#t-salir').onclick = () => { S.jugando = false; renderSetup(); };
  paint();
}

function paint() {
  const dup = duplicadas();
  $$('.hc').forEach((el) => {
    const i = Number(el.dataset.i);
    el.className = 'hc' + (S.estado[i] === 1 ? ' negra' : S.estado[i] === 2 ? ' punto' : '') +
      (S.estado[i] !== 1 && dup.has(i) ? ' dup' : '');
  });
}

function tap(i) {
  if (!S.jugando) return;
  S.estado[i] = (S.estado[i] + 1) % 3;
  vibrate(6);
  paint();
  if (resuelto()) ganar();
}

function ganar() {
  S.jugando = false;
  S.clock.stop();
  const t = S.clock.seconds;
  const best = store.get('hitori.best.' + S.diff, 0);
  const isRecord = !best || t < best;
  if (isRecord) {
    store.set('hitori.best.' + S.diff, t);
    store.set('hit.hub', `Mejor: ${fmtTime(t)}`);
  }
  confetti(); vibrate([30, 60, 30]);
  setTimeout(() => {
    openModal(`
      <h3>${isRecord ? '¡Récord!' : '¡Resuelto!'}</h3>
      <div class="stats" style="margin:14px 0;">
        <div class="stat"><div class="n">${fmtTime(t)}</div><div class="l">tiempo</div></div>
        <div class="stat"><div class="n">${fmtTime(isRecord ? t : best)}</div><div class="l">mejor</div></div>
      </div>
      <div class="m-actions">
        <button class="btn btn-primary" id="m-again">Otro tablero</button>
        <button class="btn btn-ghost" id="m-out">Salir</button>
      </div>
    `);
    $('#m-again').onclick = () => { closeModal(); genPuzzle(); S.jugando = true; renderPlay(); S.clock.start(); };
    $('#m-out').onclick = () => { closeModal(); renderSetup(); };
  }, 600);
}

renderSetup();
</script>
</body>
</html>
