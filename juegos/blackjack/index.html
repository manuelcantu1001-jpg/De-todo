<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAF9F5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="description" content="Blackjack: llega a 21 sin pasarte y véncele la mano a la casa." />
<title>Blackjack</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23D97757'/%3E%3Crect x='13' y='9' width='38' height='44' rx='6' fill='%23FAF9F5'/%3E%3Ctext x='32' y='42' font-size='24' font-family='Arial,Helvetica,sans-serif' font-weight='700' fill='%23141413' text-anchor='middle'%3E21%3C/text%3E%3C/svg%3E" />
<link rel="manifest" href="../../manifest.webmanifest" />
<link rel="apple-touch-icon" href="../../icons/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../comun/estilo.css" />
<style>
  .lado { padding: 12px 18px 0; }
  .lado .quien { font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--bg-sub); display: flex; justify-content: space-between; }
  .lado .quien b { color: var(--bg-ink); font-size: 13px; }
  .cartas { display: flex; gap: 8px; padding-top: 8px; flex-wrap: wrap; min-height: 86px; }
  .carta {
    width: 58px; height: 82px; border-radius: 7px 11px 9px 7px / 9px 11px 7px 9px; background: var(--tile-bg);
    border: 1px solid var(--tile-border); box-shadow: 0 2px 0 var(--tile-border);
    display: flex; flex-direction: column; justify-content: space-between; padding: 6px 7px;
    font-weight: 800; color: var(--ink); animation: popIn .22s steps(4, jump-end);
  }
  .carta .r { font-size: 20px; line-height: 1; }
  .carta .s { font-size: 22px; line-height: 1; align-self: flex-end; }
  .carta.roja { color: var(--bad); }
  .carta.dorso { background: repeating-linear-gradient(45deg, var(--accent), var(--accent) 6px, color-mix(in srgb, var(--accent) 80%, black) 6px, color-mix(in srgb, var(--accent) 80%, black) 12px); border-color: transparent; }
  .fichas { display: flex; justify-content: center; gap: 18px; padding: 14px 0 0; font-size: 13.5px; font-weight: 700; color: var(--bg-sub); }
  .fichas b { color: var(--bg-ink); font-size: 16px; }
  .acciones { margin: auto 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; padding-top: 14px; }
  .acciones .fila { display: flex; gap: 10px; }
  .acciones .fila .btn { flex: 1; }
  .msg-mesa { text-align: center; padding-top: 12px; font-size: 15px; font-weight: 700; color: var(--bg-ink); min-height: 22px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>

<script src="../../comun/nucleo.js"></script>
<script>
'use strict';

const CFG = {
  facil:   { mazos: 1, suave17: false },
  normal:  { mazos: 2, suave17: false },
  experto: { mazos: 6, suave17: true },
};
const PALOS = ['♠', '♥', '♦', '♣'];
const BANCA_INICIAL = 200;

const S = {
  diff: store.get('blackjack.diff', 'normal'),
  banca: store.get('blackjack.banca', BANCA_INICIAL),
  apuesta: store.get('blackjack.apuesta', 10),
  mazo: [], tu: [], casa: [], oculta: true,
  fase: 'apuesta', doblada: false,
};

const REGLAS = `<p>Acércate a <b>21</b> más que la casa, sin pasarte. Las figuras valen 10 y el <b>as vale 11 u 1</b>, lo que más te convenga.</p>
<p><b>Pide</b> cartas, <b>plántate</b>, o <b>dobla</b> la apuesta con tus dos primeras (recibes una sola más). La casa pide hasta llegar a 17. Un <b>blackjack</b> (21 con dos cartas) paga 3 a 2.</p>
<p>La dificultad cambia las reglas de la casa: en Experto juega con 6 mazos y pide con 17 suave. Tu marca es la <b>banca más alta</b> que has llegado a juntar.</p>`;

const cartaHTML = (c, oculta) => oculta
  ? '<div class="carta dorso"></div>'
  : `<div class="carta ${c.s === 1 || c.s === 2 ? 'roja' : ''}"><span class="r">${c.r === 14 ? 'A' : c.r === 13 ? 'K' : c.r === 12 ? 'Q' : c.r === 11 ? 'J' : c.r}</span><span class="s">${PALOS[c.s]}</span></div>`;

function barajar() {
  S.mazo = [];
  for (let m = 0; m < CFG[S.diff].mazos; m++)
    for (let s = 0; s < 4; s++) for (let r = 2; r <= 14; r++) S.mazo.push({ r, s });
  S.mazo = shuffle(S.mazo);
}
const roba = () => S.mazo.pop();

function valor(mano) {
  let v = 0, ases = 0;
  for (const c of mano) {
    if (c.r === 14) { v += 11; ases++; }
    else v += Math.min(10, c.r);
  }
  while (v > 21 && ases--) v -= 10;
  return v;
}
const esBJ = (mano) => mano.length === 2 && valor(mano) === 21;
const esSuave = (mano) => {
  let v = 0, ases = 0;
  for (const c of mano) { if (c.r === 14) { v += 11; ases++; } else v += Math.min(10, c.r); }
  while (v > 21 && ases--) v -= 10;
  return ases > 0;
};

/* ── Pantallas ───────────────────────────────────────────────────────── */
function renderSetup() {
  const max = store.get('blackjack.max', 0);
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Blackjack', '')}
    <div class="g-setup scroll">
      <div class="card" style="padding: 14px 18px 18px;">
        <div class="row" style="border:none; padding-bottom: 8px;"><div class="row-title">Reglas de la casa</div><div class="row-hint" id="d-hint"></div></div>
        ${diffSegHTML('seg-d', S.diff, ['facil', 'normal', 'experto'])}
        <div class="row" style="margin-top: 10px;">
          <div><div class="row-title">Tu apuesta</div><div class="row-hint">De 5 en 5</div></div>
          <div class="stepper">
            <button id="ap-menos">−</button>
            <div class="val" id="ap-val">$${S.apuesta}</div>
            <button id="ap-mas">+</button>
          </div>
        </div>
      </div>
      <div class="bests">
        <div class="b"><div class="bn">$${S.banca}</div><div class="bl">Tu banca</div></div>
        <div class="b"><div class="bn">${max ? '$' + max : '—'}</div><div class="bl">Banca máxima</div></div>
      </div>
      <button class="btn btn-primary" style="margin-top:8px;" id="new">Repartir</button>
      ${S.banca < 5 ? '<button class="btn btn-ghost" id="repo">Reponer banca ($' + BANCA_INICIAL + ')</button>' : ''}
      <button class="howto" id="howto">¿Cómo se juega?</button>
    </div>
  </div>`;
  const hint = () => { const c = CFG[S.diff]; $('#d-hint').textContent = `${c.mazos} mazo${c.mazos > 1 ? 's' : ''}${c.suave17 ? ' · pide con 17 suave' : ''}`; };
  hint();
  bindSeg('seg-d', (v) => { S.diff = v; store.set('blackjack.diff', v); hint(); barajar(); });
  const pintaAp = () => { $('#ap-val').textContent = '$' + S.apuesta; };
  $('#ap-menos').onclick = () => { S.apuesta = Math.max(5, S.apuesta - 5); store.set('blackjack.apuesta', S.apuesta); pintaAp(); };
  $('#ap-mas').onclick = () => { S.apuesta = Math.min(100, S.apuesta + 5); store.set('blackjack.apuesta', S.apuesta); pintaAp(); };
  $('#new').onclick = repartir;
  const repo = $('#repo');
  if (repo) repo.onclick = () => { S.banca = BANCA_INICIAL; store.set('blackjack.banca', S.banca); renderSetup(); };
  bindHowto(REGLAS);
}

function repartir() {
  if (S.banca < 5) return;
  S.apuesta = Math.min(S.apuesta, Math.floor(S.banca / 5) * 5);
  if (S.mazo.length < 20) barajar();
  S.tu = [roba(), roba()];
  S.casa = [roba(), roba()];
  S.oculta = true; S.doblada = false; S.fase = 'jugando';
  renderMesa();
  if (esBJ(S.tu) || esBJ(S.casa)) {
    S.fase = 'dealer';
    setTimeout(() => { S.oculta = false; paint(); setTimeout(resolver, 700); }, 700);
  }
}

function renderMesa() {
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Blackjack', `<span class="chip">${DIFF_LABEL[S.diff]}</span>`)}
    <div class="lado">
      <div class="quien"><span>La casa</span><b id="v-casa"></b></div>
      <div class="cartas" id="c-casa"></div>
    </div>
    <div class="msg-mesa" id="msg-mesa"></div>
    <div class="lado">
      <div class="quien"><span>Tú</span><b id="v-tu"></b></div>
      <div class="cartas" id="c-tu"></div>
    </div>
    <div class="fichas"><span>Banca <b id="f-banca"></b></span><span>Apuesta <b id="f-ap"></b></span></div>
    <div class="acciones">
      <div class="fila" id="botones">
        <button class="btn btn-soft" id="b-pedir">Pedir</button>
        <button class="btn btn-primary" id="b-plantar">Plantarse</button>
      </div>
      <div class="fila">
        <button class="btn btn-ghost" id="b-doblar">Doblar</button>
        <button class="btn btn-ghost" id="b-salir">Salir</button>
      </div>
    </div>
  </div>`;
  $('#b-pedir').onclick = pedir;
  $('#b-plantar').onclick = plantarse;
  $('#b-doblar').onclick = doblar;
  $('#b-salir').onclick = renderSetup;
  paint();
}

function paint() {
  $('#c-casa').innerHTML = S.casa.map((c, i) => cartaHTML(c, S.oculta && i === 1)).join('');
  $('#c-tu').innerHTML = S.tu.map((c) => cartaHTML(c)).join('');
  $('#v-casa').textContent = S.oculta ? valor([S.casa[0]]) + ' + ?' : valor(S.casa);
  $('#v-tu').textContent = valor(S.tu);
  $('#f-banca').textContent = '$' + S.banca;
  $('#f-ap').textContent = '$' + (S.doblada ? S.apuesta * 2 : S.apuesta);
  const jugando = S.fase === 'jugando';
  $('#b-pedir').disabled = !jugando;
  $('#b-plantar').disabled = !jugando;
  $('#b-doblar').disabled = !jugando || S.tu.length !== 2 || S.banca < S.apuesta * 2;
}

function pedir() {
  if (S.fase !== 'jugando') return;
  S.tu.push(roba());
  vibrate(8);
  paint();
  if (valor(S.tu) > 21) { S.fase = 'dealer'; setTimeout(() => { S.oculta = false; paint(); resolver(); }, 500); }
}

function doblar() {
  if (S.fase !== 'jugando' || S.tu.length !== 2 || S.banca < S.apuesta * 2) return;
  S.doblada = true;
  S.tu.push(roba());
  vibrate(10);
  paint();
  S.fase = 'dealer';
  setTimeout(() => valor(S.tu) > 21 ? (S.oculta = false, paint(), resolver()) : turnoCasa(), 600);
}

function plantarse() {
  if (S.fase !== 'jugando') return;
  S.fase = 'dealer';
  turnoCasa();
}

function turnoCasa() {
  S.oculta = false;
  paint();
  const paso = () => {
    const v = valor(S.casa);
    const pide = v < 17 || (v === 17 && CFG[S.diff].suave17 && esSuave(S.casa));
    if (pide) {
      S.casa.push(roba());
      paint();
      setTimeout(paso, 650);
    } else resolver();
  };
  setTimeout(paso, 650);
}

function resolver() {
  S.fase = 'fin';
  const ap = S.doblada ? S.apuesta * 2 : S.apuesta;
  const vt = valor(S.tu), vc = valor(S.casa);
  let delta, titulo, porque;
  if (esBJ(S.tu) && !esBJ(S.casa)) { delta = Math.floor(ap * 1.5); titulo = '¡Blackjack!'; porque = 'Pagado 3 a 2.'; }
  else if (vt > 21) { delta = -ap; titulo = 'Te pasaste'; porque = `Llevabas ${vt}.`; }
  else if (esBJ(S.casa) && !esBJ(S.tu)) { delta = -ap; titulo = 'Blackjack de la casa'; porque = 'Nada que hacer.'; }
  else if (vc > 21) { delta = ap; titulo = '¡La casa se pasó!'; porque = `Se fue a ${vc}.`; }
  else if (vt > vc) { delta = ap; titulo = '¡Ganaste la mano!'; porque = `${vt} contra ${vc}.`; }
  else if (vt < vc) { delta = -ap; titulo = 'Gana la casa'; porque = `${vc} contra ${vt}.`; }
  else { delta = 0; titulo = 'Empate'; porque = `${vt} iguales: recuperas tu apuesta.`; }
  S.banca += delta;
  store.set('blackjack.banca', S.banca);
  const max = store.get('blackjack.max', 0);
  const isRecord = S.banca > max;
  if (isRecord) {
    store.set('blackjack.max', S.banca);
    store.set('bj.hub', `Banca máxima: $${S.banca}`);
  }
  if (delta > 0) { confetti(); vibrate([30, 60, 30]); } else if (delta < 0) vibrate([70, 50, 70]);
  $('#msg-mesa').textContent = titulo;
  setTimeout(() => {
    const quebrado = S.banca < 5;
    openModal(`
      <h3>${titulo}</h3>
      <p style="text-align:center;">${esc(porque)}</p>
      <div class="stats" style="margin:14px 0;">
        <div class="stat"><div class="n">${delta > 0 ? '+$' + delta : delta < 0 ? '−$' + (-delta) : '$0'}</div><div class="l">esta mano</div></div>
        <div class="stat"><div class="n">$${S.banca}</div><div class="l">banca${isRecord ? ' · récord' : ''}</div></div>
      </div>
      <div class="m-actions">
        ${quebrado
          ? '<button class="btn btn-primary" id="m-repo">Reponer banca ($' + BANCA_INICIAL + ')</button>'
          : '<button class="btn btn-primary" id="m-again">Otra mano</button>'}
        <button class="btn btn-ghost" id="m-out">Salir</button>
      </div>
    `);
    const again = $('#m-again');
    if (again) again.onclick = () => { closeModal(); repartir(); };
    const repo = $('#m-repo');
    if (repo) repo.onclick = () => { S.banca = BANCA_INICIAL; store.set('blackjack.banca', S.banca); closeModal(); repartir(); };
    $('#m-out').onclick = () => { closeModal(); renderSetup(); };
  }, 900);
}

barajar();
renderSetup();
</script>
</body>
</html>
