<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAF9F5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="description" content="Bloques que caen: acomoda las piezas y limpia líneas antes de llegar al tope." />
<title>Bloques</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23D97757'/%3E%3Crect x='13' y='9' width='38' height='44' rx='6' fill='%23FAF9F5'/%3E%3Ctext x='32' y='42' font-size='28' font-family='Arial,Helvetica,sans-serif' font-weight='700' fill='%23141413' text-anchor='middle'%3E▟%3C/text%3E%3C/svg%3E" />
<link rel="manifest" href="../../manifest.webmanifest" />
<link rel="apple-touch-icon" href="../../icons/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../comun/estilo.css" />
<style>
  .juego { display: flex; justify-content: center; gap: 12px; padding: 10px 12px 0; }
  canvas#tablero {
    border: var(--trazo) solid var(--ink); border-radius: 15px 15px 15px 15px / 11px 13px 15px 11px;
    box-shadow: var(--shadow); background: var(--card); touch-action: none;
  }
  .lateral { display: flex; flex-direction: column; gap: 10px; width: 88px; }
  .panelito {
    background: var(--card); border: 1.5px solid var(--ink);
    border-radius: 15px 11px 10px 12px / 15px 12px 16px 9px; box-shadow: var(--shadow-sutil);
    padding: 7px; text-align: center;
  }
  .panelito .t { font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--sub); }
  .panelito .v { font-family: var(--title-font); font-size: 19px; font-weight: 700; color: var(--ink); }
  canvas#prox { display: block; margin: 4px auto 0; }
  .controles { display: flex; gap: 8px; justify-content: center; padding: 12px 14px calc(14px + env(safe-area-inset-bottom)); }
  .ctl {
    flex: 1; max-width: 76px; height: 56px; border: none; border-radius: 11px 12px 14px 17px / 12px 15px 14px 17px; cursor: pointer;
    background: var(--card); box-shadow: var(--shadow); color: var(--ink); font-size: 22px; font-weight: 700;
  }
  .ctl:active { transform: scale(.93); background: var(--accent-soft); color: var(--ink); }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>

<script src="../../comun/nucleo.js"></script>
<script>
'use strict';

const COLS = 10, FILAS = 20, U = 24;
const CFG = { facil: 0, normal: 3, dificil: 5, experto: 7 };
const VEL = [800, 660, 540, 440, 360, 290, 230, 185, 150, 120, 100, 85, 70];
const PIEZAS = [
  { caja: 4, celdas: [[1, 0], [1, 1], [1, 2], [1, 3]] }, // I
  { caja: 2, celdas: [[0, 0], [0, 1], [1, 0], [1, 1]] }, // O
  { caja: 3, celdas: [[0, 1], [1, 0], [1, 1], [1, 2]] }, // T
  { caja: 3, celdas: [[0, 1], [0, 2], [1, 0], [1, 1]] }, // S
  { caja: 3, celdas: [[0, 0], [0, 1], [1, 1], [1, 2]] }, // Z
  { caja: 3, celdas: [[0, 0], [1, 0], [1, 1], [1, 2]] }, // J
  { caja: 3, celdas: [[0, 2], [1, 0], [1, 1], [1, 2]] }, // L
];
let COLORES = [];

const S = {
  diff: store.get('bloques.diff', 'normal'),
  grid: null, pieza: null, bolsa: [], prox: -1,
  score: 0, lineas: 0, nivel: 0, timerId: null, jugando: false,
};

const REGLAS = `<p>Las piezas caen y tú las acomodas: completa <b>líneas horizontales</b> para limpiarlas y sumar (4 de un golpe es lo máximo). Si la pila llega al tope, se acabó.</p>
<p>Controles: los botones de abajo (mover, girar, bajar y <b>soltar hasta el fondo</b>), o en el tablero: <b>arrastra</b> a los lados para mover, <b>toca</b> para girar y <b>desliza hacia abajo</b> para soltar.</p>
<p>Cada 10 líneas sube la velocidad. La dificultad marca la velocidad inicial. Tu marca es la puntuación.</p>`;

function rotada(celdas, caja) {
  return celdas.map(([r, c]) => [c, caja - 1 - r]);
}

function nuevaPieza() {
  if (!S.bolsa.length) S.bolsa = shuffle([0, 1, 2, 3, 4, 5, 6]);
  if (S.prox < 0) S.prox = S.bolsa.pop();
  if (!S.bolsa.length) S.bolsa = shuffle([0, 1, 2, 3, 4, 5, 6]);
  const t = S.prox;
  S.prox = S.bolsa.pop();
  const p = { t, caja: PIEZAS[t].caja, celdas: PIEZAS[t].celdas.map((x) => x.slice()), r: 0, c: Math.floor((COLS - PIEZAS[t].caja) / 2) };
  if (choca(p, 0, 0, p.celdas)) return null;
  return p;
}

function choca(p, dr, dc, celdas) {
  for (const [r, c] of celdas) {
    const rr = p.r + r + dr, cc = p.c + c + dc;
    if (cc < 0 || cc >= COLS || rr >= FILAS) return true;
    if (rr >= 0 && S.grid[rr * COLS + cc]) return true;
  }
  return false;
}

function fijar() {
  for (const [r, c] of S.pieza.celdas) {
    const rr = S.pieza.r + r, cc = S.pieza.c + c;
    if (rr >= 0) S.grid[rr * COLS + cc] = S.pieza.t + 1;
  }
  let limpias = 0;
  for (let r = FILAS - 1; r >= 0; r--) {
    if (Array.from({ length: COLS }, (_, c) => S.grid[r * COLS + c]).every(Boolean)) {
      S.grid.splice(r * COLS, COLS);
      S.grid.unshift(...new Array(COLS).fill(0));
      limpias++;
      r++;
    }
  }
  if (limpias) {
    S.lineas += limpias;
    S.score += [0, 100, 300, 500, 800][Math.min(limpias, 4)] * (S.nivel + 1);
    const nuevoNivel = CFG[S.diff] + Math.floor(S.lineas / 10);
    if (nuevoNivel !== S.nivel) { S.nivel = nuevoNivel; reprogramar(); }
    vibrate(limpias >= 4 ? [30, 50, 30, 50, 30] : 15);
  }
  S.pieza = nuevaPieza();
  if (!S.pieza) return terminar();
  pintarHud();
}

function gravedad() {
  if (!S.jugando) return;
  if (!choca(S.pieza, 1, 0, S.pieza.celdas)) S.pieza.r++;
  else fijar();
  dibujar();
}

function reprogramar() {
  clearInterval(S.timerId);
  S.timerId = setInterval(gravedad, VEL[Math.min(S.nivel, VEL.length - 1)]);
}

/* ── Acciones ────────────────────────────────────────────────────────── */
function mover(dc) {
  if (!S.jugando) return;
  if (!choca(S.pieza, 0, dc, S.pieza.celdas)) { S.pieza.c += dc; dibujar(); }
}
function girar() {
  if (!S.jugando) return;
  const g = rotada(S.pieza.celdas, S.pieza.caja);
  for (const dc of [0, -1, 1, -2, 2]) {
    if (!choca(S.pieza, 0, dc, g)) { S.pieza.celdas = g; S.pieza.c += dc; vibrate(6); dibujar(); return; }
  }
}
function bajar() {
  if (!S.jugando) return;
  if (!choca(S.pieza, 1, 0, S.pieza.celdas)) { S.pieza.r++; dibujar(); }
  else { fijar(); dibujar(); }
}
function soltar() {
  if (!S.jugando) return;
  while (!choca(S.pieza, 1, 0, S.pieza.celdas)) S.pieza.r++;
  vibrate(12);
  fijar();
  dibujar();
}

/* ── Dibujo ──────────────────────────────────────────────────────────── */
let ctx = null, ctxP = null, dpr = 1;
function dibujar() {
  if (!ctx) return;
  ctx.clearRect(0, 0, COLS * U, FILAS * U);
  const celda = (r, c, t, tenue) => {
    ctx.fillStyle = COLORES[t];
    ctx.globalAlpha = tenue ? 0.22 : 1;
    ctx.beginPath();
    ctx.roundRect(c * U + 1, r * U + 1, U - 2, U - 2, 5);
    ctx.fill();
    ctx.globalAlpha = 1;
  };
  for (let r = 0; r < FILAS; r++) for (let c = 0; c < COLS; c++) {
    const v = S.grid[r * COLS + c];
    if (v) celda(r, c, v - 1);
  }
  if (S.pieza) {
    // sombra de caída
    let dr = 0;
    while (!choca(S.pieza, dr + 1, 0, S.pieza.celdas)) dr++;
    for (const [r, c] of S.pieza.celdas) if (S.pieza.r + r + dr >= 0) celda(S.pieza.r + r + dr, S.pieza.c + c, S.pieza.t, true);
    for (const [r, c] of S.pieza.celdas) if (S.pieza.r + r >= 0) celda(S.pieza.r + r, S.pieza.c + c, S.pieza.t);
  }
  // próxima
  ctxP.clearRect(0, 0, 4 * 14, 4 * 14);
  if (S.prox >= 0) {
    ctxP.fillStyle = COLORES[S.prox];
    for (const [r, c] of PIEZAS[S.prox].celdas) {
      ctxP.beginPath();
      ctxP.roundRect(c * 14 + 8 - PIEZAS[S.prox].caja * 1.5, r * 14 + 12, 12, 12, 3);
      ctxP.fill();
    }
  }
}

function pintarHud() {
  $('#h-score').textContent = S.score;
  $('#h-lineas').textContent = S.lineas;
  $('#h-nivel').textContent = S.nivel + 1;
}

/* ── Pantallas ───────────────────────────────────────────────────────── */
function renderSetup() {
  clearInterval(S.timerId);
  S.jugando = false;
  const bests = ['facil', 'normal', 'dificil', 'experto'].map((d) => {
    const b = store.get('bloques.best.' + d, 0);
    return `<div class="b"><div class="bn">${b || '—'}</div><div class="bl">${DIFF_LABEL[d]}</div></div>`;
  }).join('');
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Bloques', '')}
    <div class="g-setup scroll">
      <div class="card" style="padding: 14px 18px 18px;">
        <div class="row" style="border:none; padding-bottom: 8px;"><div class="row-title">Velocidad inicial</div></div>
        ${diffSegHTML('seg-d', S.diff)}
      </div>
      <div class="label-sm" style="margin-top:4px;">Mejores puntuaciones</div>
      <div class="bests">${bests}</div>
      <button class="btn btn-primary" style="margin-top:8px;" id="new">Jugar</button>
      <button class="howto" id="howto">¿Cómo se juega?</button>
    </div>
  </div>`;
  bindSeg('seg-d', (v) => { S.diff = v; store.set('bloques.diff', v); });
  $('#new').onclick = startGame;
  bindHowto(REGLAS);
}

function startGame() {
  S.grid = new Array(COLS * FILAS).fill(0);
  S.bolsa = []; S.prox = -1;
  S.score = 0; S.lineas = 0; S.nivel = CFG[S.diff];
  S.jugando = true;
  renderPlay();
  S.pieza = nuevaPieza();
  pintarHud();
  dibujar();
  reprogramar();
}

function renderPlay() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Bloques', `<span class="chip">${DIFF_LABEL[S.diff]}</span>`)}
    <div class="juego">
      <canvas id="tablero" width="${COLS * U * dpr}" height="${FILAS * U * dpr}" style="width: min(56vw, ${COLS * U}px); aspect-ratio: ${COLS} / ${FILAS};"></canvas>
      <div class="lateral">
        <div class="panelito"><div class="t">Puntos</div><div class="v" id="h-score">0</div></div>
        <div class="panelito"><div class="t">Líneas</div><div class="v" id="h-lineas">0</div></div>
        <div class="panelito"><div class="t">Nivel</div><div class="v" id="h-nivel">1</div></div>
        <div class="panelito"><div class="t">Sigue</div><canvas id="prox" width="${4 * 14 * dpr}" height="${4 * 14 * dpr}" style="width:${4 * 14}px; height:${4 * 14}px;"></canvas></div>
        <button class="ctl" id="c-salir" style="flex:none; height:44px; font-size:13px;">Salir</button>
      </div>
    </div>
    <div class="controles">
      <button class="ctl" id="c-izq">◀</button>
      <button class="ctl" id="c-girar">⟳</button>
      <button class="ctl" id="c-abajo">▼</button>
      <button class="ctl" id="c-soltar">⤓</button>
      <button class="ctl" id="c-der">▶</button>
    </div>
  </div>`;
  const cv = $('#tablero');
  ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctxP = $('#prox').getContext('2d');
  ctxP.scale(dpr, dpr);
  const cs = getComputedStyle(document.body);
  COLORES = ['--tinta-1', '--tinta-2', '--tinta-4', '--tinta-5'].map((v) => cs.getPropertyValue(v).trim())
    .concat(['--tinta-2', '--tinta-6', '--tinta-7'].map((v) => cs.getPropertyValue(v).trim()));
  $('#c-izq').onclick = () => mover(-1);
  $('#c-der').onclick = () => mover(1);
  $('#c-girar').onclick = girar;
  $('#c-abajo').onclick = bajar;
  $('#c-soltar').onclick = soltar;
  $('#c-salir').onclick = renderSetup;
  // gestos sobre el tablero
  let px = 0, py = 0, movido = 0, t0 = 0;
  cv.onpointerdown = (e) => { px = e.clientX; py = e.clientY; movido = 0; t0 = Date.now(); cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = (e) => {
    if (!t0) return;
    const ancho = cv.getBoundingClientRect().width / COLS;
    const dx = Math.trunc((e.clientX - px) / ancho);
    if (dx) { mover(dx > 0 ? 1 : -1); px += Math.sign(dx) * ancho; movido++; }
  };
  cv.onpointerup = (e) => {
    const dy = e.clientY - py, dt = Date.now() - t0;
    t0 = 0;
    if (dy > 60 && dt < 400) soltar();
    else if (!movido && Math.abs(dy) < 14) girar();
  };
  addEventListener('keydown', teclas);
}

function teclas(e) {
  if (!S.jugando) return;
  if (e.key === 'ArrowLeft') mover(-1);
  else if (e.key === 'ArrowRight') mover(1);
  else if (e.key === 'ArrowUp') girar();
  else if (e.key === 'ArrowDown') bajar();
  else if (e.key === ' ') { e.preventDefault(); soltar(); }
}

function terminar() {
  S.jugando = false;
  clearInterval(S.timerId);
  const best = store.get('bloques.best.' + S.diff, 0);
  const isRecord = S.score > best;
  if (isRecord && S.score > 0) {
    store.set('bloques.best.' + S.diff, S.score);
    store.set('blo.hub', `Mejor: ${S.score} pts`);
    confetti();
  }
  vibrate([80, 60, 80]);
  setTimeout(() => {
    openModal(`
      <h3>${isRecord && S.score > 0 ? '¡Récord!' : 'Llegó al tope'}</h3>
      <div class="stats" style="margin:14px 0;">
        <div class="stat"><div class="n">${S.score}</div><div class="l">puntos</div></div>
        <div class="stat"><div class="n">${S.lineas}</div><div class="l">líneas</div></div>
        <div class="stat"><div class="n">${Math.max(best, S.score)}</div><div class="l">mejor</div></div>
      </div>
      <div class="m-actions">
        <button class="btn btn-primary" id="m-again">Otra partida</button>
        <button class="btn btn-ghost" id="m-out">Salir</button>
      </div>
    `);
    $('#m-again').onclick = () => { closeModal(); startGame(); };
    $('#m-out').onclick = () => { closeModal(); renderSetup(); };
  }, 500);
}

renderSetup();
</script>
</body>
</html>
