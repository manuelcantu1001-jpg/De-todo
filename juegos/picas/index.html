<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAF9F5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="description" content="Picas y fijas: deduce el número secreto con las pistas de cada intento." />
<title>Picas y fijas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23D97757'/%3E%3Crect x='13' y='9' width='38' height='44' rx='6' fill='%23FAF9F5'/%3E%3Ctext x='32' y='42' font-size='24' font-family='Arial,Helvetica,sans-serif' font-weight='700' fill='%23141413' text-anchor='middle'%3E123%3C/text%3E%3C/svg%3E" />
<link rel="manifest" href="../../manifest.webmanifest" />
<link rel="apple-touch-icon" href="../../icons/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../comun/estilo.css" />
<style>
  .intento { display: flex; justify-content: center; gap: 8px; padding: 16px 0 0; }
  .intento .tile { min-width: 46px; height: 54px; font-size: 26px; }
  .intento .tile.hueco { color: var(--faint); }
  .hist { flex: 1; overflow-y: auto; min-height: 0; padding: 14px 20px 6px; display: flex; flex-direction: column; gap: 8px; }
  .hrow {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--card); border-radius: 15px 13px 10px 15px / 10px 13px 14px 16px; box-shadow: var(--shadow); padding: 10px 14px;
    animation: popIn .18s steps(4, jump-end); border: 1.5px solid var(--ink); }
  .hrow .num { font-family: var(--title-font); font-size: 21px; font-weight: 700; letter-spacing: 4px; color: var(--ink); }
  .hrow .res { display: flex; gap: 8px; font-size: 12px; font-weight: 700; }
  .hrow .res .fija { color: var(--good); }
  .hrow .res .pica { color: var(--warn); }
  .quedan { text-align: center; font-size: 12px; font-weight: 700; color: var(--bg-sub); padding-top: 8px; }
  .quedan.poco { color: var(--bad); }
  .kpad { padding: 8px 14px calc(12px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .kpad button {
    height: 50px; border: none; border-radius: 12px 13px 10px 13px / 8px 8px 12px 8px; background: var(--card); box-shadow: var(--shadow);
    font-weight: 700; font-size: 18px; color: var(--ink); cursor: pointer;
  }
  .kpad button:active { transform: scale(.94); }
  .kpad button.accion { background: var(--accent); color: var(--accent-ink); font-size: 14px; }
  .kpad button.borrar { background: var(--soft); color: var(--sub); font-size: 14px; }
  .kpad button:disabled { opacity: .35; }
  .racha { display: flex; gap: 5px; justify-content: center; padding-top: 6px; }
  .racha i { font-family: var(--title-font); font-size: 11px; font-weight: 700; color: var(--sub);
    border: 1.5px solid var(--ink); border-radius: 8px 6px 9px 7px / 7px 9px 6px 8px; padding: 1px 6px; font-style: normal; }
  .racha i.perdida { color: var(--bad); border-color: var(--bad); }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>

<script src="../../comun/nucleo.js"></script>
<script>
'use strict';

/* Todas las dificultades tienen tope: si no se puede perder, no hay reto. */
const CFG = {
  facil:   { d: 3, max: 9 },
  normal:  { d: 4, max: 9 },
  dificil: { d: 4, max: 7 },
  experto: { d: 5, max: 8 },
};

const S = {
  diff: store.get('picas.diff', 'normal'),
  secreto: '', escrito: '', hist: [], jugando: false,
};

const REGLAS = `<p>La app piensa un número de <b>cifras distintas</b> y tú lo deduces intento por intento.</p>
<p>Tras cada intento te dice cuántas <b>fijas</b> tienes (cifra correcta en su lugar) y cuántas <b>picas</b> (cifra que sí está, pero en otro lugar).</p>
<p>Las cuatro dificultades tienen <b>límite de intentos</b>: si se acaban, pierdes.</p>
<p>La marca no es tu mejor partida suelta (esa puede salir de chiripa), sino la <b>media de cinco partidas seguidas</b>. Para bajarla hay que jugar bien cinco veces, no acertar una por suerte. Una derrota cuenta como el límite más dos.</p>`;

const KM = 'picas.ult5.', KB = 'picas.media.';

function media(arr) { return arr.reduce((a, b) => a + b, 0) / arr.length; }

/* Anota el resultado, mueve la ventana de 5 y actualiza la mejor media. */
function anota(diff, intentos) {
  const arr = store.get(KM + diff, []);
  arr.push(intentos);
  while (arr.length > 5) arr.shift();
  store.set(KM + diff, arr);
  const m = media(arr);
  let record = false;
  if (arr.length === 5) {
    const prev = store.get(KB + diff, null);
    if (prev == null || m < prev - 1e-9) {
      store.set(KB + diff, m);
      store.set('pic.hub', `Media ${m.toFixed(1)} · ${DIFF_LABEL[diff]}`);
      record = true;
    }
  }
  return { arr, m, record };
}

function renderSetup() {
  const bests = ['facil', 'normal', 'dificil', 'experto'].map((d) => {
    const b = store.get(KB + d, null);
    return `<div class="b"><div class="bn">${b == null ? '—' : b.toFixed(1)}</div><div class="bl">${DIFF_LABEL[d]}</div></div>`;
  }).join('');
  const arr = store.get(KM + S.diff, []);
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Picas y fijas', '')}
    <div class="g-setup scroll">
      <div class="card" style="padding: 14px 18px 18px;">
        <div class="row" style="border:none; padding-bottom: 8px;"><div class="row-title">Dificultad</div><div class="row-hint" id="d-hint"></div></div>
        ${diffSegHTML('seg-d', S.diff)}
        <div class="racha" id="racha"></div>
      </div>
      <div class="label-sm" style="margin-top:4px;">Mejor media de 5 partidas</div>
      <div class="bests">${bests}</div>
      <button class="btn btn-primary" style="margin-top:8px;" id="new">Jugar</button>
      <button class="howto" id="howto">¿Cómo se juega?</button>
    </div>
  </div>`;
  const hint = () => {
    const c = CFG[S.diff];
    $('#d-hint').textContent = `${c.d} cifras · máx. ${c.max} intentos`;
    const u = store.get(KM + S.diff, []);
    $('#racha').innerHTML = u.length
      ? `<i style="border:none;">últimas:</i>` + u.map((x) => `<i class="${x > CFG[S.diff].max ? 'perdida' : ''}">${x}</i>`).join('')
      : '<i style="border:none;">sin partidas todavía</i>';
  };
  hint();
  bindSeg('seg-d', (v) => { S.diff = v; store.set('picas.diff', v); hint(); });
  $('#new').onclick = startGame;
  bindHowto(REGLAS);
}

function startGame() {
  const { d } = CFG[S.diff];
  S.secreto = shuffle('0123456789'.split('')).slice(0, d).join('');
  S.escrito = ''; S.hist = []; S.jugando = true;
  renderPlay();
}

function renderPlay() {
  const c = CFG[S.diff];
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Picas y fijas', `<span class="chip">${DIFF_LABEL[S.diff]}</span><span class="clock" id="rest"></span>`)}
    <div class="intento" id="intento"></div>
    <div class="quedan" id="quedan"></div>
    <div class="msg" id="msg" style="padding-top:6px;"></div>
    <div class="hist" id="hist"></div>
    <div class="kpad" id="kpad">
      ${[1, 2, 3, 4, 5, 0, 6, 7, 8, 9].map((n) => `<button data-n="${n}">${n}</button>`).join('')}
      <button class="borrar" id="k-borrar">Borrar</button>
      <button class="accion" id="k-ok">Probar</button>
    </div>
  </div>`;
  $('#kpad').onclick = (e) => {
    const b = e.target.closest('button');
    if (!b || !S.jugando) return;
    if (b.id === 'k-borrar') { S.escrito = S.escrito.slice(0, -1); paint(); }
    else if (b.id === 'k-ok') probar();
    else if (b.dataset.n != null) {
      if (S.escrito.length < c.d && !S.escrito.includes(b.dataset.n)) { S.escrito += b.dataset.n; vibrate(6); paint(); }
    }
  };
  paint();
}

function paint() {
  const { d, max } = CFG[S.diff];
  $('#intento').innerHTML = Array.from({ length: d }, (_, i) =>
    `<div class="tile ${S.escrito[i] ? '' : 'hueco'}">${S.escrito[i] || '·'}</div>`).join('');
  $('#hist').innerHTML = S.hist.map((h) => `
    <div class="hrow">
      <span class="num">${h.g}</span>
      <span class="res"><span class="fija">${h.f} fija${h.f === 1 ? '' : 's'}</span><span class="pica">${h.p} pica${h.p === 1 ? '' : 's'}</span></span>
    </div>`).reverse().join('');
  $('#rest').textContent = `${S.hist.length}/${max}`;
  const q = max - S.hist.length;
  const el = $('#quedan');
  el.textContent = q === 1 ? 'Te queda 1 intento' : `Te quedan ${q} intentos`;
  el.classList.toggle('poco', q <= 2);
}

function probar() {
  const { d, max } = CFG[S.diff];
  if (S.escrito.length !== d) {
    const el = $('#msg'); el.textContent = `Faltan cifras (son ${d})`; el.className = 'msg err';
    return;
  }
  let f = 0, p = 0;
  for (let i = 0; i < d; i++) {
    if (S.escrito[i] === S.secreto[i]) f++;
    else if (S.secreto.includes(S.escrito[i])) p++;
  }
  S.hist.push({ g: S.escrito, f, p });
  S.escrito = '';
  $('#msg').textContent = '';
  vibrate(10);
  paint();
  if (f === d) return ganar();
  if (S.hist.length >= max) return perder();
}

function tarjetaMedia(r) {
  const faltan = 5 - r.arr.length;
  const mejor = store.get(KB + S.diff, null);
  return `
    <p style="text-align:center;">Media de ${r.arr.length === 1 ? 'tu partida' : 'tus ' + r.arr.length + ' últimas'}:
      <b>${r.m.toFixed(1)}</b>${faltan > 0 ? ` <span style="color:var(--sub);">(faltan ${faltan} para contar)</span>` : ''}</p>
    ${mejor != null ? `<p style="text-align:center;color:var(--sub);">Mejor media de 5: <b>${mejor.toFixed(1)}</b></p>` : ''}`;
}

function ganar() {
  S.jugando = false;
  const n = S.hist.length;
  const r = anota(S.diff, n);
  confetti(); vibrate([30, 60, 30]);
  setTimeout(() => {
    openModal(`
      <h3>${r.record ? '¡Bajaste tu media!' : '¡Lo sacaste!'}</h3>
      <p style="text-align:center;">El número era <b>${S.secreto}</b>.</p>
      <div class="stats" style="margin:14px 0;">
        <div class="stat"><div class="n">${n}</div><div class="l">intento${n === 1 ? '' : 's'}</div></div>
        <div class="stat"><div class="n">${r.m.toFixed(1)}</div><div class="l">media de ${r.arr.length}</div></div>
      </div>
      ${tarjetaMedia(r)}
      <div class="m-actions">
        <button class="btn btn-primary" id="m-again">Otro número</button>
        <button class="btn btn-ghost" id="m-out">Salir</button>
      </div>
    `);
    $('#m-again').onclick = () => { closeModal(); startGame(); };
    $('#m-out').onclick = () => { closeModal(); renderSetup(); };
  }, 500);
}

function perder() {
  S.jugando = false;
  const { max } = CFG[S.diff];
  const r = anota(S.diff, max + 2);   // perder pesa: cuenta como el límite más dos
  vibrate([80, 60, 80]);
  setTimeout(() => {
    openModal(`
      <h3>Se acabaron los intentos</h3>
      <p style="text-align:center;">El número era <b>${S.secreto}</b>.</p>
      <p style="text-align:center;color:var(--sub);">La partida cuenta como <b>${max + 2}</b> intentos para la media.</p>
      ${tarjetaMedia(r)}
      <div class="m-actions">
        <button class="btn btn-primary" id="m-again">Otro número</button>
        <button class="btn btn-ghost" id="m-out">Salir</button>
      </div>
    `);
    $('#m-again').onclick = () => { closeModal(); startGame(); };
    $('#m-out').onclick = () => { closeModal(); renderSetup(); };
  }, 400);
}

renderSetup();
</script>
</body>
</html>
