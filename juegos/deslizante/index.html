<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F7F3EA" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="description" content="Rompecabezas deslizante: ordena los números moviendo fichas al hueco." />
<title>Deslizante</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E7A5C'/%3E%3Crect x='13' y='9' width='38' height='44' rx='6' fill='%23FFFDF6'/%3E%3Ctext x='32' y='42' font-size='28' font-family='Georgia,serif' font-weight='700' fill='%23221F19' text-anchor='middle'%3E15%3C/text%3E%3C/svg%3E" />
<link rel="manifest" href="../../manifest.webmanifest" />
<link rel="apple-touch-icon" href="../../icons/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../comun/estilo.css" />
<style>
  .dwrap { display: flex; justify-content: center; padding: 20px 16px 0; }
  .dgrid { display: grid; gap: 7px; width: min(90vw, 380px); }
  .dt {
    aspect-ratio: 1; border: none; border-radius: 12px; cursor: pointer; padding: 0;
    background: var(--tile-bg); color: var(--tile-ink); border: 1px solid var(--tile-border);
    box-shadow: 0 3px 0 var(--tile-border), inset 0 1px 0 rgba(255,255,255,.65);
    font-family: var(--title-font); font-weight: 700; font-size: clamp(18px, 6vw, 30px);
    transition: transform .1s;
  }
  .dt.bien { background: var(--accent-soft); color: var(--accent); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 30%, transparent); }
  .dt.hueco { visibility: hidden; }
  .dt:active { transform: scale(.95); }
  .marcador { display: flex; justify-content: center; gap: 20px; padding-top: 16px; font-size: 13.5px; font-weight: 700; color: var(--bg-sub); }
  .marcador b { color: var(--bg-ink); font-size: 15px; }
  .tools { margin: auto 16px calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; padding-top: 14px; }
  .tool { border: none; cursor: pointer; font-weight: 700; font-size: 13.5px; padding: 11px 18px; border-radius: 999px; background: var(--soft); color: var(--sub); }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>

<script src="../../comun/nucleo.js"></script>
<script>
'use strict';

const CFG = { facil: 3, normal: 4, dificil: 5 };

const S = {
  diff: store.get('deslizante.diff', 'normal'),
  n: 0, b: null, moves: 0,
  clock: makeClock(() => $('#clk')), jugando: false,
};

const REGLAS = `<p>Ordena los números del <b>1 en adelante</b> (el hueco queda al final) deslizando fichas: toca cualquier ficha <b>pegada al hueco</b> y se mueve ahí.</p>
<p>El tablero se revuelve con movimientos legales, así que <b>siempre se puede armar</b>.</p>
<p>Tu marca es el mejor tiempo. Las fichas que ya están en su lugar se pintan de verde.</p>`;

function renderSetup() {
  S.clock.stop();
  const bests = ['facil', 'normal', 'dificil'].map((d) => {
    const b = store.get('deslizante.best.' + d, 0);
    return `<div class="b"><div class="bn">${b ? fmtTime(b) : '—'}</div><div class="bl">${DIFF_LABEL[d]}</div></div>`;
  }).join('');
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Deslizante', '')}
    <div class="g-setup scroll">
      <div class="card" style="padding: 14px 18px 18px;">
        <div class="row" style="border:none; padding-bottom: 8px;"><div class="row-title">Dificultad</div><div class="row-hint" id="d-hint"></div></div>
        ${diffSegHTML('seg-d', S.diff, ['facil', 'normal', 'dificil'])}
      </div>
      <div class="label-sm" style="margin-top:4px;">Mejores tiempos</div>
      <div class="bests">${bests}</div>
      <button class="btn btn-primary" style="margin-top:8px;" id="new">Jugar</button>
      <button class="howto" id="howto">¿Cómo se juega?</button>
    </div>
  </div>`;
  const hint = () => { $('#d-hint').textContent = `${CFG[S.diff]}×${CFG[S.diff]}`; };
  hint();
  bindSeg('seg-d', (v) => { S.diff = v; store.set('deslizante.diff', v); hint(); });
  $('#new').onclick = startGame;
  bindHowto(REGLAS);
}

function startGame() {
  const n = CFG[S.diff];
  S.n = n;
  S.b = Array.from({ length: n * n }, (_, i) => (i + 1) % (n * n)); // 0 = hueco
  // Revolver con movimientos legales (siempre resoluble)
  let hueco = n * n - 1, prev = -1;
  for (let k = 0; k < 90 * n; k++) {
    const r = Math.floor(hueco / n), c = hueco % n;
    const opts = [];
    if (r > 0) opts.push(hueco - n);
    if (r < n - 1) opts.push(hueco + n);
    if (c > 0) opts.push(hueco - 1);
    if (c < n - 1) opts.push(hueco + 1);
    const cand = opts.filter((i) => i !== prev);
    const i = cand[randInt(cand.length)];
    S.b[hueco] = S.b[i]; S.b[i] = 0;
    prev = hueco; hueco = i;
  }
  if (armado()) return startGame();
  S.moves = 0; S.jugando = true;
  renderPlay();
  S.clock.start();
}

function renderPlay() {
  $('#app').innerHTML = `
  <div class="screen">
    ${topbarHTML('Deslizante', `<span class="chip">${DIFF_LABEL[S.diff]}</span><span class="clock" id="clk">0:00</span>`)}
    <div class="marcador"><span>Movimientos <b id="mv">0</b></span></div>
    <div class="dwrap">
      <div class="dgrid" id="dgrid" style="grid-template-columns: repeat(${S.n}, 1fr);">
        ${S.b.map((_, i) => `<button class="dt" data-i="${i}"></button>`).join('')}
      </div>
    </div>
    <div class="tools">
      <button class="tool" id="t-otra">Revolver otra vez</button>
      <button class="tool" id="t-salir">Salir</button>
    </div>
  </div>`;
  $('#dgrid').onclick = (e) => {
    const b = e.target.closest('.dt');
    if (b) tap(Number(b.dataset.i));
  };
  $('#t-otra').onclick = startGame;
  $('#t-salir').onclick = () => { S.jugando = false; renderSetup(); };
  paint();
}

function paint() {
  $$('.dt').forEach((el) => {
    const i = Number(el.dataset.i);
    const v = S.b[i];
    el.textContent = v || '';
    el.className = 'dt' + (v === 0 ? ' hueco' : v === i + 1 ? ' bien' : '');
  });
  $('#mv').textContent = S.moves;
}

const armado = () => S.b.every((v, i) => v === (i + 1) % (S.n * S.n));

function tap(i) {
  if (!S.jugando || !S.b[i]) return;
  const n = S.n, hueco = S.b.indexOf(0);
  const r = Math.floor(i / n), c = i % n, hr = Math.floor(hueco / n), hc = hueco % n;
  if (Math.abs(r - hr) + Math.abs(c - hc) !== 1) return;
  S.b[hueco] = S.b[i]; S.b[i] = 0;
  S.moves++;
  vibrate(8);
  paint();
  if (armado()) ganar();
}

function ganar() {
  S.jugando = false;
  S.clock.stop();
  const t = S.clock.seconds;
  const best = store.get('deslizante.best.' + S.diff, 0);
  const isRecord = !best || t < best;
  if (isRecord) {
    store.set('deslizante.best.' + S.diff, t);
    store.set('des.hub', `Mejor: ${fmtTime(t)}`);
  }
  confetti(); vibrate([30, 60, 30]);
  setTimeout(() => {
    openModal(`
      <h3>${isRecord ? '¡Récord!' : '¡Armado!'}</h3>
      <div class="stats" style="margin:14px 0;">
        <div class="stat"><div class="n">${fmtTime(t)}</div><div class="l">tiempo</div></div>
        <div class="stat"><div class="n">${S.moves}</div><div class="l">movimientos</div></div>
        <div class="stat"><div class="n">${fmtTime(isRecord ? t : best)}</div><div class="l">mejor</div></div>
      </div>
      <div class="m-actions">
        <button class="btn btn-primary" id="m-again">Otro revuelto</button>
        <button class="btn btn-ghost" id="m-out">Salir</button>
      </div>
    `);
    $('#m-again').onclick = () => { closeModal(); startGame(); };
    $('#m-out').onclick = () => { closeModal(); renderSetup(); };
  }, 600);
}

renderSetup();
</script>
</body>
</html>
