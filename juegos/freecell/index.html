<script>
'use strict';

/* ═══ Motor de FreeCell: reparto, reglas y resolutor ═══════════════════
   Este bloque es el mismo, línea por línea, que corrió fuera del navegador
   para medir los repartos de la lista de abajo. Si aquí cambia una regla,
   la garantía de que todos se pueden ganar deja de valer. */

/* Azar reproducible (mulberry32 con Math.imul: sin desbordes de coma
   flotante, que ya invalidaron una medición en esta colección). */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Carta = 0..51. Palo = 0 picas, 1 corazones, 2 tréboles, 3 diamantes. */
const PALO = (c) => (c / 13) | 0;
const VAL = (c) => (c % 13) + 1;
const ROJO = (c) => PALO(c) === 1 || PALO(c) === 3;

/* Reparto: baraja completa revuelta con la semilla y repartida por filas
   en 8 columnas (las cuatro primeras con 7 cartas, las otras con 6). */
function repartoDe(semilla) {
  const rnd = mulberry32(semilla >>> 0);
  const d = [];
  for (let i = 0; i < 52; i++) d.push(i);
  for (let i = 51; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = d[i]; d[i] = d[j]; d[j] = t;
  }
  const cols = [[], [], [], [], [], [], [], []];
  for (let i = 0; i < 52; i++) cols[i % 8].push(d[i]);
  return cols;
}

const nuevoEstado = (cols) => ({
  cols: cols.map((c) => c.slice()),
  libres: [],                    // cartas en las celdas
  bases: [0, 0, 0, 0],           // valor más alto subido, por palo
});
const clonar = (st) => ({ cols: st.cols.map((c) => c.slice()), libres: st.libres.slice(), bases: st.bases.slice() });
const subidas = (st) => st.bases[0] + st.bases[1] + st.bases[2] + st.bases[3];

/* ¿Encaja «c» sobre «base» en una columna? Descendente y alternando color. */
const encajaCol = (c, base) => VAL(base) === VAL(c) + 1 && ROJO(base) !== ROJO(c);
const encajaBase = (st, c) => st.bases[PALO(c)] === VAL(c) - 1;

/* Cuántas cartas del final de la columna forman escalera válida. */
function largoEscalera(col) {
  let k = 1;
  for (let i = col.length - 1; i > 0; i--) {
    if (!encajaCol(col[i], col[i - 1])) break;
    k++;
  }
  return col.length ? k : 0;
}

/* Cuántas cartas puedes mover de golpe: (celdas libres + 1) × 2^(columnas
   vacías). Si el destino es una columna vacía, esa no cuenta. */
function capacidad(st, celdas, destinoVacio) {
  const libres = celdas - st.libres.length;
  let vacias = 0;
  for (const col of st.cols) if (!col.length) vacias++;
  if (destinoVacio) vacias--;
  return (libres + 1) * Math.pow(2, Math.max(0, vacias));
}

/* Subida segura: una carta ya no le hace falta a nadie si las dos bases del
   color contrario van por su valor o más (nadie va a apoyarse en ella).
   Ases y doses, siempre: un as nunca necesita apoyo. */
function seguraSubir(st, c) {
  const v = VAL(c);
  if (v <= 2) return true;
  const op = ROJO(c) ? [0, 2] : [1, 3];
  return st.bases[op[0]] >= v - 1 && st.bases[op[1]] >= v - 1;
}

/* Aplica todas las subidas seguras posibles. Devuelve cuántas hizo. */
function subirSeguras(st) {
  let n = 0;
  for (;;) {
    let movio = false;
    for (let i = 0; i < st.cols.length; i++) {
      const col = st.cols[i];
      if (!col.length) continue;
      const c = col[col.length - 1];
      if (encajaBase(st, c) && seguraSubir(st, c)) { col.pop(); st.bases[PALO(c)] = VAL(c); movio = true; n++; }
    }
    for (let i = 0; i < st.libres.length; i++) {
      const c = st.libres[i];
      if (encajaBase(st, c) && seguraSubir(st, c)) { st.libres.splice(i, 1); st.bases[PALO(c)] = VAL(c); movio = true; n++; break; }
    }
    if (!movio) return n;
  }
}

/* Clave canónica: las columnas son intercambiables entre sí y las celdas
   también, así que se ordenan antes de comparar. Sin esto la búsqueda
   repite la misma posición hasta 8! veces. */
function clave(st) {
  const cs = st.cols.map((col) => {
    let s = '';
    for (let i = 0; i < col.length; i++) s += String.fromCharCode(48 + col[i]);
    return s;
  }).sort();
  const ls = st.libres.map((c) => String.fromCharCode(48 + c)).sort().join('');
  return cs.join('/') + '|' + ls + '|' + String.fromCharCode(48 + st.bases[0], 48 + st.bases[1], 48 + st.bases[2], 48 + st.bases[3]);
}

/* ── Jugadas ──────────────────────────────────────────────────────────
   Una jugada es {t, o, d, k}: tipo, origen, destino, cuántas cartas.
   t: 'cb' columna→base, 'lb' celda→base, 'cl' columna→celda,
      'lc' celda→columna, 'cc' columna→columna (k cartas). */
function jugadas(st, celdas) {
  const out = [];
  const vacia = st.cols.findIndex((c) => !c.length);       // una sola vacía como destino: todas son iguales
  const hayCelda = st.libres.length < celdas;

  for (let i = 0; i < 8; i++) {
    const col = st.cols[i];
    if (!col.length) continue;
    if (encajaBase(st, col[col.length - 1])) out.push({ t: 'cb', o: i });
  }
  for (let i = 0; i < st.libres.length; i++) {
    if (encajaBase(st, st.libres[i])) out.push({ t: 'lb', o: i });
  }
  for (let i = 0; i < st.libres.length; i++) {
    const c = st.libres[i];
    for (let d = 0; d < 8; d++) {
      const col = st.cols[d];
      if (col.length) { if (encajaCol(c, col[col.length - 1])) out.push({ t: 'lc', o: i, d }); }
      else if (d === vacia) out.push({ t: 'lc', o: i, d });
    }
  }
  for (let o = 0; o < 8; o++) {
    const col = st.cols[o];
    if (!col.length) continue;
    const esc = largoEscalera(col);
    for (let d = 0; d < 8; d++) {
      if (d === o) continue;
      const dcol = st.cols[d];
      if (dcol.length) {
        const base = dcol[dcol.length - 1];
        // El destino fija cuántas cartas se mueven: solo una encaja encima.
        for (let k = 1; k <= esc; k++) {
          if (encajaCol(col[col.length - k], base)) {
            if (k <= capacidad(st, celdas, false)) out.push({ t: 'cc', o, d, k });
            break;
          }
        }
      } else if (d === vacia) {
        if (col.length === esc) continue;                  // columna entera a otra vacía: no cambia nada
        const cap = capacidad(st, celdas, true);
        for (let k = 1; k <= Math.min(esc, cap); k++) out.push({ t: 'cc', o, d, k });
      }
    }
    if (hayCelda) out.push({ t: 'cl', o });
  }
  return out;
}

/* Aplica la jugada sobre el estado (lo modifica). */
function aplicar(st, j) {
  if (j.t === 'cb') { const c = st.cols[j.o].pop(); st.bases[PALO(c)] = VAL(c); }
  else if (j.t === 'lb') { const c = st.libres.splice(j.o, 1)[0]; st.bases[PALO(c)] = VAL(c); }
  else if (j.t === 'cl') { st.libres.push(st.cols[j.o].pop()); }
  else if (j.t === 'lc') { st.cols[j.d].push(st.libres.splice(j.o, 1)[0]); }
  else { const col = st.cols[j.o]; const mov = col.splice(col.length - j.k, j.k); for (const c of mov) st.cols[j.d].push(c); }
}

/* Heurística: cuenta lo que falta. Cartas sin subir, cartas encima de la que
   toca subir, pilas desordenadas y celdas ocupadas. Menos es mejor. */
function coste(st) {
  let h = (52 - subidas(st)) * 2;
  for (const col of st.cols) {
    for (let i = 0; i < col.length; i++) {
      const c = col[i];
      if (VAL(c) === st.bases[PALO(c)] + 1) h += (col.length - 1 - i);
      if (i > 0 && !encajaCol(c, col[i - 1])) h += 1;
    }
  }
  h += st.libres.length * 2;
  return h;
}

/* Jugadas de un estado, ordenadas por lo prometedor del resultado. */
function ordena(st, celdas) {
  const con = jugadas(st, celdas).map((j) => {
    const n = clonar(st);
    aplicar(n, j);
    subirSeguras(n);
    return { j, h: coste(n) };
  });
  con.sort((a, b) => a.h - b.h);
  return con.map((x) => x.j);
}

/* ── Resolutor: profundidad con memoria de estados y orden por coste ───
   Iterativo con pila propia: con recursión, los repartos duros (caminos de
   cientos de jugadas antes de retroceder) desbordaban la pila.
   Devuelve {gano, nodos, prof, tope, jugadas}. «nodos» = estados expandidos,
   y es la medida de coste con la que están clasificados los repartos.
   gano=false con tope=false significa que la búsqueda se agotó entera: desde
   ahí no se puede ganar. Con tope=true solo significa «no lo encontré».
   Busca desde CUALQUIER posición, no solo desde el reparto: así el botón
   «¿Queda salida?» usa exactamente el mismo código que dio la garantía. */
function resolver(cols, celdas, tope, topeProf) {
  return resolverDesde(nuevoEstado(cols), celdas, tope, topeProf);
}

function resolverDesde(st0, celdas, tope, topeProf) {
  const maxProf = topeProf || 900;
  const raiz = clonar(st0);
  subirSeguras(raiz);
  if (subidas(raiz) === 52) return { gano: true, nodos: 0, prof: 0, tope: false, jugadas: [] };
  const vistos = new Set([clave(raiz)]);
  let nodos = 0, prof = 0, corto = false;

  const pila = [{ st: raiz, js: ordena(raiz, celdas), i: 0, j: null }];
  while (pila.length) {
    const m = pila[pila.length - 1];
    if (m.i >= m.js.length) { pila.pop(); continue; }
    if (nodos >= tope) { corto = true; break; }
    const j = m.js[m.i++];
    const n = clonar(m.st);
    aplicar(n, j);
    subirSeguras(n);
    const k = clave(n);
    if (vistos.has(k)) continue;
    vistos.add(k);
    nodos++;
    if (pila.length > prof) prof = pila.length;
    if (subidas(n) === 52) {
      const camino = pila.slice(1).map((x) => x.j);
      camino.push(j);
      return { gano: true, nodos, prof, tope: false, jugadas: camino };
    }
    if (pila.length >= maxProf) { corto = true; continue; }
    pila.push({ st: n, js: ordena(n, celdas), i: 0, j });
  }
  return { gano: false, nodos, prof, tope: corto, jugadas: null };
}

/* ═══ Los repartos ════════════════════════════════════════════════════
   Semillas en base 36. Cada una pasó por el resolutor CON LAS CELDAS DE SU
   NIVEL y ganó; el reparto que no se resolvió dentro del tope no entró.

     Fácil    4 celdas ·      32 –    100 nodos
     Normal   4 celdas ·     402 –  2 996 nodos
     Difícil  3 celdas ·  10 025 – 89 949 nodos

/* ═══ Dibujo de las cartas ════════════════════════════════════════════
   Cada carta es un SVG hecho aquí: el valor va en la esquina, dentro del
   cuarto de arriba, que es lo único que se ve cuando la tapa la siguiente.
   El palo grande solo se dibuja en las cartas destapadas (la última de cada
   columna, celdas y bases): así el tablero baja de ~470 nodos a ~350. */
const RATIO = 1.48;
const ALTO = (w) => Math.round(w * RATIO);
const cacheCarta = new Map();

function cartaSVG(c, w, entera) {
  const k = c + '|' + w + '|' + (entera ? 1 : 0);
  let s = cacheCarta.get(k);
  if (s) return s;
  const r = RANGO[VAL(c)];
  const dos = r.length > 1;
  s = `<svg class="fc-carta ${ROJO(c) ? 'roja' : 'negra'}" width="${w}" height="${ALTO(w)}" viewBox="0 0 100 148" ` +
    `role="img" aria-label="${r} de ${PALO_NOMBRE[PALO(c)]}">` +
    `<rect class="fondo" x="1.6" y="1.6" width="96.8" height="144.8" rx="12" stroke-width="${(1.25 * 148 / ALTO(w)).toFixed(2)}"/>` +
    `<text x="${dos ? 7 : 10}" y="37" font-size="${dos ? 33 : 40}">${r}</text>` +
    `<g class="pip" transform="translate(64 7) scale(1.18)">${PIP[PALO(c)]}</g>` +
    (entera ? `<g class="pip" transform="translate(26 66) scale(2)">${PIP[PALO(c)]}</g>` : '') +
    `</svg>`;
  cacheCarta.set(k, s);
  return s;
}

function huecoHTML(w, dentro, attrs, cls) {
  return `<div class="fc-hueco ${cls || ''}" ${attrs || ''} style="width:${w}px;height:${ALTO(w)}px;">${dentro || ''}</div>`;
}
const pipHueco = (s, w) => `<svg width="${Math.round(w * .42)}" height="${Math.round(w * .42)}" viewBox="0 0 24 24">${PIP[s]}</svg>`;

/* ═══ Partida ═════════════════════════════════════════════════════════ */
function nuevaPartida() {
  const lista = SEMILLAS[S.nivel].split(',');
  if (!S.vistas[S.nivel] || S.vistas[S.nivel].length >= lista.length) S.vistas[S.nivel] = [];
  let i;
  do { i = randInt(lista.length); } while (S.vistas[S.nivel].includes(i));
  S.vistas[S.nivel].push(i);
  S.idx = i;
  S.semilla = parseInt(lista[i], 36);
  S.celdas = CFG[S.nivel].celdas;
  S.est = nuevoEstado(repartoDe(S.semilla));
  S.sel = null; S.mov = 0; S.hist = []; S.jugando = true;
  S.gen++;
  renderPlay();
  reloj.start();
}

function medidas() {
  const w = Math.min(window.innerWidth, 480);
  // El ancho manda: 8 cartas + 7 huecos + el respiro que separa celdas de
  // bases. La misma medida sirve arriba y en las columnas.
  S.CW = Math.max(34, Math.floor((w - 12 - 7 * 3 - 8) / 8));
  S.CH = ALTO(S.CW);
}

/* Cartas seleccionadas, o null. */
function grupoSel() {
  if (!S.sel) return null;
  if (S.sel.tipo === 'cel') return S.est.libres.length > S.sel.i ? [S.est.libres[S.sel.i]] : null;
  const col = S.est.cols[S.sel.c];
  return col.length > S.sel.k ? col.slice(S.sel.k) : null;
}

function pintar() {
  if (!$('#mesa')) return;                 // el jugador ya se fue de la pantalla
  const st = S.est, W = S.CW;
  const grupo = grupoSel();
  const n = grupo ? grupo.length : 0;

  // ¿A dónde puede ir lo que está tomado?
  const dCols = new Set(); let dCelda = false; const dBases = new Set();
  if (grupo) {
    for (let d = 0; d < 8; d++) {
      if (S.sel.tipo === 'col' && S.sel.c === d) continue;
      const col = st.cols[d];
      if (col.length) { if (encajaCol(grupo[0], col[col.length - 1]) && n <= capacidad(st, S.celdas, false)) dCols.add(d); }
      else if (n <= capacidad(st, S.celdas, true)) dCols.add(d);
    }
    if (n === 1 && S.sel.tipo !== 'cel' && st.libres.length < S.celdas) dCelda = true;
    if (n === 1 && encajaBase(st, grupo[0])) dBases.add(PALO(grupo[0]));
  }

  // Celdas
  let html = '';
  for (let i = 0; i < S.celdas; i++) {
    const c = st.libres[i];
    if (c === undefined) html += huecoHTML(W, '', 'data-cel="v"', dCelda ? 'fc-dest' : '');
    else {
      const marca = (S.sel && S.sel.tipo === 'cel' && S.sel.i === i) ? ' fc-sel' : '';
      html += cartaSVG(c, W, true).replace('class="fc-carta', `data-cel="${i}" class="fc-carta${marca}`);
    }
  }
  $('#celdas').innerHTML = html;

  // Bases
  html = '';
  for (let s = 0; s < 4; s++) {
    const v = st.bases[s];
    const marca = dBases.has(s) ? ' fc-dest' : '';
    if (!v) html += huecoHTML(W, pipHueco(s, W), `data-b="${s}"`, marca);
    else html += cartaSVG(s * 13 + v - 1, W, true).replace('class="fc-carta', `data-b="${s}" class="fc-carta${marca}`);
  }
  $('#bases').innerHTML = html;

  // Columnas. El solapamiento se estira hasta llenar la mesa y se encoge
  // cuando una columna crece, con suelo en el 27 % de la carta: por debajo
  // de eso el valor de la esquina deja de verse.
  let masLarga = 1;
  for (const col of st.cols) if (col.length > masLarga) masLarga = col.length;
  let off = Math.floor((S.alto - S.CH) / Math.max(1, masLarga - 1));
  off = Math.min(off, Math.round(S.CH * .8));
  off = Math.max(off, Math.round(S.CH * .27));
  $('#mesa').style.height = (S.CH + (masLarga - 1) * off) + 'px';

  html = '';
  for (let c = 0; c < 8; c++) {
    const col = st.cols[c];
    const alto = col.length ? S.CH + (col.length - 1) * off : S.CH;
    let dentro = '';
    if (!col.length) {
      dentro = huecoHTML(W, '', `data-c="${c}" data-k="-1"`, dCols.has(c) ? 'fc-dest' : '');
    } else {
      for (let k = 0; k < col.length; k++) {
        const ultima = k === col.length - 1;
        const tomada = S.sel && S.sel.tipo === 'col' && S.sel.c === c && k >= S.sel.k;
        const marca = (tomada ? ' fc-sel' : '') + (dCols.has(c) && ultima ? ' fc-dest' : '');
        dentro += cartaSVG(col[k], W, ultima).replace('class="fc-carta',
          `data-c="${c}" data-k="${k}" style="top:${k * off}px" class="fc-carta${marca}`);
      }
    }
    html += `<div class="fc-col" data-colw="${c}" style="width:${W}px;height:${alto}px;">${dentro}</div>`;
  }
  $('#mesa').innerHTML = html;

  $('#mv').textContent = S.mov;
  $('#cap').textContent = capacidad(st, S.celdas, false);
}

function aviso(txt, mal) {
  const el = $('#aviso');
  if (!el) return;
  el.textContent = txt || '';
  el.classList.toggle('mal', !!mal);
}

function sacude(sel) {
  const el = $(sel);
  if (el) { el.classList.remove('fc-sacude'); void el.getBoundingClientRect(); el.classList.add('fc-sacude'); }
  vibrate(40);
}

/* ═══ Toques ══════════════════════════════════════════════════════════ */
function guarda() {
  S.hist.push({ est: clonar(S.est), mov: S.mov });
}

function deshacer() {
  if (!S.hist.length) return;
  const h = S.hist.pop();
  S.est = h.est; S.mov = h.mov; S.sel = null;
  if (!S.jugando) { S.jugando = true; reloj.resume(); }
  S.gen++;
  vibrate(8);
  pintar();
  aviso(S.hist.length ? '' : 'Vuelves al reparto de salida');
  if ($('#t-undo')) $('#t-undo').disabled = !S.hist.length;
}

function trasJugada() {
  S.sel = null;
  S.mov++;
  vibrate(10);
  pintar();
  if ($('#t-undo')) $('#t-undo').disabled = false;
  if (subidas(S.est) === 52) return ganar();
  // ¿Ya solo queda subirlas? Entonces se terminan solas, contando cada una.
  const prueba = clonar(S.est);
  subirSeguras(prueba);
  if (subidas(prueba) === 52) { rematar(); return; }
  if (!jugadas(S.est, S.celdas).length) atorado();
}

function tocaColumna(c, k) {
  if (!S.jugando) return;
  const col = S.est.cols[c];
  const enEsta = S.sel && S.sel.tipo === 'col' && S.sel.c === c;
  // Segundo toque en la misma carta: se va sola a su base.
  if (enEsta && S.sel.k === k) { mandarABase(); return; }
  // ¿Es destino de lo que traigo? (a su propia columna, no)
  if (S.sel && !enEsta && mueveA('col', c)) return;
  // Si no se pudo mover, se intenta tomar la carta tocada.
  if (k < 0) {
    if (S.sel) { sacude(`[data-colw="${c}"]`); aviso('Ahí no cabe ese grupo', true); }
    return;
  }
  for (let i = k + 1; i < col.length; i++) {
    if (!encajaCol(col[i], col[i - 1])) {
      sacude(`[data-colw="${c}"]`);
      aviso(S.sel ? 'Esa carta no encaja ahí' : 'Esa carta lleva encima cartas que no siguen la escalera', true);
      return;
    }
  }
  const n = col.length - k;
  const tope = Math.max(capacidad(S.est, S.celdas, false), capacidad(S.est, S.celdas, true));
  if (n > tope) {
    sacude(`[data-colw="${c}"]`);
    aviso(`Ahora solo puedes mover ${tope} carta${tope === 1 ? '' : 's'} de golpe`, true);
    return;
  }
  S.sel = { tipo: 'col', c, k };
  vibrate(6);
  pintar();
  aviso(n > 1 ? `${n} cartas tomadas: toca a dónde van` : 'Toca a dónde va, o vuelve a tocarla para subirla');
}

function tocaCelda(v) {
  if (!S.jugando) return;
  if (v === 'v') {
    if (S.sel && mueveA('cel')) return;
    if (S.sel) { sacude('#celdas'); aviso('A una celda solo va una carta suelta', true); }
    return;
  }
  const i = Number(v);
  if (S.sel && S.sel.tipo === 'cel' && S.sel.i === i) { mandarABase(); return; }
  if (i >= S.est.libres.length) return;
  S.sel = { tipo: 'cel', i };            // tomar la carta de esa celda
  vibrate(6);
  pintar();
  aviso('Toca a dónde va, o vuelve a tocarla para subirla');
}

function tocaBase(s) {
  if (!S.jugando) return;
  if (!S.sel) { aviso('Las bases se llenan del as al rey, por palo'); return; }
  const g = grupoSel();
  if (g && g.length === 1 && PALO(g[0]) === s && encajaBase(S.est, g[0])) { mueveA('base', s); return; }
  sacude('#bases');
  aviso(g && g.length > 1 ? 'A la base sube una carta a la vez' : 'Esa carta todavía no toca en esa base', true);
}

/* Ejecuta el movimiento de lo tomado al destino. Devuelve si se hizo. */
function mueveA(tipo, d) {
  const g = grupoSel();
  if (!g) { S.sel = null; return false; }
  const st = S.est, n = g.length;
  if (tipo === 'base') {
    if (n !== 1 || !encajaBase(st, g[0])) return false;
    guarda();
    quitaSel();
    st.bases[PALO(g[0])] = VAL(g[0]);
  } else if (tipo === 'cel') {
    if (n !== 1 || S.sel.tipo === 'cel' || st.libres.length >= S.celdas) return false;
    guarda();
    quitaSel();
    st.libres.push(g[0]);
  } else {
    const col = st.cols[d];
    if (S.sel.tipo === 'col' && S.sel.c === d) return false;
    if (col.length) {
      if (!encajaCol(g[0], col[col.length - 1]) || n > capacidad(st, S.celdas, false)) return false;
    } else if (n > capacidad(st, S.celdas, true)) return false;
    guarda();
    quitaSel();
    for (const c of g) col.push(c);
  }
  aviso('');
  trasJugada();
  return true;
}

function quitaSel() {
  if (S.sel.tipo === 'cel') S.est.libres.splice(S.sel.i, 1);
  else S.est.cols[S.sel.c].length = S.sel.k;
}

/* Doble toque: la carta tomada se va sola a su base. */
function mandarABase() {
  const g = grupoSel();
  if (g && g.length === 1 && encajaBase(S.est, g[0])) { mueveA('base', PALO(g[0])); return; }
  S.sel = null;
  pintar();
  aviso(g && g.length > 1 ? 'A la base sube una carta a la vez' : 'Esa carta todavía no puede subir');
}

/* ═══ Final de la mano ════════════════════════════════════════════════ */
/* Cuando ya no queda más que subirlas, se suben solas de una en una, y cada
   una cuenta como movimiento: es lo que le habría costado al jugador. */
function rematar() {
  S.jugando = false;
  const gen = S.gen;
  const paso = () => {
    S.temp = null;
    if (gen !== S.gen || !$('#mesa')) return;      // se salió o pidió otra mano
    const antes = subidas(S.est);
    const st = S.est;
    let hecho = false;
    for (let i = 0; i < 8 && !hecho; i++) {
      const col = st.cols[i];
      if (col.length && encajaBase(st, col[col.length - 1]) && seguraSubir(st, col[col.length - 1])) {
        st.bases[PALO(col[col.length - 1])] = VAL(col.pop()); hecho = true;
      }
    }
    for (let i = 0; i < st.libres.length && !hecho; i++) {
      const c = st.libres[i];
      if (encajaBase(st, c) && seguraSubir(st, c)) { st.libres.splice(i, 1); st.bases[PALO(c)] = VAL(c); hecho = true; }
    }
    if (!hecho) return;
    S.mov++;
    pintar();
    aviso('Se acomodan solas…');
    if (subidas(S.est) === 52) { ganar(); return; }
    if (subidas(S.est) > antes) S.temp = setTimeout(paso, 55);
  };
  S.temp = setTimeout(paso, 220);
}

function atorado() {
  S.jugando = false;
  reloj.stop();
  vibrate([60, 40, 60]);
  openModal(`
    <h3>Ya no hay jugadas</h3>
    <p style="text-align:center;">No queda ni un movimiento legal: las celdas están llenas y ninguna carta encaja en ninguna parte. El reparto sí se podía ganar, así que la salida está unas cuantas jugadas atrás.</p>
    <div class="stats" style="margin:14px 0;">
      <div class="stat"><div class="n">${subidas(S.est)}</div><div class="l">de 52 arriba</div></div>
      <div class="stat"><div class="n">${S.mov}</div><div class="l">movimientos</div></div>
    </div>
    <div class="m-actions">
      <button class="btn btn-primary" id="m-undo">Deshacer y seguir</button>
      <button class="btn btn-soft" id="m-again">Otro reparto</button>
      <button class="btn btn-ghost" id="m-out">Salir</button>
    </div>
  `);
  $('#m-undo').onclick = () => { closeModal(); deshacer(); };
  $('#m-again').onclick = () => { closeModal(); nuevaPartida(); };
  $('#m-out').onclick = () => { closeModal(); renderSetup(); };
}

function ganar() {
  S.jugando = false;
  reloj.stop();
  S.gen++;
  const best = store.get('fre.best.' + S.nivel, null);
  const record = best == null || S.mov < best;
  if (record) {
    store.set('fre.best.' + S.nivel, S.mov);
    for (let i = NIVELES.length - 1; i >= 0; i--) {
      const b = store.get('fre.best.' + NIVELES[i], null);
      if (b != null) { store.set('fre.hub', `${b} movimientos · ${DIFF_LABEL[NIVELES[i]]}`); break; }
    }
  }
  confetti(); vibrate([30, 60, 30]);
  const secs = reloj.seconds;
  setTimeout(() => {
    openModal(`
      <h3>${record ? '¡Récord!' : '¡Las 52 arriba!'}</h3>
      <div class="stats" style="margin:14px 0;">
        <div class="stat"><div class="n">${S.mov}</div><div class="l">movimientos</div></div>
        <div class="stat"><div class="n">${fmtTime(secs)}</div><div class="l">tiempo</div></div>
        <div class="stat"><div class="n">${S.celdas}</div><div class="l">celdas</div></div>
      </div>
      <p style="text-align:center;">${record
        ? `Tu mejor mano en ${DIFF_LABEL[S.nivel]}. El mínimo posible son 52 movimientos.`
        : `Tu récord en ${DIFF_LABEL[S.nivel]} sigue siendo <b>${best}</b> movimientos.`}</p>
      <div class="m-actions">
        <button class="btn btn-primary" id="m-again">Otro reparto</button>
        <button class="btn btn-ghost" id="m-out">Salir</button>
      </div>
    `);
    $('#m-again').onclick = () => { closeModal(); nuevaPartida(); };
    $('#m-out').onclick = () => { closeModal(); renderSetup(); };
  }, 520);
}

function confirmarNueva() {
  if (!S.mov) { nuevaPartida(); return; }
  openModal(`
    <h3>¿Otro reparto?</h3>
    <p>Se pierde la mano en curso.</p>
    <div class="m-actions">
      <button class="btn btn-primary" id="m-si">Sí, repartir</button>
      <button class="btn btn-soft" id="m-no">Seguir jugando</button>
    </div>
  `, closeModal);
  $('#m-si').onclick = () => { closeModal(); nuevaPartida(); };
  $('#m-no').onclick = closeModal;
}

/* ═══ «¿Queda salida?» ════════════════════════════════════════════════
   El mismo resolutor que aprobó el reparto, ahora desde la posición actual
   y con menos cuerda. Si se queda sin nodos lo dice: no inventa. */
const TOPE_UI = 30000;

function revisarSalida() {
  if (!S.est) return;
  const b = $('#t-salida');
  if (b) { b.disabled = true; b.textContent = 'Buscando…'; }
  aviso('Buscando salida…');
  setTimeout(() => {
    if (!$('#mesa')) return;
    const legales = jugadas(S.est, S.celdas).length;
    const r = legales ? resolverDesde(S.est, S.celdas, TOPE_UI) : null;
    if (!$('#mesa')) return;
    if ($('#t-salida')) { $('#t-salida').disabled = false; $('#t-salida').textContent = '¿Queda salida?'; }
    if (!legales) { aviso('No queda ninguna jugada legal: toca Deshacer', true); return; }
    if (!r) return;
    if (r.gano) aviso(`Sí, todavía se gana desde aquí (${r.nodos} posiciones miradas)`);
    else if (r.tope) aviso('No lo sé: la búsqueda se quedó sin cuerda', true);
    else aviso('Desde aquí ya no se puede ganar: deshaz unas jugadas', true);
  }, 30);
}

window.addEventListener('resize', () => {
  if (!$('#mesa')) return;
  const antes = S.CW;
  medidas();
  if (antes !== S.CW) renderPlay();
});

renderSetup();
</script>
