const TODOS = Object.entries(SECCIONES).flatMap(([sect, js]) => js.map((j) => [sect, ...j]));

let alt = false;
function tarjeta([dir, id, nombre, sub]) {
  alt = !alt;
  const marca = store.get(id + '.hub', null);
  return `<a class="gcard" href="juegos/${dir}/" data-id="${id}" data-buscar="${esc(norm(nombre + ' ' + sub))}">
    <div class="gi ${alt ? '' : 'alt'}"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[id]}</svg></div>
    <div class="gn">${nombre}</div>
    <div class="gs">${sub}</div>
    <div class="gb">${marca ? esc(marca) : 'Sin marcas aún'}</div>
  </a>`;
}

for (const [sect, juegos] of Object.entries(SECCIONES)) {
  document.getElementById(sect).innerHTML = juegos.map(tarjeta).join('');
}

/* ── Seguir jugando: los últimos que abriste ─────────────────────────── */
function pintaRecientes() {
  const ids = store.get('hub.recientes', []);
  const cont = $('#s-recientes'), titulo = $('#t-recientes');
  const juegos = ids.map((id) => TODOS.find((j) => j[2] === id)).filter(Boolean).slice(0, 4);
  if (!juegos.length) { cont.style.display = 'none'; titulo.style.display = 'none'; return; }
  cont.innerHTML = juegos.map(([, ...j]) => tarjeta(j)).join('');
  cont.style.display = ''; titulo.style.display = '';
}
pintaRecientes();

document.addEventListener('click', (e) => {
  const a = e.target.closest('.gcard');
  if (!a) return;
  const id = a.dataset.id;
  const prev = store.get('hub.recientes', []).filter((x) => x !== id);
  store.set('hub.recientes', [id, ...prev].slice(0, 8));
});

/* ── Buscador: filtra sin tildes ni mayúsculas ───────────────────────── */
const buscador = $('#buscador'), campo = $('#q');
function filtrar() {
  const q = norm(campo.value);
  buscador.classList.toggle('lleno', !!campo.value);
  let visibles = 0;
  $$('.gcard').forEach((c) => {
    const ok = !q || c.dataset.buscar.includes(q);
    c.style.display = ok ? '' : 'none';
    if (ok) visibles++;
  });
  // con búsqueda activa se ocultan los títulos de sección y «seguir jugando»
  $$('.sect').forEach((s) => s.classList.toggle('oculta', !!q));
  $('#s-recientes').classList.toggle('oculta', !!q);
  $$('.gcards').forEach((g) => {
    if (g.id === 's-recientes') return;
    const algo = Array.from(g.children).some((c) => c.style.display !== 'none');
    g.classList.toggle('oculta', !!q && !algo);
  });
  $('#sinnada').style.display = q && !visibles ? '' : 'none';
}
campo.oninput = filtrar;
$('#q-limpiar').onclick = () => { campo.value = ''; filtrar(); campo.focus(); };
