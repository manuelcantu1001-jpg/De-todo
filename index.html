<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FFF6EC" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="description" content="Encadena — el juego de las terminaciones. Palabras encadenadas por su final (o su inicio), para dos, contra la app o en solitario." />
<title>Encadena · El juego de las terminaciones</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23FF6A3D'/%3E%3Ctext x='32' y='44' font-size='34' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3E‑E%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ── Temas ─────────────────────────────────────────────────────────── */
  #enc[data-theme="limpio"] {
    --font: 'Space Grotesk', system-ui, sans-serif;
    --title-font: 'Space Grotesk', system-ui, sans-serif;
    --title-track: -0.03em;
    --bg: #F6F7F5; --card: #FFFFFF; --soft: #EEF0EC;
    --ink: #15171C; --bg-ink: #15171C; --sub: #6B7280; --bg-sub: #6B7280; --faint: #A0A6AE;
    --accent: #3B5BFF; --accent-ink: #FFFFFF; --accent-soft: #E9EDFF;
    --second: #E8590C; --second-soft: #FFEFE4;
    --good: #178A57; --bad: #DC4233; --border: #E5E7E2; --line: #E5E7E2;
    --radius: 18px; --seg-bg: #EEF0EC;
    --tile-bg: #15171C; --tile-ink: #FFFFFF; --tile-border: transparent;
    --shadow: 0 1px 2px rgba(20,24,40,.05), 0 8px 24px rgba(20,24,40,.06);
    --toggle-off: #D7D9D4;
  }
  #enc[data-theme="fieltro"] {
    --font: 'DM Sans', system-ui, sans-serif;
    --title-font: 'DM Serif Display', Georgia, serif;
    --title-track: 0;
    --bg: #163A2B; --card: #FBF4E4; --soft: #12301F;
    --ink: #1D2B22; --bg-ink: #FBF4E4; --sub: #5E6E63; --bg-sub: rgba(251,244,228,.6); --faint: rgba(251,244,228,.55);
    --accent: #E0A23D; --accent-ink: #22150A; --accent-soft: #F4E7C8;
    --second: #3FA76A; --second-soft: #DCEEE2;
    --good: #3FA76A; --bad: #D2604F; --border: #E7D9BF; --line: rgba(251,244,228,.14);
    --radius: 10px; --seg-bg: #EFE2C2;
    --tile-bg: #F3E5C2; --tile-ink: #1D2B22; --tile-border: #C9A85F;
    --shadow: 0 2px 0 rgba(0,0,0,.18), 0 10px 26px rgba(0,0,0,.28);
    --toggle-off: rgba(251,244,228,.28);
  }
  #enc[data-theme="calido"] {
    --font: 'Fredoka', system-ui, sans-serif;
    --title-font: 'Fredoka', system-ui, sans-serif;
    --title-track: -0.01em;
    --bg: #FFF6EC; --card: #FFFFFF; --soft: #FFEDDD;
    --ink: #2A2622; --bg-ink: #2A2622; --sub: #8A7E72; --bg-sub: #8A7E72; --faint: #BCAE9F;
    --accent: #FF6A3D; --accent-ink: #FFFFFF; --accent-soft: #FFE6DA;
    --second: #1F8A6B; --second-soft: #DDF0E8;
    --good: #1F8A6B; --bad: #E0483D; --border: #F2E3D3; --line: #F2E3D3;
    --radius: 22px; --seg-bg: #FFEDDD;
    --tile-bg: #FF6A3D; --tile-ink: #FFFFFF; --tile-border: transparent;
    --shadow: 0 2px 4px rgba(120,70,40,.06), 0 12px 30px rgba(120,70,40,.12);
    --toggle-off: #E8DACB;
  }

  /* ── Base ──────────────────────────────────────────────────────────── */
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; height: 100%; }
  #enc {
    background: var(--bg); color: var(--bg-ink); font-family: var(--font);
    transition: background .25s; min-height: 100dvh;
  }
  #enc[data-theme="fieltro"] {
    background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 4px 4px;
  }
  #app {
    max-width: 480px; margin: 0 auto; height: 100dvh; position: relative;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  button { font-family: var(--font); }
  input { font-family: var(--font); }

  .scroll { flex: 1; overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; }

  /* ── Átomos ────────────────────────────────────────────────────────── */
  .btn {
    border: none; cursor: pointer; font-weight: 600; font-size: 17px;
    border-radius: 999px; padding: 16px 22px; width: 100%;
    transition: transform .12s, opacity .15s; letter-spacing: -0.2px;
  }
  .btn:active { transform: scale(.975); }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); }
  .btn-soft { background: var(--accent-soft); color: var(--accent); }
  #enc[data-theme="fieltro"] .btn-soft { color: #8a6420; }
  .btn-ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .btn-danger-ghost { background: transparent; color: var(--bad); border: 1.5px solid color-mix(in srgb, var(--bad) 25%, transparent); }

  .card { background: var(--card); border-radius: calc(var(--radius) + 4px); box-shadow: var(--shadow); }

  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 0; border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row-title { font-size: 16px; font-weight: 600; color: var(--ink); }
  .row-hint { font-size: 12.5px; color: var(--sub); margin-top: 2px; }

  .seg { display: flex; gap: 6px; background: var(--seg-bg); padding: 4px; border-radius: calc(var(--radius) * .72); }
  .seg button {
    flex: 1; border: none; cursor: pointer; padding: 10px 4px; border-radius: calc(var(--radius) * .55);
    font-weight: 600; font-size: 13.5px; background: transparent; color: var(--sub); transition: all .15s;
  }
  .seg button.sel { background: var(--card); color: var(--accent); box-shadow: var(--shadow); }
  #enc[data-theme="fieltro"] .seg button.sel { color: #8a6420; }
  .seg button:disabled { opacity: .55; cursor: default; }
  .seg button .pronto { display: block; font-size: 9px; font-weight: 600; opacity: .8; }

  .stepper { display: flex; align-items: center; gap: 12px; }
  .stepper button {
    width: 40px; height: 40px; border-radius: calc(var(--radius) * .6); border: 1.5px solid var(--border);
    background: var(--card); color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer; font-weight: 600;
  }
  .stepper button:disabled { color: var(--faint); cursor: default; }
  .stepper .val { min-width: 48px; text-align: center; font-weight: 700; font-size: 19px; color: var(--ink); }

  .toggle {
    width: 52px; height: 31px; border-radius: 999px; border: none; cursor: pointer; padding: 2px;
    background: var(--toggle-off); display: flex; justify-content: flex-start; transition: background .2s;
  }
  .toggle.on { background: var(--accent); justify-content: flex-end; }
  .toggle .knob { width: 27px; height: 27px; border-radius: 999px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); }

  .field {
    width: 100%; padding: 16px 18px; font-size: 17px; font-weight: 600;
    border-radius: var(--radius); border: 1.5px solid var(--border);
    background: var(--card); color: var(--ink); outline: none;
  }
  .field:focus { border-color: var(--accent); }
  .field::placeholder { color: var(--faint); font-weight: 500; }

  .label-sm {
    font-size: 12.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--bg-sub); margin-bottom: 8px; padding-left: 4px;
  }

  /* ── Setup ─────────────────────────────────────────────────────────── */
  .setup { padding: max(28px, env(safe-area-inset-top)) 22px 28px; }
  .brand { text-align: center; margin: 20px 0 18px; }
  .brand h1 {
    margin: 0; font-family: var(--title-font); font-size: 40px; font-weight: 700;
    color: var(--bg-ink); letter-spacing: var(--title-track); line-height: 1;
  }
  .brand .tag { font-size: 13.5px; color: var(--bg-sub); margin-top: 4px; font-weight: 500; }
  .brand .howto {
    background: none; border: none; color: var(--accent); font-weight: 600; font-size: 13.5px;
    cursor: pointer; margin-top: 8px; padding: 4px 8px;
  }
  #enc[data-theme="fieltro"] .brand .howto { color: var(--accent); }

  .themes { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; }
  .theme-dot {
    width: 40px; height: 40px; border-radius: 999px; cursor: pointer; padding: 0;
    border: 2.5px solid transparent; position: relative; overflow: hidden;
  }
  .theme-dot.sel { border-color: var(--accent); }
  .theme-dot span { position: absolute; inset: 0; }
  .theme-dot .half { clip-path: polygon(0 0, 100% 0, 0 100%); }

  .start-hint { font-size: 13px; color: var(--bg-sub); margin-top: 8px; padding-left: 4px; min-height: 18px; }
  .start-hint b { color: var(--accent); }
  .start-hint .few { color: var(--bad); font-weight: 600; }

  /* ── Play ──────────────────────────────────────────────────────────── */
  .play-head { padding: max(18px, env(safe-area-inset-top)) 20px 14px; text-align: center; position: relative; }
  .play-head .quit {
    position: absolute; left: 14px; top: max(18px, env(safe-area-inset-top)); width: 36px; height: 36px;
    border-radius: 999px; border: none; cursor: pointer; font-size: 16px; font-weight: 600;
    background: color-mix(in srgb, var(--bg-ink) 8%, transparent); color: var(--bg-ink);
  }
  .play-head .kicker {
    font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--bg-sub); margin-bottom: 10px;
  }
  .ending-plain { font-family: var(--title-font); font-weight: 700; color: var(--bg-ink); line-height: 1; display: inline-flex; align-items: baseline; }
  .ending-plain .dash { color: var(--faint); font-size: 30px; }
  .ending-plain .sfx { font-size: 52px; letter-spacing: -1px; }
  .ending-pill {
    display: inline-flex; align-items: baseline; gap: 2px; background: var(--accent-soft); color: var(--accent);
    padding: 10px 22px; border-radius: 999px; font-weight: 600;
  }
  .ending-pill .dash { font-size: 20px; opacity: .7; }
  .ending-pill .sfx { font-size: 32px; letter-spacing: 1px; }
  .ending-tiles { display: flex; gap: 6px; justify-content: center; }
  .ending-tiles .tile {
    width: 44px; height: 50px; border-radius: 6px; background: var(--tile-bg); color: var(--tile-ink);
    border: 1px solid var(--tile-border); box-shadow: 0 3px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.5);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--title-font); font-size: 28px; font-weight: 700;
  }

  .turnbar {
    display: flex; align-items: center; justify-content: space-between; margin: 0 16px 10px;
    padding: 10px 16px; border-radius: 999px; background: color-mix(in srgb, var(--bg-ink) 7%, transparent);
  }
  #enc[data-theme="fieltro"] .turnbar { background: rgba(251,244,228,.1); }
  .turnbar .who { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: var(--bg-ink); }
  .turnbar .dot { width: 9px; height: 9px; border-radius: 999px; background: var(--accent); }
  .turnbar .right { display: flex; align-items: center; gap: 12px; }
  .turnbar .clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; color: var(--bg-ink); }
  .turnbar .clock.low { color: var(--bad); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .hearts { display: flex; gap: 4px; }
  .hearts svg { display: block; }
  .hearts .lost { opacity: .25; }
  .hearts .just-lost { animation: heartPop .5s ease; }
  @keyframes heartPop { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }

  .chain { padding: 4px 16px 8px; display: flex; flex-direction: column; gap: 8px; }
  .bubble-row { display: flex; }
  .bubble-row.left { justify-content: flex-start; }
  .bubble-row.right { justify-content: flex-end; }
  .bubble {
    max-width: 80%; background: var(--card); border-radius: var(--radius); padding: 11px 16px;
    box-shadow: var(--shadow); animation: popIn .25s ease;
  }
  @keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
  .bubble .by { font-size: 10.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 1px; }
  .bubble .word { font-size: 19px; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
  .bubble .note { font-size: 11px; color: var(--sub); margin-top: 2px; }
  .bubble.think { color: var(--sub); font-style: italic; font-size: 15px; }

  .dock { padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--border); }
  #enc[data-theme="fieltro"] .dock { background: transparent; border-top: 1px solid var(--line); }
  .dock .msg { font-size: 13.5px; font-weight: 600; margin-bottom: 8px; text-align: center; min-height: 18px; }
  .dock .msg.ok { color: var(--good); }
  .dock .msg.err { color: var(--bad); }
  .dock .msg.check { color: var(--sub); }
  #enc[data-theme="fieltro"] .dock .msg.check { color: var(--faint); }
  .dock .line { display: flex; gap: 8px; }
  .dock input { flex: 1; min-width: 0; padding: 14px 16px; font-size: 17px; }
  .dock input.shake { animation: shake .4s; }
  @keyframes shake { 0%,100% { transform: none; } 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
  .dock .send {
    width: 52px; flex-shrink: 0; border-radius: var(--radius); border: none;
    background: var(--accent); color: var(--accent-ink); font-size: 22px; cursor: pointer;
  }
  .dock .send:disabled { opacity: .45; cursor: default; }
  .dock .giveup {
    width: 100%; margin-top: 8px; background: none; border: none; color: var(--bad);
    font-weight: 600; font-size: 14.5px; cursor: pointer; padding: 6px;
  }
  .dock .waiting { text-align: center; color: var(--bg-sub); font-size: 15px; padding: 14px 0; }

  /* ── End ───────────────────────────────────────────────────────────── */
  .end { padding: max(40px, env(safe-area-inset-top)) 24px 28px; text-align: center; }
  .end .kicker { font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .end h2 {
    margin: 0; font-family: var(--title-font); font-size: 36px; font-weight: 700;
    color: var(--bg-ink); line-height: 1.08; letter-spacing: var(--title-track);
  }
  .end .why { font-size: 15px; color: var(--bg-sub); margin-top: 10px; }
  .scoreboard {
    display: inline-flex; align-items: center; gap: 16px; margin-top: 20px;
    background: var(--card); border-radius: 999px; padding: 12px 24px; box-shadow: var(--shadow);
  }
  .scoreboard .num { font-family: var(--title-font); font-size: 26px; font-weight: 700; color: var(--ink); line-height: 1; }
  .scoreboard .num.win { color: var(--accent); }
  .scoreboard .lbl { font-size: 11px; font-weight: 600; color: var(--sub); margin-top: 2px; }
  .scoreboard .sep { color: var(--faint); font-weight: 700; }
  .stats { display: flex; gap: 12px; margin: 24px 0; }
  .stats .stat { flex: 1; background: var(--card); border-radius: var(--radius); padding: 18px 8px; box-shadow: var(--shadow); }
  .stats .n { font-family: var(--title-font); font-size: 28px; font-weight: 700; color: var(--accent); }
  #enc[data-theme="fieltro"] .stats .n { color: #8a6420; }
  .stats .l { font-size: 12.5px; color: var(--sub); margin-top: 2px; font-weight: 500; }
  .recap {
    background: var(--card); border-radius: calc(var(--radius) + 2px); padding: 6px 18px;
    box-shadow: var(--shadow); text-align: left; max-height: 200px; overflow-y: auto;
  }
  .recap .r { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .recap .r:last-child { border-bottom: none; }
  .recap .w { font-size: 15.5px; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
  .recap .b { font-size: 12.5px; color: var(--sub); align-self: center; flex-shrink: 0; }
  .end .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .end .again-hint { font-size: 12.5px; color: var(--bg-sub); margin-top: -2px; }
  .record { display: inline-block; margin-top: 14px; font-size: 14px; font-weight: 700; color: var(--good); }

  /* ── Modal ─────────────────────────────────────────────────────────── */
  #modal { position: fixed; inset: 0; z-index: 50; display: none; }
  #modal.open { display: block; }
  #modal .veil { position: absolute; inset: 0; background: rgba(10,14,12,.5); animation: fadeIn .2s; }
  #modal .sheet {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 100%; max-width: 480px; background: var(--card);
    border-radius: calc(var(--radius) + 6px) calc(var(--radius) + 6px) 0 0;
    padding: 24px 22px calc(24px + env(safe-area-inset-bottom));
    animation: sheetUp .28s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes sheetUp { from { transform: translate(-50%, 40px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  #modal h3 { margin: 0 0 8px; font-family: var(--title-font); font-size: 22px; color: var(--ink); letter-spacing: var(--title-track); }
  #modal p { margin: 0 0 12px; font-size: 15px; line-height: 1.5; color: var(--sub); }
  #modal p b { color: var(--ink); }
  #modal .m-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  #modal .m-word { font-size: 24px; font-weight: 700; color: var(--ink); text-align: center; margin: 6px 0 10px; }
  #modal .m-word .hi { color: var(--accent); }

  /* ── Confeti ───────────────────────────────────────────────────────── */
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 80; overflow: hidden; }
  .confetti i {
    position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(105vh) rotate(720deg); opacity: .9; }
  }
</style>
</head>
<body>
<div id="enc" data-theme="calido">
  <div id="app"></div>
  <div id="modal" role="dialog" aria-modal="true"></div>
</div>

<script src="dicc-es.js"></script>
<script>
'use strict';

/* ── Utilidades ──────────────────────────────────────────────────────── */
const $ = (sel, root) => (root || document).querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const delay = (ms) => new Promise((r) => setTimeout(r, ms));
const vibrate = (pat) => { try { navigator.vibrate && navigator.vibrate(pat); } catch (e) {} };

// Normaliza para comparar: minúsculas, sin tildes/diéresis, conservando la ñ.
const norm = (s) => (s || '').toLowerCase()
  .replace(/ñ/g, '\u0001')
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/\u0001/g, 'ñ')
  .replace(/[^a-zñ]/g, '');

const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

/* ── Diccionario ─────────────────────────────────────────────────────── */
const Dicc = (() => {
  const list = [];               // [{w, n, rank}] por frecuencia
  const map = new Map();         // norm -> {w, rank}
  function init() {
    if (!window.DICC_ES) return;
    const arr = window.DICC_ES.split('\n');
    for (let i = 0; i < arr.length; i++) {
      const w = arr[i]; if (!w) continue;
      const n = norm(w);
      if (!map.has(n)) map.set(n, { w, rank: i });
      list.push({ w, n, rank: i });
    }
  }
  const ready = () => list.length > 0;
  const has = (n) => map.has(n);
  function candidates(affix, match, usedSet, maxRank) {
    const out = [];
    for (const e of list) {
      if (e.rank >= maxRank) break;
      if (e.n.length <= affix.length) continue;
      if (match === 'inicio' ? !e.n.startsWith(affix) : !e.n.endsWith(affix)) continue;
      if (usedSet.has(e.n)) continue;
      out.push(e);
    }
    return out;
  }
  function countFor(affix, match) {
    let c = 0;
    for (const e of list) {
      if (e.n.length <= affix.length) continue;
      if (match === 'inicio' ? e.n.startsWith(affix) : e.n.endsWith(affix)) c++;
    }
    return c;
  }
  function randomCommon(minLen) {
    if (!ready()) return null;
    const top = Math.min(list.length, 9000);
    for (let i = 0; i < 60; i++) {
      const e = list[200 + Math.floor(Math.random() * (top - 200))];
      if (e && e.n.length >= minLen) return e.w;
    }
    return null;
  }
  init();
  return { ready, has, candidates, countFor, randomCommon };
})();

/* Palabras de arranque con encanto, por si el diccionario no carga. */
const SEED = ['faustino', 'corazón', 'mariposa', 'tornillo', 'escarabajo', 'melodía', 'naranja', 'relámpago',
  'bicicleta', 'ventanal', 'sombrero', 'aguacate', 'pingüino', 'calendario', 'caracol', 'castillo',
  'montaña', 'farola', 'pelota', 'camino', 'botella', 'canela', 'molino', 'laguna'];

/* ── Árbitro IA opcional (si el entorno ofrece window.claude) ────────── */
const AI = {
  available: () => !!(window.claude && window.claude.complete),
  async exists(word) {
    try {
      const out = await window.claude.complete(
        `Eres árbitro de un juego de palabras en español. ¿«${word}» es válida? ` +
        `Cuenta como válida: cualquier palabra del español (incluye conjugaciones, plurales, diminutivos) ` +
        `y nombres propios reales (apellidos, ciudades, países, nombres de personas conocidas). ` +
        `Responde SOLO JSON: {"valida": true|false, "nota": "máx 4 palabras"}.`
      );
      const m = String(out).match(/\{[\s\S]*\}/);
      if (!m) return null;
      const j = JSON.parse(m[0]);
      return { valid: !!j.valida, nota: j.nota || '' };
    } catch (e) { return null; }
  },
};

/* ── Estado ──────────────────────────────────────────────────────────── */
const DIFF_RANK = { facil: 6000, normal: 16000, experta: Infinity };
const PLAYER_LABEL = { A: 'Jugador 1', B: 'Jugador 2', tu: 'Tú', app: 'App' };

const S = {
  theme: store.get('enc.theme', 'calido'),
  phase: 'setup',
  cfg: null,
  suffix: '',
  chain: [],       // [{word, by, note}]
  turn: 'A',
  lives: {},
  scores: {},
  round: 1,
  result: null,    // {loser, reason}
};
const P = { time: 0, tick: null, busy: false, thinking: false };

const defCfg = {
  mode: '2p', match: 'fin', suffixLen: 3,
  livesOn: true, lives: 3, timerOn: false, timerSec: 15,
  difficulty: 'normal', start: '',
};
let setupCfg = Object.assign({}, defCfg, store.get('enc.cfg', {}));
setupCfg.start = '';

/* ── Tema ────────────────────────────────────────────────────────────── */
const THEME_META = {
  limpio: { label: 'Limpio', bg: '#F6F7F5', accent: '#3B5BFF' },
  fieltro: { label: 'Fieltro', bg: '#163A2B', accent: '#E0A23D' },
  calido: { label: 'Cálido', bg: '#FFF6EC', accent: '#FF6A3D' },
};
function applyTheme(id) {
  S.theme = THEME_META[id] ? id : 'calido';
  const encEl = document.getElementById('enc');
  if (encEl) encEl.dataset.theme = S.theme;
  const meta = $('meta[name="theme-color"]');
  if (meta) meta.content = THEME_META[S.theme].bg;
  store.set('enc.theme', S.theme);
}

/* ── Reglas ──────────────────────────────────────────────────────────── */
const isPre = () => S.cfg.match === 'inicio';
const reasonFor = (p, kind) => p === 'tu'
  ? { tiempo: 'se te acabó el tiempo', vidas: 'te quedaste sin vidas', rindio: 'te rendiste' }[kind]
  : { tiempo: 'agotó su tiempo', vidas: 'se quedó sin vidas', rindio: 'se rindió' }[kind];
const affixOf = (word, cfg) => {
  const n = norm(word);
  return cfg.match === 'inicio' ? n.slice(0, cfg.suffixLen) : n.slice(-cfg.suffixLen);
};
const matchesAffix = (n) => isPre() ? n.startsWith(S.suffix) : n.endsWith(S.suffix);
const usedSet = () => new Set(S.chain.map((c) => norm(c.word)));
const playerOrder = () => S.cfg.mode === '2p' ? ['A', 'B'] : S.cfg.mode === 'app' ? ['tu', 'app'] : ['tu'];
const nextPlayer = (p) => { const o = playerOrder(); return o[(o.indexOf(p) + 1) % o.length]; };
const playerColor = (p) => (p === 'A' || p === 'tu') ? 'var(--accent)' : 'var(--second)';

function randomStart(cfg) {
  if (Dicc.ready()) {
    for (let i = 0; i < 80; i++) {
      const w = Dicc.randomCommon(cfg.suffixLen + 2);
      if (!w) break;
      const a = affixOf(w, cfg);
      if (Dicc.candidates(a, cfg.match, new Set([norm(w)]), 16000).length >= 8) return w;
    }
  }
  return SEED[Math.floor(Math.random() * SEED.length)];
}

function begin(cfg, opts = {}) {
  S.cfg = cfg;
  S.suffix = affixOf(cfg.start, cfg);
  const seedBy = opts.seedBy || (cfg.mode === '2p' ? 'A' : 'tu');
  S.chain = [{ word: cap(cfg.start.trim()), by: seedBy, seed: true }];
  S.turn = opts.firstTurn || (cfg.mode === '2p' ? 'B' : cfg.mode === 'app' ? 'app' : 'tu');
  S.lives = {};
  for (const p of playerOrder()) S.lives[p] = cfg.lives;
  if (!opts.keepScore) { S.scores = {}; for (const p of playerOrder()) S.scores[p] = 0; S.round = 1; }
  S.result = null;
  P.busy = false; P.thinking = false;
  S.phase = 'play';
  render();
  if (S.turn === 'app') appTurn();
  else startTimer();
}

function endRound(loser, reason) {
  stopTimer();
  P.thinking = false;
  S.result = { loser, reason };
  if (S.cfg.mode !== 'solo') {
    const winner = playerOrder().find((p) => p !== loser);
    if (winner) S.scores[winner] = (S.scores[winner] || 0) + 1;
  }
  let newRecord = false;
  if (S.cfg.mode === 'solo') {
    const streak = S.chain.length - 1;
    const best = store.get('enc.best', 0);
    if (streak > best) { store.set('enc.best', streak); newRecord = streak > 0; }
    S.result.newRecord = newRecord;
  }
  S.phase = 'end';
  render();
  const humanWon = S.cfg.mode === '2p' ? true : S.cfg.mode === 'app' ? loser === 'app' : newRecord;
  if (humanWon) { confetti(); vibrate([30, 60, 30]); }
}

function anotherRound() {
  const cfg = Object.assign({}, S.cfg, { start: randomStart(S.cfg) });
  const loser = S.result ? S.result.loser : playerOrder()[0];
  const winner = playerOrder().find((p) => p !== loser) || loser;
  S.round += 1;
  begin(cfg, { keepScore: true, seedBy: winner, firstTurn: S.cfg.mode === 'solo' ? 'tu' : loser });
}

/* ── Timer ───────────────────────────────────────────────────────────── */
function startTimer() {
  stopTimer();
  if (!S.cfg || !S.cfg.timerOn || S.phase !== 'play' || S.turn === 'app') return;
  P.time = S.cfg.timerSec;
  updateTimerUI();
  P.tick = setInterval(() => {
    if (P.busy || P.thinking) return;
    P.time -= 1;
    updateTimerUI();
    if (P.time <= 0) { stopTimer(); onTimeout(); }
  }, 1000);
}
function stopTimer() { if (P.tick) { clearInterval(P.tick); P.tick = null; } }
function updateTimerUI() {
  const el = $('#clock');
  if (!el) return;
  el.textContent = P.time + 's';
  el.classList.toggle('low', P.time <= 5);
}
function onTimeout() {
  vibrate(80);
  if (S.cfg.livesOn) {
    const dead = loseLife(S.turn);
    if (!dead) { setMsg('err', '¡Se acabó el tiempo! Pierdes una vida'); startTimer(); }
    else endRound(S.turn, reasonFor(S.turn, 'tiempo'));
  } else {
    endRound(S.turn, reasonFor(S.turn, 'tiempo'));
  }
}

/* ── Vidas ───────────────────────────────────────────────────────────── */
function loseLife(p) {
  S.lives[p] = (S.lives[p] ?? 0) - 1;
  updateHearts(true);
  return S.lives[p] <= 0;
}

/* ── Turno de la app ─────────────────────────────────────────────────── */
async function appTurn() {
  P.thinking = true;
  showThinking(true);
  const used = usedSet();
  const maxRank = DIFF_RANK[S.cfg.difficulty] || DIFF_RANK.normal;
  let word = null;
  if (Dicc.ready()) {
    const cands = Dicc.candidates(S.suffix, S.cfg.match, used, maxRank);
    if (cands.length) {
      // sesgo hacia palabras comunes, sin ser predecible
      const idx = Math.floor(Math.pow(Math.random(), 1.6) * cands.length);
      word = cands[idx].w;
    }
  }
  if (!word && AI.available()) {
    try {
      const where = isPre() ? `que empiece exactamente con «${S.suffix}»` : `que termine exactamente en «${S.suffix}»`;
      const out = await window.claude.complete(
        `Dame UNA sola palabra en español ${where}. No uses ninguna de estas: ${[...used].join(', ')}. ` +
        `Responde SOLO la palabra en minúsculas, sin puntuación.`
      );
      const w = String(out || '').trim().split(/\s+/)[0].replace(/[^A-Za-zÁÉÍÓÚÜáéíóúüñÑ]/g, '');
      if (w && matchesAffix(norm(w)) && !used.has(norm(w))) word = w;
    } catch (e) {}
  }
  await delay(650 + Math.random() * 900);
  P.thinking = false;
  if (S.phase !== 'play') return;
  showThinking(false);
  if (!word) { endRound('app', 'no encontró más palabras'); return; }
  pushWord(word, 'app', null);
  S.turn = 'tu';
  updateTurnBar();
  renderDock();
  startTimer();
}

/* ── Jugada humana ───────────────────────────────────────────────────── */
function pushWord(word, by, note) {
  S.chain.push({ word: cap(String(word).trim()), by, note });
  appendChainItem(S.chain.length - 1);
}

async function submitWord() {
  const input = $('#draft');
  if (!input || P.busy) return;
  const raw = input.value.trim();
  if (!raw) return;
  const n = norm(raw);
  if (!n) return;
  if (!matchesAffix(n)) {
    rejectWord(isPre() ? `No empieza con ${S.suffix}‑` : `No termina en ‑${S.suffix}`);
    return;
  }
  if (usedSet().has(n)) { rejectWord('Esa palabra ya se dijo'); return; }

  if (Dicc.has(n)) { acceptWord(raw, null); return; }

  // No está en el diccionario del juego
  if (S.cfg.mode === '2p') { openJudge(raw); return; }

  if (AI.available()) {
    P.busy = true;
    setMsg('check', 'Comprobando…');
    const res = await AI.exists(raw);
    P.busy = false;
    if (S.phase !== 'play') return;
    if (res && res.valid) { acceptWord(raw, res.nota || 'Válida según la IA'); return; }
    if (res && !res.valid) { rejectWord(res.nota ? `No válida · ${res.nota}` : 'Esa palabra no parece existir'); return; }
  }
  rejectWord('No está en el diccionario del juego');
}

function acceptWord(raw, note) {
  const by = S.turn;
  pushWord(raw, by, note);
  const input = $('#draft');
  if (input) input.value = '';
  const send = $('#send');
  if (send) send.disabled = true;
  if (S.cfg.mode === 'solo') { updateTurnBar(); startTimer(); }
  else {
    S.turn = nextPlayer(by);
    updateTurnBar();
    renderDock();
    if (S.turn === 'app') { stopTimer(); appTurn(); }
    else startTimer();
  }
  setMsg('ok', note ? `¡Válida! · ${note}` : '¡Válida!');
  setTimeout(() => { if (S.phase === 'play') setMsg(null); }, 1600);
}

function rejectWord(text) {
  vibrate(60);
  const input = $('#draft');
  if (input) { input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake'); }
  if (S.cfg.livesOn) {
    const dead = loseLife(S.turn);
    setMsg('err', text + ' · −1 vida');
    if (dead) { setTimeout(() => endRound(S.turn, reasonFor(S.turn, 'vidas')), 650); return; }
  } else {
    setMsg('err', text);
  }
}

/* ── Juez rival (2 jugadores, palabra fuera del diccionario) ─────────── */
function openJudge(raw) {
  P.busy = true;
  const rival = PLAYER_LABEL[nextPlayer(S.turn)];
  const k = S.suffix.length;
  const d = cap(raw.trim());
  const hi = isPre()
    ? `<span class="hi">${esc(d.slice(0, k))}</span>${esc(d.slice(k))}`
    : `${esc(d.slice(0, -k))}<span class="hi">${esc(d.slice(-k))}</span>`;
  openModal(`
    <h3>¿Se acepta?</h3>
    <div class="m-word">${hi}</div>
    <p>No está en el diccionario del juego. <b>${esc(rival)}</b> decide: los nombres propios reales
    (personas, apellidos, lugares) también valen.</p>
    <div class="m-actions">
      <button class="btn btn-primary" id="j-yes">Sí, vale</button>
      <button class="btn btn-danger-ghost" id="j-no">No existe</button>
    </div>
  `);
  $('#j-yes').onclick = () => { closeModal(); P.busy = false; acceptWord(raw, 'Aceptada por ' + rival); };
  $('#j-no').onclick = () => { closeModal(); P.busy = false; rejectWord('Rechazada por ' + rival); };
}

/* ── UI: modal ───────────────────────────────────────────────────────── */
function openModal(html, onVeil) {
  const m = $('#modal');
  m.innerHTML = `<div class="veil"></div><div class="sheet">${html}</div>`;
  m.classList.add('open');

}
function closeModal() {

}

function openRules() {

    <h3>Cómo se juega</h3>

function confirmQuit() {

    <div class="m-actions">

    </div>
  `, () => { closeModal(); P.busy = false; });
  $('#q-yes').onclick = () => { closeModal(); stopTimer(); S.phase = 'setup'; S.cfg = null; render(); };
  $('#q-no').onclick = () => { closeModal(); P.busy = false; };
}

/* ── UI: confeti ─────────────────────────────────────────────────────── */
function confetti() {
  const cs = getComputedStyle(document.getElementById('enc'));
  const colors = [cs.getPropertyValue('--accent').trim(), cs.getPropertyValue('--second').trim(),
    cs.getPropertyValue('--good').trim(), '#F3C64B', '#7A9CF5'];
  const c = document.createElement('div');
  c.className = 'confetti';
  let html = '';
  for (let i = 0; i < 70; i++) {
    const left = Math.random() * 100;
    const dur = 2 + Math.random() * 1.8;
    const del = Math.random() * .6;
    const col = colors[i % colors.length];
    html += `<i style="left:${left}%;background:${col};animation-duration:${dur}s;animation-delay:${del}s"></i>`;
  }
  c.innerHTML = html;
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 4600);
}

/* ── UI: pantalla de ajustes ─────────────────────────────────────────── */
function segHTML(id, options, value) {
  return `<div class="seg" id="${id}">` + options.map((o) =>
    `<button data-v="${o.v}" class="${o.v === value ? 'sel' : ''}" ${o.off ? 'disabled' : ''}>` +
    `${o.label}${o.off ? `<span class="pronto">${typeof o.off === 'string' ? o.off : 'pronto'}</span>` : ''}</button>`).join('') + `</div>`;
}
function stepperHTML(id, value, fmt) {
  return `<div class="stepper" id="${id}">
    <button data-d="-1" aria-label="menos">−</button>
    <div class="val">${fmt ? fmt(value) : value}</div>
    <button data-d="1" aria-label="más">+</button>
  </div>`;
}
function toggleHTML(id, on) {
  return `<button class="toggle ${on ? 'on' : ''}" id="${id}" role="switch" aria-checked="${on}"><span class="knob"></span></button>`;
}

    if (Dicc.ready()) {
      const count = Dicc.countFor(a, c.match);
      extra = count < 5 ? ` · <span class="few">solo ${count} en el diccionario</span>`
        : ` · ${count} palabras posibles`;
    }
    hint.innerHTML = (c.match === 'inicio' ? 'Inicio: ' : 'Terminación: ') + `<b>${esc(shown)}</b>` + extra;
  };
  input.oninput = refreshHint;
  input.onkeydown = (e) => { if (e.key === 'Enter' && !go.disabled) startFromSetup(false); };
  refreshHint();
  go.onclick = () => startFromSetup(false);
  $('#go-random').onclick = () => startFromSetup(true);
}

function startFromSetup(random) {
  const c = setupCfg;
  const start = random ? randomStart(c) : c.start.trim();
  if (!start || norm(start).length <= c.suffixLen) return;
  begin(Object.assign({}, c, { start }));
}

/* ── UI: pantalla de juego ───────────────────────────────────────────── */
function endingHTML() {
  const sfx = S.suffix;
  const pre = isPre();
  const style = S.theme === 'fieltro' ? 'tiles' : S.theme === 'calido' ? 'pill' : 'plain';
  if (style === 'tiles') {
    return `<div class="ending-tiles">` +
      sfx.toUpperCase().split('').map((ch) => `<div class="tile">${esc(ch)}</div>`).join('') + `</div>`;
  }
  const dash = `<span class="dash">‑</span>`;
  const body = `<span class="sfx">${esc(sfx)}</span>`;
  const inner = pre ? body + dash : dash + body;
  return `<div class="${style === 'pill' ? 'ending-pill' : 'ending-plain'}">${inner}</div>`;
}

function heartsHTML(total, left) {
  let h = '<div class="hearts" id="hearts">';
  for (let i = 0; i < total; i++) {
    const lost = i >= left;
    h += `<svg class="${lost ? 'lost' : ''}" width="18" height="18" viewBox="0 0 24 24">
      <path d="M12 21s-7.5-4.9-10-9.2C.6 9 1.4 5.6 4.3 4.6 6.3 3.9 8.4 4.7 12 8c3.6-3.3 5.7-4.1 7.7-3.4 2.9 1 3.7 4.4 2.3 7.2C19.5 16.1 12 21 12 21z"
        fill="${lost ? 'none' : 'var(--bad)'}" stroke="var(--bad)" stroke-width="1.6"/></svg>`;
  }
  return h + '</div>';
}

function chainItemHTML(c, i) {
  const mine = c.by === 'A' || c.by === 'tu';
  const col = playerColor(c.by);
  const k = S.suffix.length;
  const w = c.word;
  const hi = isPre()
    ? `<span style="color:${col}">${esc(w.slice(0, k))}</span>${esc(w.slice(k))}`
    : `${esc(w.slice(0, -k))}<span style="color:${col}">${esc(w.slice(-k))}</span>`;
  return `<div class="bubble-row ${mine ? 'left' : 'right'}">
    <div class="bubble" style="border-${mine ? 'left' : 'right'}: 3px solid ${col}">
      <div class="by" style="color:${col}">${c.seed ? 'Inicio · ' : ''}${PLAYER_LABEL[c.by]}</div>
      <div class="word">${hi}</div>
      ${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}
    </div>
  </div>`;
}

function renderPlay() {
  const app = $('#app');
  app.innerHTML = `
  <div class="screen">
    <div class="play-head">
      <button class="quit" id="quit" aria-label="Abandonar partida">✕</button>
      <div class="kicker">${isPre() ? 'Empieza con' : 'Termina en'}</div>
      ${endingHTML()}
    </div>
    <div class="turnbar">
      <div class="who"><span class="dot" id="turn-dot"></span><span id="turn-label"></span></div>
      <div class="right">
        <span id="hearts-slot"></span>
        ${S.cfg.timerOn ? '<span class="clock" id="clock"></span>' : ''}
      </div>
    </div>
    <div class="scroll chain" id="chain">
      ${S.chain.map((c, i) => chainItemHTML(c, i)).join('')}
    </div>
    <div class="dock" id="dock"></div>
  </div>`;
  $('#quit').onclick = confirmQuit;
  updateTurnBar();
  renderDock();
  scrollChain();
}

function updateTurnBar() {
  const lbl = $('#turn-label'), dot = $('#turn-dot');
  if (!lbl) return;
  if (S.cfg.mode === 'solo') {
    lbl.textContent = `Racha: ${S.chain.length - 1}`;
    dot.style.background = 'var(--accent)';
  } else {
    lbl.textContent = S.turn === 'tu' ? 'Tu turno' : S.turn === 'app' ? 'Turno de la app' : 'Turno de ' + PLAYER_LABEL[S.turn];
    dot.style.background = playerColor(S.turn);
  }
  updateHearts(false);
}

function updateHearts(justLost) {
  const slot = $('#hearts-slot');
  if (!slot) return;
  if (!S.cfg.livesOn) { slot.innerHTML = ''; return; }
  slot.innerHTML = heartsHTML(S.cfg.lives, Math.max(0, S.lives[S.turn] ?? S.cfg.lives));
  if (justLost) {
    const svgs = slot.querySelectorAll('svg');
    const idx = Math.max(0, S.lives[S.turn] ?? 0);
    if (svgs[idx]) svgs[idx].classList.add('just-lost');
  }
}

function renderDock() {
  const dock = $('#dock');
  if (!dock) return;
  if (S.turn === 'app') {
    dock.innerHTML = `<div class="msg" id="msg"></div><div class="waiting">Esperando a la app…</div>`;
    return;
  }
  const ph = isPre() ? `palabra con ${S.suffix}‑` : `palabra en ‑${S.suffix}`;
  dock.innerHTML = `
    <div class="msg" id="msg"></div>
    <div class="line">
      <input id="draft" class="field" placeholder="${esc(ph)}" autocapitalize="none" autocomplete="off"
        autocorrect="off" spellcheck="false" enterkeyhint="send" />
      <button class="send" id="send" aria-label="Enviar palabra" disabled>↑</button>
    </div>
    <button class="giveup" id="giveup">No me la sé · me rindo</button>`;
  const input = $('#draft'), send = $('#send');
  input.oninput = () => { send.disabled = !input.value.trim() || P.busy; };
  input.onkeydown = (e) => { if (e.key === 'Enter') submitWord(); };
  send.onclick = submitWord;
  $('#giveup').onclick = () => endRound(S.turn, S.cfg.mode === 'solo' ? 'fin de la racha' : reasonFor(S.turn, 'rindio'));
  setTimeout(() => { try { input.focus({ preventScroll: true }); } catch (e) {} }, 60);
}

function setMsg(type, text) {
  const el = $('#msg');
  if (!el) return;
  if (!type) { el.className = 'msg'; el.innerHTML = ''; return; }
  el.className = 'msg ' + type;
  el.innerHTML = (type === 'check' ? '<span style="margin-right:6px">◌</span>' : '') + esc(text);
}

function appendChainItem(i) {
  const chain = $('#chain');
  if (!chain) return;
  chain.insertAdjacentHTML('beforeend', chainItemHTML(S.chain[i], i));
  scrollChain();
}

function showThinking(on) {
  const chain = $('#chain');
  if (!chain) return;
  const cur = $('#thinking');
  if (on && !cur) {
    chain.insertAdjacentHTML('beforeend',
      `<div class="bubble-row right" id="thinking"><div class="bubble think">La app piensa…</div></div>`);
    scrollChain();
  } else if (!on && cur) cur.remove();
}

function scrollChain() {
  const chain = $('#chain');
  if (chain) chain.scrollTop = chain.scrollHeight;
}

/* ── UI: pantalla final ──────────────────────────────────────────────── */
function renderEnd() {
  const app = $('#app');
  const cfg = S.cfg, r = S.result;
  const solo = cfg.mode === 'solo';
  const order = playerOrder();
  const winner = order.find((p) => p !== r.loser);
  let title, why;
  const reasonLine = r.loser === 'tu' ? cap(r.reason)
    : r.loser === 'app' ? 'La app ' + r.reason
    : `${PLAYER_LABEL[r.loser]} ${r.reason}`;
  if (solo) {
    title = `Aguantaste ${S.chain.length - 1}`;
    why = (S.chain.length - 1) === 1 ? 'palabra' : 'palabras seguidas';
  } else if (cfg.mode === 'app') {
    title = r.loser === 'app' ? '¡Ganaste!' : 'Ganó la app';
    why = reasonLine;
  } else {
    title = r.loser === 'A' ? 'Ganó el Jugador 2' : 'Ganó el Jugador 1';
    why = reasonLine;
  }
  const affixShown = isPre() ? S.suffix + '‑' : '‑' + S.suffix;
  const best = store.get('enc.best', 0);

  app.innerHTML = `
  <div class="screen end scroll">
    <div class="kicker">Fin de la ${solo ? 'racha' : 'partida'}${S.round > 1 ? ` · Ronda ${S.round}` : ''}</div>
    <h2>${esc(title)}</h2>
    <div class="why">${esc(why)}</div>
    ${solo
      ? (r.newRecord ? `<span class="record">🏆 ¡Nueva mejor racha!</span>`
        : (best > 0 ? `<div class="why" style="margin-top:6px">Tu mejor racha: ${best}</div>` : ''))
      : `<div class="scoreboard">${order.map((p, i) => `
          ${i === 1 ? '<span class="sep">–</span>' : ''}
          <div><div class="num ${p === winner ? 'win' : ''}">${S.scores[p] || 0}</div>
          <div class="lbl">${PLAYER_LABEL[p]}</div></div>`).join('')}
        </div>`}
    <div class="stats">
      <div class="stat"><div class="n">${S.chain.length}</div><div class="l">palabras</div></div>
      <div class="stat"><div class="n">${esc(affixShown)}</div><div class="l">${isPre() ? 'inicio' : 'terminación'}</div></div>
    </div>
    <div class="recap">
      ${S.chain.map((c) => `<div class="r"><span class="w">${esc(c.word)}</span>
        <span class="b">${c.seed ? 'inicio' : PLAYER_LABEL[c.by]}</span></div>`).join('')}
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="again">Otra ronda</button>
      <div class="again-hint">${solo ? 'Palabra nueva al azar' : 'Palabra nueva · empieza quien perdió'}</div>
      ${navigator.share ? '<button class="btn btn-soft" id="share">Compartir resultado</button>' : ''}
      <button class="btn btn-ghost" id="newgame">Cambiar ajustes</button>
    </div>
  </div>`;

  $('#again').onclick = anotherRound;
  $('#newgame').onclick = () => { S.phase = 'setup'; S.cfg = null; render(); };
  const share = $('#share');
  if (share) share.onclick = () => {
    const words = S.chain.map((c) => c.word).join(' → ');
    const head = solo ? `Encadené ${S.chain.length - 1} palabras en ${affixShown}` : `${title} con ${affixShown} (${S.chain.length} palabras)`;
    try { navigator.share({ title: 'Encadena', text: `${head} 🔗\n${words}\n¿Te atreves?` }); } catch (e) {}
  };
}

/* ── Render raíz ─────────────────────────────────────────────────────── */
function render() {
  closeModal();
  if (S.phase === 'setup') renderSetup();
  else if (S.phase === 'play') renderPlay();
  else renderEnd();
}

applyTheme(S.theme);
render();
</script>
</body>
</html>
