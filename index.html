    ['ahorcado', 'ahorcado', 'Ahorcado', 'Letra a letra'],
    ['anagrama', 'ana', 'Anagramas', 'Ordena las letras'],
    ['acomoda', 'aco', 'Acomoda-palabras', 'Que todas crucen bien'],
  ],
  's-numeros': [
    ['sudoku', 'sud', 'Sudoku', 'El clásico de números'],
    ['cifras', 'cif', 'Cifras', 'Opera hasta el objetivo'],
    ['nonograma', 'nono', 'Nonograma', 'Pinta y revela el dibujo'],
    ['kakuro', 'kak', 'Kakuro', 'El crucigrama de sumas'],
    ['buscaminas', 'mina', 'Buscaminas', 'Despeja sin explotar'],
    ['naval', 'naval', 'Batalla naval', 'Deduce dónde está la flota'],
    ['2048', 'm2048', '2048', 'Suma hasta la ficha grande'],
  ],
  's-mesa': [
    ['memorama', 'memo', 'Memorama', 'Encuentra las parejas'],
    ['gato', 'gato', 'Gato', 'Tres en raya, con app rival'],
    ['conecta4', 'c4', 'Conecta 4', 'Cuatro en línea'],
    ['damas', 'damas', 'Damas', 'Comer es obligatorio'],
    ['solitario', 'sol', 'Solitario', 'Las 52 a su lugar'],
  ],
  's-arcade': [
    ['serpiente', 'serp', 'Serpiente', 'Come, crece, no te muerdas'],
    ['simon', 'simon', 'Simón', 'Repite la secuencia'],
    ['laberinto', 'lab', 'Laberinto', 'Encuentra la salida'],
  ],
};

let alt = false;
for (const [sect, juegos] of Object.entries(SECCIONES)) {
  const cont = document.getElementById(sect);
  cont.innerHTML = juegos.map(([dir, id, nombre, sub]) => {
    alt = !alt;
    const marca = store.get(id + '.hub', null);
    return `<a class="gcard" href="juegos/${dir}/">
      <div class="gi ${alt ? '' : 'alt'}"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[id]}</svg></div>
      <div class="gn">${nombre}</div>
      <div class="gs">${sub}</div>
      <div class="gb">${marca ? esc(marca) : 'Sin marcas aún'}</div>
    </a>`;
  }).join('');
}
</script>
<script id="sw-reg">
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
