<body>
<div id="app"></div>
<script>
/* ============ ReParte · app estática (PWA) ============
   El organizador administra; el grupo consulta sin registro.
   Copias locales (#e=...) y conexión opcional a Supabase (#live=...).
*/
const FX_DEFAULT = 18.4;
const LS = 'reparte.v1';
const $ = (s, r=document) => r.querySelector(s);
const uid = () => crypto.randomUUID();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMXN = c => '$ ' + (c/100).toLocaleString('es-MX', {minimumFractionDigits: (c%100)?2:0, maximumFractionDigits:2});
const fmtCur = (c, cur) => (cur==='USD' ? 'US$ ' : '$ ') + (c/100).toLocaleString('es-MX', {minimumFractionDigits:(c%100)?2:0, maximumFractionDigits:2});
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => { const [y,m,dd]=d.split('-'); return `${+dd} ${['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+m-1]}`; };

/* ---------- estado ---------- */
let syncTimer;
let db = load();
// Existing browser data stays local; imported links never confer management rights.
const legacyFees=Object.values(db.events).some(ev=>ev.expenses.some(e=>e.isFee && e.history?.includes('Cuota del evento, repartida entre todos')));
if(legacyFees){
  try{ localStorage.setItem('reparte.before-fee-fix',JSON.stringify(db));
    Object.values(db.events).forEach(ev=>{ev.expenses=ev.expenses.filter(e=>!(e.isFee && e.history?.includes('Cuota del evento, repartida entre todos')));ev.fee=null;});
  }catch(e){ /* Keep original data if the recovery copy cannot be stored. */ }
}
Object.values(db.events).forEach(ev => { ev.role ||= 'owner'; ev.organizerId ||= ev.meId || ev.members[0]?.id; });
function load(){ try { return JSON.parse(localStorage.getItem(LS)) || {events:{}, profile:{name:'', clabe:'', bank:''}}; } catch(e){ return {events:{}, profile:{name:'',clabe:'',bank:''}}; } }
function persist(){ try { localStorage.setItem(LS, JSON.stringify(db)); return true; } catch(e){ toast('No se pudo guardar en este navegador. Descarga un respaldo antes de salir.'); return false; } }
function save(){ persist(); scheduleSync(); }
const canManage = ev => ev?.role === 'owner' && (!ev.sync?.ownerId || ev.sync.ownerId === cloud.session?.user?.id);
function undoAllowed(ev, allowClosed=false){
  if(db.events[ev.id]!==ev){toast('La cuenta cambió; revisa la versión actual.');return false;}
  return guard(ev,allowClosed);
}
function guard(ev, allowClosed=false){
  if(ui.externalDb){toast('Hay cambios en otra pestaña. Cancela la captura para cargar esa versión; tu borrador sigue visible.');return false;}
  if(!canManage(ev)){ toast('Solo el organizador puede modificar esta cuenta.'); return false; }
  if(ev.sync?.conflict){ toast('Hay otra versión. Resuelve el conflicto antes de editar.'); return false; }
  if(ev.closed && !allowClosed){ toast('Reabre el evento antes de cambiar los gastos.'); return false; }
  return true;
}

/* ---------- dinero ---------- */
const toMXN = e => e.cur==='USD' ? Math.round(e.amt * e.fx) : e.amt;   // centavos
// Reparte en centavos; el centavo huérfano se le carga al que pagó (decisión de redondeo).
function shares(e){
  const total = toMXN(e), n = e.among.length, base = Math.floor(total/n); let rest = total - base*n;
  const out = {}; e.among.forEach(id => out[id] = base);
  const order = [e.payerId, ...e.among.filter(id=>id!==e.payerId)];
  for (const id of order){ if(!rest) break; if(id in out){ out[id] += 1; rest--; } }
  return out;
}
function balancesFrom(ev, payments){
  const b = {}; ev.members.forEach(m => b[m.id] = 0);
  ev.expenses.forEach(e => { if(!(e.payerId in b)) return; b[e.payerId] += toMXN(e); const sh = shares(e); for(const id in sh) if(id in b) b[id] -= sh[id]; });
  payments.forEach(p => { if(p.from in b && p.to in b){ b[p.from] += p.amt; b[p.to] -= p.amt; } });
  return b;
}
const balances = ev => balancesFrom(ev, ev.payments);
// El plan de transferencias sale de los gastos (estable); los pagos se descuentan por pareja
// para que un pago parcial no reacomode quién le paga a quién. Si un pago no encaja en el plan
// (porque entraron gastos nuevos), se dobla en los saldos y se replanea.
function transfers(ev){
  const plan = greedy(balancesFrom(ev, []));
  const paid = {};
  for(const p of ev.payments){
    const key = p.from+'>'+p.to;
    const tr = plan.find(t=>t.from===p.from && t.to===p.to);
    paid[key] = (paid[key]||0) + p.amt;
    if(!tr || paid[key]>tr.amt) return greedy(balances(ev)).map(t=>({...t,paid:0}));
  }
  return plan.map(t=>({...t, paid:paid[t.from+'>'+t.to]||0, amt:t.amt-(paid[t.from+'>'+t.to]||0)})).filter(t=>t.amt>0);
}
// Liquidación simplificada (no garantiza el mínimo matemático): deudores contra acreedores, de mayor a menor.
function greedy(b){
  const debt=[], cred=[];
  for (const id in b){ if(b[id] < -0) debt.push({id, v:-b[id]}); else if(b[id] > 0) cred.push({id, v:b[id]}); }
  debt.sort((a,c)=>c.v-a.v); cred.sort((a,c)=>c.v-a.v);
  const out=[]; let i=0,j=0;
  while(i<debt.length && j<cred.length){ const x=Math.min(debt[i].v,cred[j].v); if(x>0) out.push({from:debt[i].id,to:cred[j].id,amt:x}); debt[i].v-=x; cred[j].v-=x; if(debt[i].v<=0)i++; if(cred[j].v<=0)j++; }
  return out;
}
const total = ev => ev.expenses.reduce((a,e)=>a+toMXN(e),0);
// "Promedio por persona": el promedio de lo que le tocó a cada quien (con subgrupos no es total/n).
function perHead(ev){ const n=ev.members.length||1; return Math.round(total(ev)/n); }

/* ---------- eventos ---------- */
function newEvent(name){
  const id = uid();
  const ev = { id, role:'owner', name, createdAt: today(), closed:false, members:[], expenses:[], payments:[], meId:null, fx:FX_DEFAULT, fxDate: today(), fee:null };
  db.events[id] = ev; save(); return ev;
}
function me(ev){ return ev.members.find(m=>m.id===ev.meId) || null; }
function nameOf(ev, id){ const m = ev.members.find(m=>m.id===id); if(!m) return '—'; return m.id===ev.meId ? 'Tú' : m.name; }
function initial(s){ return (s||'?').trim()[0].toUpperCase(); }
function addMember(ev, name, isMe){
  const m = { id: uid(), name: name.trim(), clabe: isMe ? (db.profile.clabe||'') : '', bank: isMe ? (db.profile.bank||'') : '' };
  ev.members.push(m); if(isMe && !ev.organizerId) ev.organizerId=m.id; if(isMe){ ev.meId = m.id; db.profile.name = m.name; } save(); return m;
}

/* ---------- compartir (link con copia del evento) ---------- */
const b64u = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c=>c.charCodeAt(0));
async function pipe(bytes, Ctor, kind){ if(!Ctor) return null; const st = new Ctor(kind); const w = st.writable.getWriter(); w.write(bytes); w.close(); return new Uint8Array(await new Response(st.readable).arrayBuffer()); }
// Formato: 'z' + base64url(deflate-raw(JSON)) o 'j' + base64url(JSON) si el navegador no comprime.
const shareCache = new Map(), sharePending = new Map();
async function encodeEvent(ev){
  const copy = publicEvent(ev);
  const raw = new TextEncoder().encode(JSON.stringify(copy));
  const z = await pipe(raw, self.CompressionStream, 'deflate-raw').catch(()=>null);
  return z ? 'z'+b64u(z) : 'j'+b64u(raw);
}
async function decodeEvent(s){
  try { const bytes = unb64u(s.slice(1)); const raw = s[0]==='z' ? await pipe(bytes, self.DecompressionStream, 'deflate-raw') : bytes; return JSON.parse(new TextDecoder().decode(raw)); } catch(e){ return null; }
}
// shareURL es síncrono para el render: usa la última codificación calculada y la refresca en segundo plano.
function shareURL(ev){
  if(ev.sync?.token){ const u=new URL(location.href); u.search=''; u.hash='live='+ev.sync.token; return u.toString(); }
  const key = JSON.stringify(publicEvent(ev));
  const u = new URL(location.href); u.search=''; 
  const c = shareCache.get(ev.id);
  if (!c || c.key !== key){
    if(sharePending.get(ev.id)!==key){
      sharePending.set(ev.id,key);
      encodeEvent(ev).then(enc=>{if(sharePending.get(ev.id)===key){sharePending.delete(ev.id);shareCache.set(ev.id,{key,enc});if(route.screen==='invitar')render();}}).catch(()=>sharePending.delete(ev.id));
    }
    return '';
  }
  u.hash = '#e=' + c.enc; return u.toString();
}

/* ---------- utilidades ---------- */
async function copy(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){ const t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(_){ } t.remove(); return ok; }
}
const wa = text => 'https://wa.me/?text=' + encodeURIComponent(text);
function fmtClabe(c){ return (c||'').replace(/\D/g,'').slice(0,18).replace(/(\d{3})(\d{3})(\d{0,11})(\d{0,1})/, (m,a,b,c,d)=>[a,b,c,d].filter(Boolean).join(' ')); }
const BANKS = {'002':'Banamex','012':'BBVA','014':'Santander','019':'Banjército','021':'HSBC','030':'Bajío','036':'Inbursa','042':'Mifel','044':'Scotiabank','058':'Banregio','059':'Invex','060':'Bansi','062':'Afirme','072':'Banorte','127':'Azteca','137':'BanCoppel','138':'ABC Capital','143':'CIBanco','646':'STP','659':'ASP','661':'Klar','710':'Nvio','722':'Mercado Pago','723':'Cuenca','728':'Stori','846':'STP'};
const bankOf = c => BANKS[(c||'').replace(/\D/g,'').slice(0,3)] || '';

/* ---------- toast con deshacer ---------- */
let toastT = null, undoFn = null;
function toast(msg, undo){
  clearTimeout(toastT); undoFn = undo || null;
  let el = $('#toast'); if(el) el.remove();
  el = document.createElement('div'); el.id='toast'; el.className='toast'; el.setAttribute('role','status');
  el.innerHTML = `<span>${esc(msg)}</span>${undo?'<button data-act="undo">Deshacer</button>':''}<div class="bar"></div>`;
  document.body.appendChild(el);
  toastT = setTimeout(()=>{ el.remove(); undoFn=null; }, 3200);
}

/* ---------- router ---------- */
let route = {}, ui = { sheet:null, cap:null, pendingAfterName:null, nameDraft:'' };
function go(path){ location.hash = path; }
function parseRoute(){
  const h = location.hash || '#/';
  if(h.startsWith('#live=')){ openLive(h.slice(6)); return {screen:'home'}; }
  if (h.startsWith('#e=')){ // link compartido: importar copia (async)
    decodeEvent(h.slice(3)).then(importEvent); return { screen:'home' };
  }
  const p = h.slice(2).split('/').filter(Boolean);
  if (p[0]==='e' && db.events[p[1]]) return { screen: p[2]||'event', id:p[1] };
  if (p[0]==='nuevo') return { screen:'new' };
  if (p[0]==='conectar') return {screen:'conectar'};
  if (p[0]==='perfil') return { screen:'profile' };
  return { screen:'home' };
}
function importEvent(input){
  try {
    const ev=validateEvent(input); const old=db.events[ev.id];
    if(old && old.role==='owner'){ toast('Tu cuenta original se conserva. El enlace es una copia de consulta.'); go('#/e/'+ev.id); return; }
    ev.role='viewer'; ev.meId=old?.meId||null;
    db.events[ev.id]=ev; persist(); go('#/e/'+ev.id); toast('Copia de consulta. El organizador lleva la cuenta.');
  } catch(e){ toast('Ese enlace no contiene un evento válido.'); go('#/'); }
}
function publicEvent(ev){
  return {id:ev.id,name:ev.name,createdAt:ev.createdAt,closed:!!ev.closed,closedAt:ev.closedAt||null,
    organizerId:ev.organizerId||null,fx:ev.fx||FX_DEFAULT,fee:null,
    members:ev.members.map(m=>({id:m.id,name:m.name})),
    expenses:ev.expenses.map(e=>({id:e.id,title:e.title,amt:e.amt,cur:e.cur,fx:e.fx,payerId:e.payerId,among:[...e.among],date:e.date,history:[...(e.history||[])]})),
    payments:ev.payments.map(p=>({id:p.id,from:p.from,to:p.to,amt:p.amt,at:p.at,recordedBy:p.recordedBy||null}))};
}
function validateEvent(input){
  const ev=structuredClone(input), idOK=x=>typeof x==='string' && /^[a-zA-Z0-9_-]{1,80}$/.test(x);
  const dateOK=x=>typeof x==='string' && /^\d{4}-\d{2}-\d{2}$/.test(x) && !isNaN(Date.parse(x));
  const cents=x=>Number.isSafeInteger(x) && x>0 && x<=100000000000;
  if(!ev || (ev.closedAt!=null && !dateOK(ev.closedAt)) || !Number.isFinite(ev.fx) || ev.fx<=0 || ev.fx>10000 || !idOK(ev.id) || typeof ev.name!=='string' || !ev.name.trim() || ev.name.length>100 || !dateOK(ev.createdAt) || !Array.isArray(ev.members) || !ev.members.length || ev.members.length>200 || !Array.isArray(ev.expenses) || ev.expenses.length>5000 || !Array.isArray(ev.payments) || ev.payments.length>5000) throw Error('Evento inválido');
  const ids=new Set(); for(const m of ev.members){ if(!idOK(m.id)||ids.has(m.id)||typeof m.name!=='string'||!m.name.trim()||m.name.length>100) throw Error('Participante inválido'); ids.add(m.id); }
  const expenseIds=new Set(); let sum=0;
  for(const e of ev.expenses){
    if(!idOK(e.id)||expenseIds.has(e.id)||typeof e.title!=='string'||e.title.length>200||!cents(e.amt)||!['MXN','USD'].includes(e.cur)||!Number.isFinite(e.fx)||e.fx<=0||e.fx>10000||!ids.has(e.payerId)||!Array.isArray(e.among)||!e.among.length||new Set(e.among).size!==e.among.length||e.among.some(id=>!ids.has(id))||!dateOK(e.date)) throw Error('Gasto inválido');
    expenseIds.add(e.id); sum+=toMXN(e); if(!Number.isSafeInteger(sum)) throw Error('Total fuera de rango');
    e.history=Array.isArray(e.history)?e.history.filter(h=>typeof h==='string').slice(-100):[];
  }
  const paymentIds=new Set(); for(const p of ev.payments){ if(!idOK(p.id)||paymentIds.has(p.id)||!ids.has(p.from)||!ids.has(p.to)||p.from===p.to||!cents(p.amt)||!dateOK(p.at)) throw Error('Pago inválido'); paymentIds.add(p.id); }
  if(ev.organizerId && !ids.has(ev.organizerId)) throw Error('Organizador inválido');
  return publicEvent(ev);
}
function personTotals(ev,id){
  return {paid:ev.expenses.filter(e=>e.payerId===id).reduce((s,e)=>s+toMXN(e),0),
    share:ev.expenses.reduce((s,e)=>s+(shares(e)[id]||0),0),
    sent:ev.payments.filter(p=>p.from===id).reduce((s,p)=>s+p.amt,0),
    received:ev.payments.filter(p=>p.to===id).reduce((s,p)=>s+p.amt,0)};
}

/* ---------- render ---------- */
function render(){
  route = parseRoute();
  const ev = route.id ? db.events[route.id] : null;
  const app = $('#app');
  const views = { home, new: newScreen, profile, conectar: connectionScreen, event: eventScreen, invitar: invite, nuevo: capture, cierre: settle, resumen: summary, editar: capture };
  const html = (views[route.screen] || home)(ev); if (!html) return;
  const key = route.screen + (route.id||'');
  app.innerHTML = (key !== render.last ? html.replace('class="screen"', 'class="screen anim"') : html) + (ui.sheet ? sheet(ev) : '');
  render.last = key;
  const f = $('[autofocus]'); if (f) setTimeout(()=>f.focus(), 50);
}

/* ---------- sheets ---------- */
function sheet(ev){

  }
  else if(s.type==='viewer'){
    inner=`<h2 class="h2">¿Qué cuenta quieres ver?</h2><p class="sub">Elegir un nombre solo cambia la vista. No permite editar ni confirma tu identidad.</p><div class="chips">${ev.members.map(m=>`<button class="chip" data-claim="${m.id}">${esc(m.name)}</button>`).join('')}</div>`;

    ${Ill('entrar',64)}<h2 class="h2">¿Cómo te llamas?</h2>

    ${ev.members.length ? `<div class="lbl" style="margin-top:14px">¿Eres alguien de la lista?</div><div class="chips" style="margin-top:8px">${ev.members.map(m=>`<button class="chip" data-claim="${m.id}">${esc(m.name)}</button>`).join('')}</div><div class="lbl" style="margin-top:14px">O agrégate</div>`:''}

    <form id="f-member"><div class="field"><input name="name" placeholder="Nombre" autofocus maxlength="30" autocomplete="off"></div>
    <button class="btn primary" style="margin-top:12px" type="submit">Agregar</button></form>`;
  else if (s.type==='fx') inner = `
    ${Ill('peso-dolar',64)}<h2 class="h2">Tipo de cambio</h2>
    <p class="sub">Se guarda en este gasto. El de hoy, no el de mañana: así los totales no cambian solos.</p>
    <form id="f-fx"><div class="field"><div class="lbl">Pesos por dólar</div><input name="fx" inputmode="decimal" value="${ui.cap.fx}" autofocus></div>
    <button class="btn primary" style="margin-top:12px" type="submit">Usar este</button></form>`;
  else if (s.type==='pay'){
    const tr = transfers(ev)[s.i]; if(!tr) { ui.sheet=null; return ''; }
    const to = ev.members.find(m=>m.id===tr.to); const clabe = fmtClabe(to.clabe); const bank = to.bank || bankOf(to.clabe);
    const concept = `${ev.name} · ReParte`;
    const iReceive = tr.to===ev.meId, iPay = tr.from===ev.meId;
    const msg = `Hola ${to.id===ev.meId?nameOf(ev,tr.from):to.name}, del ${ev.name} ${iPay?'te debo':'quedaron'} ${fmtMXN(tr.amt)}.${clabe&&iReceive?` Mi CLABE: ${clabe}${bank?' ('+bank+')':''}. Concepto: ${concept}.`:''} Lo puedes ver en ReParte: ${shareURL(ev)}`;
    inner = `
    ${Ill('copiar-clabe',64)}<div class="lbl">${esc(nameOf(ev,tr.from))} le paga a</div>
    <h2 class="h2" style="margin-top:2px">${esc(nameOf(ev,tr.to))}</h2>

      ${bank?`<div class="kv"><span>Banco</span><b>${esc(bank)}</b></div>`:''}

  }

    const tr = transfers(ev)[s.i]; if(!tr){ ui.sheet=null; return ''; }
    inner = `<h2 class="h2">¿Cuánto pagó?</h2><p class="sub">Debe ${fmtMXN(tr.amt)}. Lo que falte sigue visible.</p>
    <form id="f-partial" data-i="${s.i}"><div class="field"><div class="lbl">Monto en MXN</div><input name="amt" inputmode="decimal" placeholder="1,000" autofocus></div>

  }
  return `<div class="backdrop" data-act="close-sheet"><div class="sheet"><div class="handle"></div>${inner}</div></div>`;
}

/* ---------- acciones ---------- */
function requireName(ev, fn){ if (ev.meId && me(ev)) fn(); else { ui.pendingAfterName = fn; ui.sheet = {type:'name'}; render(); } }
function startCapture(ev, exp){
  if(!guard(ev)) return;
  const meId = ev.meId;
  ui.cap = exp ? { editId: exp.id, amount: (exp.amt/100).toString(), cur: exp.cur, fx: exp.fx||ev.fx, payerId: exp.payerId, among: exp.among.slice(), date: exp.date, title: exp.title==='Gasto'?'':exp.title, splitOpen:false, history: exp.history||[] }
    : { editId:null, amount:'', cur:'MXN', fx: ev.fx||FX_DEFAULT, payerId: meId, among: smartDefault(ev), date: today(), title:'', splitOpen:false };
  go(`#/e/${ev.id}/${exp?'editar':'nuevo'}`);
}
// Default inteligente: si los últimos dos gastos fueron entre las mismas personas, sugiere esas.
function smartDefault(ev){
  const all = ev.members.map(m=>m.id); const last = ev.expenses.slice(-2);
  if (last.length===2 && last[0].among.length<all.length && JSON.stringify([...last[0].among].sort())===JSON.stringify([...last[1].among].sort())) return last[0].among.filter(id=>all.includes(id));
  return all;
}
function saveCapture(ev){
  if(!guard(ev)) return;
  const c = ui.cap; if(!c) return; const cents = Math.round(parseFloat(c.amount||'0')*100); if(!Number.isSafeInteger(cents) || !(cents>0) || !c.among.length || !Number.isFinite(c.fx) || c.fx<=0 || c.fx>10000 || !/^\d{4}-\d{2}-\d{2}$/.test(c.date) || isNaN(Date.parse(c.date))) { toast('Revisa el monto, la fecha y el tipo de cambio.'); return; }
  const who = me(ev)?.name || 'Alguien';
  if (c.editId){
    const e = ev.expenses.find(x=>x.id===c.editId); if(!e){toast('El gasto ya no existe. Vuelve a la cuenta.'); return;} const before = {...e};
    Object.assign(e, { title: c.title.trim()||'Gasto', amt: cents, cur: c.cur, fx: c.fx, payerId: c.payerId, among: c.among.slice(), date: c.date });
    e.history = [...(e.history||[]), `${who} editó el ${fmtDate(today())}: ${fmtCur(before.amt,before.cur)} → ${fmtCur(cents,c.cur)}`];
    save(); ui.cap=null; go('#/e/'+ev.id); toast('Gasto actualizado', ()=>{ if(!undoAllowed(ev)) return; Object.assign(e, before); save(); render(); });
  } else {
    const e = { id: uid(), title: c.title.trim()||'Gasto', amt: cents, cur: c.cur, fx: c.fx, payerId: c.payerId, among: c.among.slice(), date: c.date, history:[`${who} lo capturó el ${fmtDate(today())}`] };
    ev.expenses.push(e); ev.fx = c.fx; save(); ui.cap=null; go('#/e/'+ev.id);
    toast(`Gasto guardado · ${fmtCur(cents,c.cur)}`, ()=>{ if(!undoAllowed(ev)) return; ev.expenses = ev.expenses.filter(x=>x.id!==e.id); save(); render(); });
  }
}
function markPaid(ev, i, amt){
  if(!guard(ev,true) || !ev.closed){ toast('Cierra la cuenta antes de confirmar pagos.'); return; }
  if(amt!==undefined && (!Number.isSafeInteger(amt)||amt<=0)) return;
  const tr = transfers(ev)[i]; if(!tr) return;
  const p = { id: uid(), from: tr.from, to: tr.to, amt: Math.min(amt ?? tr.amt, tr.amt), at: today(), recordedBy:ev.organizerId };
  ev.payments.push(p); save(); ui.sheet=null; render();
  toast(p.amt<tr.amt ? `Pago parcial de ${fmtMXN(p.amt)} marcado` : 'Marcado como pagado', ()=>{ if(!undoAllowed(ev,true)) return; ev.payments = ev.payments.filter(x=>x.id!==p.id); save(); render(); });
}

/* ---------- imagen del resumen ---------- */
async function shareImage(ev){
  const W=1080, H=Math.max(1350,1100+transfers(ev).length*96); const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d');
  try { await document.fonts.load('80px "Instrument Serif"'); await document.fonts.load('600 32px Inter'); } catch(e){}
  x.fillStyle='#F6F1E9'; x.fillRect(0,0,W,H);
  x.fillStyle='#C4552F'; [[0,44],[1,44],[2,44],[3,44]].forEach(([i])=>{ x.fillRect(80+i*22, 120-44, 14, 44); });
  x.fillStyle='#8A837B'; x.font='500 26px Inter, sans-serif'; x.fillText(ev.closed?'EVENTO CERRADO · REPARTE':'CUENTA PROVISIONAL · REPARTE', 80, 200);
  x.fillStyle='#1C1917'; x.font='96px "Instrument Serif", Georgia, serif'; x.fillText(ev.name, 80, 300);
  const n=ev.members.length||1; const trs=transfers(ev);
  const rows=[['Total', fmtMXN(total(ev))],['Promedio por persona', fmtMXN(perHead(ev))],['Gastos', String(ev.expenses.length)],['Personas', String(n)]];
  let y=400; rows.forEach(([k,v])=>{ x.fillStyle='#fff'; rr(x,80,y,W-160,110,24); x.fill(); x.strokeStyle='#E6DFD3'; x.lineWidth=2; x.stroke(); x.fillStyle='#6B6560'; x.font='500 28px Inter, sans-serif'; x.fillText(k,110,y+66); x.fillStyle='#1C1917'; x.font='56px "Instrument Serif", Georgia, serif'; x.textAlign='right'; x.fillText(v,W-110,y+72); x.textAlign='left'; y+=124; });
  y+=30; x.fillStyle='#8A837B'; x.font='500 26px Inter, sans-serif'; x.fillText(trs.length?`${trs.length} TRANSFERENCIA${trs.length===1?'':'S'} PENDIENTE${trs.length===1?'':'S'}`:'TODO LIQUIDADO', 80, y); y+=30;
  trs.forEach(tr=>{ x.fillStyle='#1C1917'; x.font='500 34px Inter, sans-serif'; x.fillText(`${nameOf(ev,tr.from)} → ${nameOf(ev,tr.to)}`,80,y+52); x.font='48px "Instrument Serif", Georgia, serif'; x.textAlign='right'; x.fillText(fmtMXN(tr.amt),W-80,y+56); x.textAlign='left'; x.fillStyle='#E6DFD3'; x.fillRect(80,y+80,W-160,2); y+=96; });
  x.fillStyle='#8A837B'; x.font='400 24px Inter, sans-serif'; x.fillText('Hecho con ReParte · el grupo consulta sin registro', 80, H-70);
  const blob = await new Promise(r=>cv.toBlob(r,'image/png'));
  const file = new File([blob], `reparte-${ev.name.replace(/\W+/g,'-').toLowerCase()}.png`, {type:'image/png'});
  if (navigator.canShare && navigator.canShare({files:[file]})) { try { await navigator.share({files:[file], title: ev.name}); return; } catch(e){ if(e.name==='AbortError') return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); toast('Imagen del resumen descargada');
}
function rr(x,X,Y,w,h,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }

/* ---------- QR (byte mode, EC L, versiones 1–20) ---------- */
function qr(text){
  try { const m = qrMatrix(text); const n=m.length; const px=Math.max(1, Math.floor(180/n));
    return `<div class="qr" style="grid-template-columns:repeat(${n},${px}px);width:${n*px+16}px;height:${n*px+16}px" aria-label="código QR">${m.map(r=>r.map(c=>`<i style="${c?'':'background:transparent'}"></i>`).join('')).join('')}</div>`;
  } catch(e){ return `<div class="card empty">El link es muy largo para un QR. Compártelo por WhatsApp.</div>`; }
}
function qrMatrix(str){
  const data = new TextEncoder().encode(str);
  // capacidad byte mode EC-L por versión y bloques (grupos: [ecPerBlock, [ [blocks,dataCw], ... ]])
  const CAP=[0,17,32,53,78,106,134,154,192,230,271,321,367,425,458,520,586,644,718,792,858];
  const EC=[null,[7,[[1,19]]],[10,[[1,34]]],[15,[[1,55]]],[20,[[1,80]]],[26,[[1,108]]],[18,[[2,68]]],[20,[[2,78]]],[24,[[2,97]]],[30,[[2,116]]],[18,[[2,68],[2,69]]],[20,[[4,81]]],[24,[[2,92],[2,93]]],[26,[[4,107]]],[30,[[3,115],[1,116]]],[22,[[5,87],[1,88]]],[24,[[5,98],[1,99]]],[28,[[1,107],[5,108]]],[30,[[5,120],[1,121]]],[28,[[3,113],[4,114]]],[28,[[3,107],[5,108]]]];
  let ver=1; while(ver<=20 && CAP[ver]<data.length) ver++; if(ver>20) throw new Error('too long');
  const size = ver*4+17; const [ecLen, groups] = EC[ver];
  const totalData = groups.reduce((a,[b,c])=>a+b*c,0);
  // bitstream
  const bits=[]; const put=(v,n)=>{ for(let i=n-1;i>=0;i--) bits.push((v>>i)&1); };
  put(4,4); put(data.length, ver<10?8:16); data.forEach(b=>put(b,8));
  put(0, Math.min(4, totalData*8-bits.length)); while(bits.length%8) bits.push(0);
  const cw=[]; for(let i=0;i<bits.length;i+=8) cw.push(parseInt(bits.slice(i,i+8).join(''),2));
  for(let p=0; cw.length<totalData; p++) cw.push(p%2?0x11:0xEC);
  // GF(256)
  const EXP=new Array(512), LOG=new Array(256); for(let i=0,v=1;i<255;i++){ EXP[i]=v; LOG[v]=i; v<<=1; if(v&256) v^=0x11D; } for(let i=255;i<512;i++) EXP[i]=EXP[i-255];
  const mul=(a,b)=>(!a||!b)?0:EXP[LOG[a]+LOG[b]];
  let gen=[1]; for(let i=0;i<ecLen;i++){ const ng=new Array(gen.length+1).fill(0); for(let j=0;j<gen.length;j++){ ng[j]^=gen[j]; ng[j+1]^=mul(gen[j],EXP[i]); } gen=ng; }
  const blocks=[]; let pos=0; groups.forEach(([cnt,len])=>{ for(let b=0;b<cnt;b++){ const d=cw.slice(pos,pos+len); pos+=len; const r=d.concat(new Array(ecLen).fill(0)); for(let i=0;i<d.length;i++){ const c=r[i]; if(c) for(let j=0;j<gen.length;j++) r[i+j]^=mul(gen[j],c); } blocks.push({d, e:r.slice(d.length)}); } });
  const out=[]; const maxD=Math.max(...blocks.map(b=>b.d.length)); for(let i=0;i<maxD;i++) blocks.forEach(b=>{ if(i<b.d.length) out.push(b.d[i]); }); for(let i=0;i<ecLen;i++) blocks.forEach(b=>out.push(b.e[i]));
  // matriz
  const M=Array.from({length:size},()=>new Array(size).fill(null));
  const setF=(r,c,v)=>{ if(r>=0&&r<size&&c>=0&&c<size) M[r][c]=v; };
  const finder=(r,c)=>{ for(let i=-1;i<=7;i++) for(let j=-1;j<=7;j++){ const on=(i>=0&&i<=6&&j>=0&&j<=6)&&(i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4)); setF(r+i,c+j,on?1:0); } };
  finder(0,0); finder(0,size-7); finder(size-7,0);
  const AL=[[],[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50],[6,30,54],[6,32,58],[6,34,62],[6,26,46,66],[6,26,48,70],[6,26,50,74],[6,30,54,78],[6,30,56,82],[6,30,58,86],[6,34,62,90]][ver];
  AL.forEach(r=>AL.forEach(c=>{ if(M[r][c]!==null) return; for(let i=-2;i<=2;i++) for(let j=-2;j<=2;j++) setF(r+i,c+j,(Math.max(Math.abs(i),Math.abs(j))!==1)?1:0); }));
  for(let i=8;i<size-8;i++){ if(M[6][i]===null) M[6][i]=i%2?0:1; if(M[i][6]===null) M[i][6]=i%2?0:1; }
  M[size-8][8]=1;
  const fmtPos=[]; for(let i=0;i<9;i++){ if(i!==6){ fmtPos.push([8,i]); fmtPos.push([i,8]); } } for(let i=0;i<8;i++){ fmtPos.push([8,size-1-i]); fmtPos.push([size-1-i,8]); }

  for(let right=size-1; right>=1; right-=2){ if(right===6) right=5; for(let vert=0; vert<size; vert++){ for(let j=0;j<2;j++){ const c=right-j; const up=((right+1)&2)===0; const r=up?size-1-vert:vert; if(isFunc[r][c]) continue; M[r][c]= bi<dbits.length ? dbits[bi++] : 0; } } }
  // máscara: probar 8 y elegir la de menor penalización
  const masks=[(r,c)=>(r+c)%2===0,(r,c)=>r%2===0,(r,c)=>c%3===0,(r,c)=>(r+c)%3===0,(r,c)=>(Math.floor(r/2)+Math.floor(c/3))%2===0,(r,c)=>(r*c)%2+(r*c)%3===0,(r,c)=>((r*c)%2+(r*c)%3)%2===0,(r,c)=>((r+c)%2+(r*c)%3)%2===0];
  let best=null, bestPen=Infinity;
  for(let mk=0;mk<8;mk++){
    const G=M.map((row,r)=>row.map((v,c)=>isFunc[r][c]?v:(v^(masks[mk](r,c)?1:0))));
    // formato (EC L = 01)
    let f=(1<<3)|mk; let rem=f; for(let i=0;i<10;i++) rem=(rem<<1)^((rem>>>9)&1?0x537:0); const fb=((f<<10)|rem)^0x5412;
    const bitsF=[]; for(let i=14;i>=0;i--) bitsF.push((fb>>i)&1);
    const a=[[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
    const b=[[size-1,8],[size-2,8],[size-3,8],[size-4,8],[size-5,8],[size-6,8],[size-7,8],[8,size-8],[8,size-7],[8,size-6],[8,size-5],[8,size-4],[8,size-3],[8,size-2],[8,size-1]];
    bitsF.forEach((bit,i)=>{ G[a[i][0]][a[i][1]]=bit; G[b[i][0]][b[i][1]]=bit; });
    let pen=0; for(let r=0;r<size;r++){ let run=1; for(let c=1;c<size;c++){ if(G[r][c]===G[r][c-1]){ run++; if(run===5) pen+=3; else if(run>5) pen++; } else run=1; } }
    for(let c=0;c<size;c++){ let run=1; for(let r=1;r<size;r++){ if(G[r][c]===G[r-1][c]){ run++; if(run===5) pen+=3; else if(run>5) pen++; } else run=1; } }
    let dark=0; G.forEach(row=>row.forEach(v=>dark+=v)); pen += Math.floor(Math.abs(dark*100/(size*size)-50)/5)*10;
    if(pen<bestPen){ bestPen=pen; best=G; }
  }
  return best;
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-go],[data-act],[data-exp],[data-key],[data-cur],[data-payer],[data-among],[data-pay],[data-claim]');
  if (!t) return;
  const ev = route.id ? db.events[route.id] : null;
  if (t.dataset.go){ e.preventDefault(); ui.sheet=null; go(t.dataset.go); return; }
  if(t.dataset.exp && (!canManage(ev)||ev.closed)){ ui.sheet={type:'detail',id:t.dataset.exp}; render(); return; }
  if (t.dataset.exp){ if (ev.closed) { toast('El evento está cerrado. Reábrelo para editar.'); return; } requireName(ev, ()=>startCapture(ev, ev.expenses.find(x=>x.id===t.dataset.exp))); return; }
  if (t.dataset.key !== undefined){ const c=ui.cap; let a=c.amount; const k=t.dataset.key;
    if(k==='⌫') a=a.slice(0,-1); else if(k==='.'){ if(!a.includes('.')) a=(a||'0')+'.'; } else { if(a.includes('.') && a.split('.')[1].length>=2) return; if(a.replace('.','').length>=9) return; a = a==='0'?k:a+k; }
    c.amount=a; render(); return; }
  if (t.dataset.cur){ ui.cap.cur=t.dataset.cur; render(); return; }
  if (t.dataset.payer){ ui.cap.payerId=t.dataset.payer; render(); return; }
  if (t.dataset.among){ const c=ui.cap, id=t.dataset.among; if(c.among.includes(id)){ if(c.among.length>1) c.among=c.among.filter(x=>x!==id); } else c.among.push(id); render(); return; }
  if (t.dataset.pay !== undefined){ ui.sheet={type:'pay', i:+t.dataset.pay}; render(); return; }
  if(t.dataset.claim){ if(!ev.members.some(m=>m.id===t.dataset.claim)) return; ev.meId=t.dataset.claim; persist(); ui.sheet=null; render(); return; }
  const act = t.dataset.act;
  const mutations=['capture','save-cap','delete-cap','add-member','mark-paid','mark-partial','close-event','confirm-close','reopen'];
  if(mutations.includes(act) && !guard(ev,['mark-paid','mark-partial','reopen'].includes(act))) return;
  switch(act){
    case 'undo': if(undoFn){ const f=undoFn; undoFn=null; $('#toast')?.remove(); f(); } break;
    case 'close-sheet': if(t.classList.contains('backdrop') && e.target!==t) break; ui.sheet=null; ui.pendingAfterName=null; render(); break;
    case 'view-person': ui.sheet={type:'viewer'}; render(); break;
    case 'backup': downloadBackup(); break;
    case 'resolve-conflict': await resolveConflict(ev); break;
    case 'sync-now': await syncAll(); render(); break;
    case 'capture': requireName(ev, ()=>startCapture(ev)); break;
    case 'cancel-cap': ui.cap=null; if(ui.externalDb){db=ui.externalDb;ui.externalDb=null;} go('#/e/'+ev.id); break;
    case 'toggle-split': ui.cap.splitOpen=!ui.cap.splitOpen; render(); break;
    case 'edit-fx': ui.sheet={type:'fx'}; render(); break;
    case 'save-cap': saveCapture(ev); break;
    case 'delete-cap': { const id=ui.cap.editId; const idx=ev.expenses.findIndex(x=>x.id===id); if(idx<0) break; const [removed]=ev.expenses.splice(idx,1); save(); ui.cap=null; go('#/e/'+ev.id); toast('Gasto borrado', ()=>{ if(!undoAllowed(ev)) return; ev.expenses.splice(idx,0,removed); save(); render(); }); break; }
    case 'add-member': ui.sheet={type:'member'}; render(); break;
    case 'copy-link': { const u=new URL(location.href);u.search='';u.hash=ev.sync?.token?'live='+ev.sync.token:'e='+await encodeEvent(ev); (await copy(u.toString())) ? toast('Link copiado') : toast('No se pudo copiar'); break; }
    case 'copy-pay': { const ok = await copy(t.dataset.text); if(ok){ t.textContent='Copiado ✓'; t.classList.remove('primary'); t.classList.add('ok'); setTimeout(()=>{ if(document.body.contains(t)){ t.textContent='Copiar todo'; t.classList.add('primary'); t.classList.remove('ok'); } },1600); } else toast('No se pudo copiar'); break; }
    case 'mark-paid': requireName(ev, ()=>markPaid(ev, +t.dataset.i)); break;
    case 'mark-partial': ui.sheet={type:'partial', i:+t.dataset.i}; render(); break;
    case 'close-event': requireName(ev, ()=>{ ui.sheet={type:'close'}; render(); }); break;
    case 'confirm-close': ev.closed=true; ev.closedAt=today(); ev.fee=null; save(); ui.sheet=null; go('#/e/'+ev.id+'/resumen'); break;
    case 'reopen': if(ev.payments.length && !confirm('Ya hay pagos registrados. Al cambiar gastos se pueden recalcular los destinatarios; los pagos se conservarán. ¿Reabrir?')) break; ev.closed=false; save(); render(); toast('Evento reabierto'); break;
    case 'share-image': shareImage(ev); break;
  }
});

/* ---------- conexión opcional: Supabase REST, sin dependencias ---------- */
const cloud = {
  url: document.querySelector('meta[name="reparte-supabase-url"]')?.content.replace(/\/$/,'') || '',
  key: document.querySelector('meta[name="reparte-supabase-key"]')?.content || '',
  session:null, busy:false, error:'', opening:null, email:''
};
try { cloud.session=JSON.parse(localStorage.getItem('reparte.session')); } catch(e){}
const configured = () => /^https:\/\//.test(cloud.url) && !!cloud.key;
function storeSession(session){
  cloud.session={...session,expires_at:session.expires_at||Math.floor(Date.now()/1000)+session.expires_in};
  localStorage.setItem('reparte.session',JSON.stringify(cloud.session));
}
async function cloudRequest(path,body,token){
  if(!configured()) throw Error('La conexión aún no está habilitada.');
  const headers={apikey:cloud.key,'Content-Type':'application/json'};
  if(token) headers.Authorization='Bearer '+token;
  const res=await fetch(cloud.url+path,{method:body===undefined?'GET':'POST',headers,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store',signal:AbortSignal.timeout(15000)});
  const value=await res.json().catch(()=>null);
  if(!res.ok){ const err=Error(value?.message||value?.msg||'No se pudo conectar. Tus cambios siguen en este dispositivo.'); err.code=value?.code; throw err; }
  return value;
}
async function accessToken(){
  if(!cloud.session) throw Error('Conecta tu correo para guardar en la nube.');
  if(cloud.session.expires_at<Date.now()/1000+60){
    const next=await cloudRequest('/auth/v1/token?grant_type=refresh_token',{refresh_token:cloud.session.refresh_token});
    storeSession(next);
  }
  return cloud.session.access_token;
}
function scheduleSync(){ clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncAll(),500); }
function syncStatus(ev){
  if(ev.sync?.conflict) return 'Hay cambios en otro dispositivo. Conservamos tu copia; descárgala antes de cargar la versión de la nube.';
  if(ev.sync?.token){
    if(!navigator.onLine) return 'Sin conexión. Ves la última copia guardada.';
    if(ev.role==='viewer') return cloud.error?'No se pudo actualizar. Ves la última copia guardada.':'Consulta compartida · se actualiza mientras esté abierta.';
    if(ev.sync.last!==JSON.stringify(publicEvent(ev))) return 'Cambios guardados aquí, pendientes de enviar.';
    return 'Guardado en la nube · el grupo puede consultar los cambios.';
  }
  return ev.role==='owner'?'Guardado en este navegador. Conecta tu correo para respaldar y compartir actualizaciones.':'Copia de consulta; no se actualiza sola.';
}
function connectionScreen(){
  return `<div class="screen"><div class="top"><button class="back" data-go="#/">‹ Inicio</button></div><div class="body">${Ill('respaldo')}<h1 class="h1">Tu cuenta, a salvo</h1>
  <p class="sub">Como organizador, conecta tu correo para recuperar eventos en otro teléfono. El grupo consulta sin registrarse. Todos los gastos se comparten; las CLABEs se quedan en este navegador.</p>
  ${!configured()?'<div class="card" style="margin-top:20px">La conexión aún no está habilitada. Mientras tanto, descarga un respaldo y comparte copias de consulta.</div>':cloud.session?`<p class="sub">Conectado como ${esc(cloud.session.user.email)}</p><button class="btn secondary" data-act="sync-now">Guardar y recuperar eventos</button>`:`<form id="f-connect"><div class="field"><div class="lbl">Tu correo</div><input name="email" type="email" required autocomplete="email" value="${esc(cloud.email)}"></div><button class="btn primary" style="margin-top:12px">Enviar código</button></form>${cloud.email?`<form id="f-verify"><div class="field"><div class="lbl">Código del correo</div><input name="code" inputmode="numeric" autocomplete="one-time-code" required maxlength="10"></div><button class="btn primary" style="margin-top:12px">Conectar y recuperar</button></form>`:''}`}
  ${cloud.error?`<p class="sub rojo" role="status">${esc(cloud.error)}</p>`:''}
  <button class="btn secondary" style="margin-top:20px" data-act="backup">Descargar respaldo de este dispositivo</button>
  <div class="field"><label for="restore-file">Restaurar un respaldo</label><input id="restore-file" type="file" accept="application/json,.json"></div>
  <p class="note">El respaldo contiene tus eventos y datos bancarios locales. Guárdalo para ti. No incluye tu sesión de correo.</p></div></div>`;
}
async function connectSubmit(form){
  const button=form.querySelector('button'); button.disabled=true;
  cloud.error='';
  try {
    if(form.id==='f-connect'){
      const email=form.elements.email.value.trim();
      await cloudRequest('/auth/v1/otp',{email,create_user:true}); cloud.email=email;
      toast('Revisa tu correo y escribe el código.');
    } else {
      const result=await cloudRequest('/auth/v1/verify',{email:cloud.email,token:form.elements.code.value.trim(),type:'email'});
      storeSession(result); await syncAll(); toast('Correo conectado.');
    }
  } catch(e){ cloud.error=e.message; }
  render();
}
async function syncAll(){
  if(cloud.busy || !configured() || !navigator.onLine) return;
  cloud.busy=true; const before=JSON.stringify(db.events); const oldError=cloud.error;
  try {
    if(cloud.session){
      const token=await accessToken();
      // Fetch before publishing so recovery never replaces a newer server version.
      const rows=await cloudRequest('/rest/v1/reparte_events?select=id,snapshot,version,view_token,owner_id',undefined,token);
      const remote=new Map(rows.map(row=>[row.id,row]));
      for(const row of rows){
        const local=db.events[row.id];
        if(!local || local.role==='viewer') installOwned(row);
        else if(local.sync?.ownerId===cloud.session.user.id && row.version>local.sync.version){
          if(ui.cap || local.sync.last!==JSON.stringify(publicEvent(local))) local.sync.conflict=true;
          else installOwned(row);
        }
      }
      for(const ev of Object.values(db.events)){
        if(!canManage(ev) || ev.sync?.conflict || !ev.members.length) continue;
        const snapshot=publicEvent(ev), serialized=JSON.stringify(snapshot);
        if(ev.sync?.last===serialized) continue;
        if(remote.has(ev.id) && !ev.sync){ ev.sync={conflict:true,ownerId:cloud.session.user.id}; continue; }
        try {
          const result=await cloudRequest('/rest/v1/rpc/save_reparte_event',{p_id:ev.id,p_snapshot:snapshot,p_version:ev.sync?.version||0},token);
          // Preserve edits made while this request was in flight; last is the sent snapshot.
          ev.sync={ownerId:cloud.session.user.id,version:result.version,token:result.view_token,last:serialized};
        } catch(e){ if(e.code==='40001') ev.sync={...ev.sync,conflict:true}; else throw e; }
      }
    }
    const ev=route.id && db.events[route.id];
    if(ev?.role==='viewer' && ev.sync?.token) await fetchLive(ev.sync.token,false);
    cloud.error='';
  } catch(e){ cloud.error=e.message; }
  finally {
    cloud.busy=false;
    if(before!==JSON.stringify(db.events)) persist();
    // Avoid losing text inputs or interrupting an open keypad.
    if((before!==JSON.stringify(db.events)||oldError!==cloud.error) && !ui.cap && !ui.sheet && !['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) render();
  }
}
function installOwned(row){
  const old=db.events[row.id]; const ev=validateEvent(row.snapshot);
  ev.role='owner'; ev.meId=ev.organizerId;
  // Bank details are local only, never supplied by a reader or the public RPC.
  ev.members.forEach(m=>{const prev=old?.role==='owner' && old.members.find(p=>p.id===m.id); if(prev){m.clabe=prev.clabe;m.bank=prev.bank;} });
  ev.sync={ownerId:row.owner_id,version:row.version,token:row.view_token,last:JSON.stringify(publicEvent(ev))};
  db.events[ev.id]=ev;
}
async function fetchLive(token,navigate){
  if(!/^[0-9a-f-]{36}$/i.test(token)) throw Error('El enlace no es válido.');
  const result=await cloudRequest('/rest/v1/rpc/read_reparte_event',{p_token:token});
  if(!result) throw Error('No se encontró este evento.');
  const ev=validateEvent(result.snapshot); const old=db.events[ev.id];
  if(old?.role!=='owner'){
    ev.role='viewer'; ev.meId=old?.meId||null;
    ev.sync={token,version:result.version}; db.events[ev.id]=ev; persist();
  }
  if(navigate) go('#/e/'+ev.id);
}
async function openLive(token){
  if(cloud.opening===token) return;
  cloud.opening=token;
  try { await fetchLive(token,true); cloud.error=''; }
  catch(e){ cloud.error=e.message; const cached=Object.values(db.events).find(ev=>ev.sync?.token===token); go(cached?'#/e/'+cached.id:'#/conectar'); toast(cached?'Sin conexión: abrimos la última copia guardada.':e.message); }
  finally { cloud.opening=null; }
}
function downloadBackup(){
  const blob=new Blob([JSON.stringify({format:'reparte-backup-v2',savedAt:new Date().toISOString(),events:db.events,profile:db.profile},null,2)],{type:'application/json'});
  const a=document.createElement('a'), url=URL.createObjectURL(blob); a.href=url;a.download='reparte-respaldo-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function restoreBackup(file){
  if(!file || file.size>10000000) throw Error('Elige un respaldo de hasta 10 MB.');
  const backup=JSON.parse(await file.text());
  if(backup.format!=='reparte-backup-v2'||!backup.events||typeof backup.events!=='object') throw Error('No es un respaldo de ReParte.');
  const restored=Object.values(backup.events).map(raw=>{
    const ev=validateEvent(raw); ev.role=raw.role==='owner'?'owner':'viewer'; ev.meId=ev.role==='owner'?ev.organizerId:null;
    // Restoring data grants no server permissions; Supabase checks the signed-in owner.
    if(raw.sync) ev.sync={ownerId:raw.sync.ownerId,token:raw.sync.token,version:raw.sync.version,last:raw.sync.last,conflict:!!raw.sync.conflict};
    ev.members.forEach(m=>{ const original=raw.members.find(x=>x.id===m.id); m.clabe=String(original.clabe||'').replace(/\D/g,'').slice(0,18); m.bank=bankOf(m.clabe); });
    return ev;
  });
  if(restored.some(ev=>db.events[ev.id])) throw Error('El respaldo contiene eventos que ya están aquí. Restáuralo en otro navegador para no reemplazar cambios.');
  restored.forEach(ev=>db.events[ev.id]=ev);
  if(!db.profile.name && backup.profile){db.profile={name:String(backup.profile.name||'').slice(0,100),clabe:String(backup.profile.clabe||'').replace(/\D/g,'').slice(0,18)};db.profile.bank=bankOf(db.profile.clabe);}
  persist(); scheduleSync(); toast('Respaldo restaurado.'); render();
}
async function resolveConflict(ev){
  if(!confirm('Se descargará un respaldo de tus cambios. Después cargaremos la cuenta de la nube; no se combinarán automáticamente. ¿Continuar?')) return;
  downloadBackup();
  try { const token=await accessToken();const rows=await cloudRequest('/rest/v1/reparte_events?id=eq.'+encodeURIComponent(ev.id)+'&select=id,snapshot,version,view_token,owner_id',undefined,token); if(!rows.length) throw Error('No encontramos la versión de la nube.');installOwned(rows[0]);persist();render(); }
  catch(e){toast(e.message);}
}
document.addEventListener('change',async e=>{if(e.target.id==='restore-file'){try{await restoreBackup(e.target.files[0]);}catch(err){toast(err.message);}}});
window.addEventListener('storage',e=>{
  if(e.key===LS && e.newValue){
    try{
      const incoming=JSON.parse(e.newValue);
      if(ui.cap){ui.externalDb=incoming;toast('Hay cambios en otra pestaña. Tu borrador sigue aquí; cancela para cargar la otra versión.');return;}
      db=incoming;render();
    }catch(err){}
  }
});
window.addEventListener('online',()=>syncAll());
window.addEventListener('focus',()=>syncAll());
document.addEventListener('visibilitychange',()=>{if(!document.hidden) syncAll();});
setInterval(()=>{if(!document.hidden) syncAll();},10000);

window.addEventListener('hashchange', render);
persist();
render();
scheduleSync();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
